---
name: "Flux Local"

on:
  pull_request:
    branches: ["main"]
  # main too (#23). Until now this workflow had only ever run on pull_request —
  # `gh run list --json event` returned exactly ["pull_request"] — so a commit
  # pushed straight to main was validated by nothing. Landing work through PRs
  # is a habit, not a mechanism, and the gap read exactly like coverage.
  push:
    branches: ["main"]

concurrency:
  # Keyed per pull request, but per *commit* on main, so no two main runs ever
  # share a group. `cancel-in-progress: false` alone would not be enough:
  # GitHub cancels a *pending* run when a newer one is queued into the same
  # group regardless of that setting, so three merges in quick succession would
  # lose the middle commit's verdict. Cancelled is at least visible rather than
  # green, but a per-sha group means it does not happen at all.
  group: ${{ github.workflow }}-${{ github.event.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Purely an optimisation, and deliberately pull_request-only. main runs the
  # suite unconditionally instead: ~25s, and main does not move often.
  #
  # This is a choice not to depend on the action, not a claim that it is broken
  # on push. What is measured is that it answers even where it cannot answer
  # well: with no git repo it silently switches to "Using GitHub's REST API to
  # get changed files" and still reports success (#25 repro run 32645197207).
  # Its push-event base would be `github.event.before`, all-zeroes on a
  # branch's first push; what it reports then is UNMEASURED here. On main a
  # wrong "nothing changed" skips every job below, and a skipped job is green —
  # indistinguishable from a pass, which is the shape #23 exists to remove. So
  # main does not consult it at all.
  pre-job:
    name: Flux Local Pre-Job
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    outputs:
      any_changed: ${{ steps.changed-files.outputs.any_changed }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Get Changed Files
        id: changed-files
        uses: tj-actions/changed-files@7dee1b0c1557f278e5c7dc244927139d78c0e22a # v47.0.4
        with:
          # The workflow and its helper script are in here too: a change to
          # either has to be exercised by the jobs it changes, otherwise the
          # only feedback is the next unrelated PR.
          files: |
            kubernetes/**
            .github/workflows/flux-local.yaml
            .github/scripts/**
            scripts/**

  test:
    name: Flux Local Test
    needs: pre-job
    runs-on: ubuntu-latest
    # `!cancelled()` is required, not decoration: pre-job is skipped on push,
    # and a dependant of a skipped job is skipped by default however its own
    # condition reads.
    if: ${{ !cancelled() && (github.event_name == 'push' || needs.pre-job.outputs.any_changed == 'true') }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # `flux build --dry-run` skips postBuild substitution and then
      # base64-decodes every Secret `data:` value, so a surviving ${VAR}
      # literal fails the build -- and in flux-local that happens during
      # collection, so nothing else gets tested either. See the script's
      # docstring for the upstream code and why there is no config knob.
      - name: Stub Flux placeholders in Secret data
        run: python3 .github/scripts/stub-secret-data-placeholders.py kubernetes

      - name: Verify no placeholder survived the stub
        run: python3 .github/scripts/stub-secret-data-placeholders.py --check kubernetes

      # Same class of problem one field over: a ${VAR} in a Kustomization
      # spec.path is not substituted in dry-run either, and an unresolvable
      # path aborts collection for the whole run. This is what kept
      # apps/extras/** out of CI entirely (#37).
      - name: Stub Flux placeholders in Kustomization spec.path
        run: python3 .github/scripts/stub-kustomization-path-vars.py kubernetes

      - name: Verify no path placeholder survived the stub
        run: python3 .github/scripts/stub-kustomization-path-vars.py --check kubernetes

      # v8.4.0, not v8.1.0 (both uses below): before 8.3.0
      # (allenporter/flux-local#1103) an OCIRepository pinned by `ref.digest`
      # reached helm as `--version sha256:...`, which helm refuses ("improper
      # constraint"), so a digest-pinned chart could not pass this job (#202).
      # 8.2.0 also moved the image to helm v4.
      - name: Run flux-local test (base)
        uses: docker://ghcr.io/allenporter/flux-local:v8.4.0
        with:
          args: test --enable-helm --all-namespaces --path /github/workspace/kubernetes/flux/cluster -v
      # The extras run that used to follow lives in ferry133/jg-extras since
      # split-extras 5.3 (the directory is gone from here).

  scripts:
    name: Repo Script Tests
    needs: pre-job
    runs-on: ubuntu-latest
    # Same `!cancelled()` reasoning as `test` above: pre-job is skipped on
    # push, and a dependant of a skipped job is skipped by default.
    if: ${{ !cancelled() && (github.event_name == 'push' || needs.pre-job.outputs.any_changed == 'true') }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # `scripts/check-lan-dns-row.sh` needs yq, and this repo declares no
      # toolchain at all — no .mise.toml, no .tool-versions, no Taskfile. The
      # script's own `command -v yq || exit 1` was correct and unheard, because
      # nothing ran it (#32).
      #
      # Pinned by version AND digest. A version alone is a name, and the thing
      # this repo keeps relearning is that a name is not an instance.
      - name: Install yq
        env:
          YQ_VERSION: v4.48.1
          YQ_SHA256: 99df6047f5b577a9d25f969f7c3823ada3488de2e2115b30a0abb10d9324fd9f
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/yq \
            "https://github.com/mikefarah/yq/releases/download/${YQ_VERSION}/yq_linux_amd64"
          echo "${YQ_SHA256}  /tmp/yq" | sha256sum -c -
          sudo install -m 0755 /tmp/yq /usr/local/bin/yq
          yq --version

      # `scripts/check-envsubst-parses.sh` runs Flux's OWN substitution engine.
      # It refuses to approximate it, and that refusal is the point: the guard
      # that shipped #123 DID approximate it (sed rewriting `$$` to `$`), was
      # faithful for the code, blind to the comments, and three clusters went
      # Ready=False BuildFailed on a comment. Nothing made of regexes catches
      # that; the binary catches it on the first run.
      #
      # Pinned by version AND digest, same reasoning as yq above: a version is
      # a name, and a name is not an instance.
      - name: Install flux CLI
        env:
          FLUX_VERSION: 2.7.4
          FLUX_SHA256: cc74636a893994f526f3742adbe5c087f2b4806cf625a0b7666b83bfdb968efe
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/flux.tar.gz \
            "https://github.com/fluxcd/flux2/releases/download/v${FLUX_VERSION}/flux_${FLUX_VERSION}_linux_amd64.tar.gz"
          echo "${FLUX_SHA256}  /tmp/flux.tar.gz" | sha256sum -c -
          tar -xzf /tmp/flux.tar.gz -C /tmp flux
          sudo install -m 0755 /tmp/flux /usr/local/bin/flux
          flux version --client

      # The repo's only behavioural regression test for a daily-check row, and
      # until now nothing executed it. The row it guards has shipped broken
      # twice (#16, #18); a test nobody runs and a test that passes are the
      # same colour on this page.
      - name: daily-check LAN DNS row
        run: bash scripts/check-lan-dns-row.sh

      # #43: this row was green on a cluster nothing outside could reach. The
      # `no public record -> fail` case below is the one that used to render
      # as a pass, so it is the case that has to keep failing.
      - name: daily-check external endpoint row
        run: bash scripts/check-external-endpoint-row.sh

      # #49: checks 19 (`Off-site backup freshness`) and 20 (`Off-site backup coverage`) are both source-side, so a destination that was
      # emptied, repointed or never replicated still rendered as a healthy
      # backup line. The row this guards has to keep `fail` (the archive is not
      # there) apart from `skip` (we could not look) — the script asserts that
      # separation directly, not just per-case, because an edit collapsing them
      # would leave every individual case still looking reasonable.
      - name: daily-check off-site destination row
        run: bash scripts/check-offsite-destination-row.sh

      # #66: `latest` froze on spegel and three green signals hid a months-old
      # image. Check 23 compares the running digest against the spec pin; the
      # case that has to keep warning is running≠pinned — the pin present and
      # useless is #66 with extra steps.
      - name: daily-check im image pin row
        run: bash scripts/check-image-pin-row.sh

      # fleet-ops#11: an expired Omni SA key passes every other row — the pod
      # stays Running and the break is a talosctl auth error at call time.
      # Check 24 reads the expiry recorded at issuance. The cases that must
      # keep leaving ok are the opener's negative controls (a past date, a
      # date inside seven days) — as warn, never fail, since FAIL_COUNT gates
      # the dead-man ping. The guard also derives every workload that holds a
      # key from the Secrets and asserts each carries the annotation.
      - name: daily-check Omni SA key expiry row
        run: bash scripts/check-omni-key-expiry-row.sh

      # #99: the same shape for factory's fine-grained PAT, which breaks
      # provisioning halfway rather than a diagnostic tool. The case that must
      # keep holding is that the row states its own weakness — no key id — in
      # its output, not only in a comment.
      - name: daily-check GitHub token expiry row
        run: bash scripts/check-github-token-expiry-row.sh

      # #70: a container-runtime ${VAR} that postBuild rewrote to "" locked
      # every terminal out behind green signals. Every ${X} under kubernetes/
      # must be declared in the vocabulary or written $${X}; the guard proved
      # it catches the pre-#69 tree.
      - name: substitution vocabulary
        run: bash scripts/check-substitution-vocabulary.sh

      # README.md claimed the sample documented all required keys; it carries a
      # fraction of them, so FACTORY_*, BACKUP_R2_* and DAILY_CHECK_* readers
      # found nothing and had no way to tell absence from "not needed". The
      # counts are deliberately not written into either file — any PR adding a
      # variable would invalidate them — so this prints them instead and fails
      # if the file stops calling itself an example.
      - name: cluster-secrets sample subset claim
        run: bash scripts/check-sample-subset-claim.sh

      # #54: on an appliance the mandatory backup ran nightly, succeeded and
      # staged nothing, because it only ever captured databases and an appliance
      # has none. The case that must not regress is `staged_bytes: 0` reporting
      # `ok` — and the branch ORDER is what decides it: "no databases installed"
      # sits next to it and used to win first. That is not hypothetical; it was
      # the state of the fix until this test failed on its first run.
      - name: daily-check backup coverage row
        run: bash scripts/check-backup-coverage-row.sh

      # #83: the row was `kubectl -n db get cronjob postgres-backup`. #73 moved
      # the claudecode postgres into base, where its CronJob is in namespace
      # `claudecode`, so the row stopped seeing it — and on a cluster with no
      # extras postgres it rendered `skip`, next to a green off-site row, while
      # jg-jiahd's backup had never completed once in two months. The two cases
      # that must keep holding are "never succeeded -> fail" and "a CronJob
      # outside `db` is reported at all"; the guard asserts both again as
      # cross-case checks, because per-case expectations can all be edited to
      # match a broken row in one pass.
      - name: daily-check backup CronJob row
        run: bash scripts/check-backup-cronjob-row.sh

      # #215: rows 2 and 15 discarded kubectl's stderr and exit status, so a
      # list that could not be read was an empty not-Ready list, i.e. ✅. The
      # cases that must keep holding are the unreadable ones never rendering ok;
      # healthy and not-Ready are there so a row that warns at everything fails.
      - name: daily-check Flux rows when the list cannot be read
        run: bash scripts/check-flux-rows-unmeasured.sh

      # #217: the same shape in rows 3, 4, 5, 8, 9, 10, 13, 14 and 16 (row 13
      # emitted no row at all). Rows 5 and 9 are held the other way too: an
      # empty answer there is real and must stay ok.
      - name: daily-check nine more rows when kubectl fails
        run: bash scripts/check-nine-rows-unmeasured.sh

      # #85: the row's subject used to be a `*-backup` NAME, which is a
      # convention and not a contract -- a backup called `pg-dump-nightly` was
      # invisible and the count line would simply have been one smaller. The
      # subject is now a union (declared label OR that name), and this guard
      # holds up the half that is ours: every `*-backup` CronJob shipped from
      # this repo must declare the label. Miss it and the union silently
      # degrades to name-matching, which renders exactly like a working one.
      - name: backup CronJobs declare the label
        run: bash scripts/check-backup-label.sh

      # #104: `record ok` appended only the name, so a message passed to an ok
      # row vanished — no error, no trace. One caller did it (check 17a) and
      # its sentence was missing from every report for 25 days. The case that
      # must keep failing is an ok row whose message disappears; the warn
      # control exists so a broken harness cannot render as a pass.
      - name: daily-check record() keeps an ok row's message
        run: bash scripts/check-record-ok-keeps-msg.sh

      # #103: `im` emitted `omni-sa-key-expires: "${TALOS_MCP_SA_KEY_EXPIRES:-}"`.
      # On a cluster holding no talos-mcp key that variable is correctly empty,
      # kustomize had already dropped the quotes, and the rendered line became
      # `...expires:` -- which YAML reads as null. app-template rejects a
      # non-string annotation value and the HelmRelease sat UpgradeFailed for
      # 31 hours. Two more copies were latent in extras/factory. The case that
      # must keep failing is an annotation value that can render empty.
      - name: annotation substitutions cannot render empty
        run: bash scripts/check-annotation-substitution-default.sh

      # #112 (routed from fleet-ops#13): the unconfigured branch printed an
      # honest message and then `exit 0`, so the Job read `Complete 1/1` and
      # the only watcher's ABSENCE looked exactly like a healthy cluster --
      # jg-jcc1 went from creation to discovery with zero successful off-site
      # backups behind that green. On such a cluster the email and the dead-man
      # are gated on the same five `default('')` fields, so neither could ever
      # speak; the exit status is the one channel that needs no cluster.yaml
      # value and no extra RBAC. Two cases must keep failing: an unconfigured
      # cluster that exits 0, and a CONFIGURED run that stops exiting 0 -- the
      # second is what would drag row-level failures into Job status and repeat
      # #6, where a check that fires on every run gets switched off.
      - name: unconfigured daily-check fails its Job
        run: bash scripts/check-unconfigured-exits-nonzero.sh

      # #114: msmtp failing produced one line on stderr, then the run sent a
      # SUCCESS dead-man ping and exited 0 -- on the day the mail broke, every
      # outside channel said the cluster was fine. Worse than #112's silence,
      # which at least emitted nothing. Two mechanisms carry it and their
      # premises must stay DIFFERENT: the /fail ping needs a ping URL and
      # survives the Job's 24h TTL; exit 75 needs nothing and covers "SMTP set,
      # ping URL unset", which the template permits. The cases that must keep
      # failing: an undelivered report that pings success, one that exits 0,
      # and a mailer outage folded into FAIL_COUNT -- the last would make a
      # broken mailer indistinguishable from a sick cluster.
      - name: an undelivered daily-check report is visible
        run: bash scripts/check-mail-failure-is-visible.sh

      # #117: offsite-backup's post-upload status patch spoke only when it
      # FAILED, so a successful run logged one status write where the server
      # recorded two. "The patch ran and succeeded" and "the patch never ran"
      # were the same log, and the log is what people read -- fleet-ops#13
      # concluded from `grep -c "published status" = 1` that the table was
      # still written before the upload and that #63 was closed unfixed. Four
      # claims, all wrong. The cases that must keep failing: a successful patch
      # that prints nothing, a failed one that claims success, and a success
      # line that does not sit after the upload line.
      - name: the offsite status patch speaks on success too
        run: bash scripts/check-offsite-status-patch-logs.sh
      # #118: the report carries no row numbers -- `record()` emits the NAME --
      # so a number is repo dialect, resolvable only through the legend in
      # daily-check/README.md. That legend was missing 7 of 26 rows, 6 of them
      # cited in prose and in operator-facing manifests, and the legend itself
      # cited two numbers it did not define. The cost was already paid: "check
      # 20 must appear" went into fleet-ops#12/#13 as an acceptance condition,
      # naming something the accepter cannot see in the artefact. The case that
      # must keep failing: any number cited anywhere that the legend does not
      # define -- including a new row added to the script without a legend
      # entry, which is how the gap opened in the first place.
      - name: every cited daily-check row number resolves
        run: bash scripts/check-row-numbers-resolve.sh

      # #123: on a cold cluster the postgres migration Job raced the database
      # and lost -- pod up while postgres still waited for its PVC, the default
      # backoffLimit of 6 spent on `connection refused`, Failed 73 seconds
      # before postgres came Ready. It then self-heals: ttl GCs the Failed Job
      # and the next Kustomization interval rebuilds it, succeeding in four
      # seconds. That is why it needs a guard and not a bug report -- the
      # database has NO SCHEMA for one Flux interval (53 minutes as measured)
      # while `im` is free to connect, and nothing outside looks wrong. The
      # cases that must keep failing: no initContainer, one that does not call
      # pg_isready, an unbounded wait, and a give-up message that does not say
      # the migration was skipped.
      - name: the postgres migration waits for its database
        run: bash scripts/check-migrate-waits-for-db.sh

      # #126: the offsite-backup CronJob had no activeDeadlineSeconds while
      # carrying concurrencyPolicy Forbid, so one stuck run blocks every later
      # schedule -- and none of the three places you would look says so: the
      # Job stays Running, startingDeadlineSeconds stops counting missed starts
      # after an hour, and daily-check rows 19/21 only warn at 26h. A day late.
      # The cases that must keep failing: no bound at all, and a bound at or
      # below the slowest run measured to SUCCEED (807s, #124) -- too small a
      # number turns "slow" into "no backup", which is worse than the stall.
      - name: offsite-backup cannot run forever
        run: bash scripts/check-backup-has-a-deadline.sh

      # #143: daily-check and offsite-backup each declared
      # failedJobsHistoryLimit: 3 alongside a TTL shorter than three of their
      # own intervals, so the stricter knob won SILENTLY and one survived
      # where three were promised. That is normally just shorter history --
      # but on a cluster with no healthchecks ping URL the Failed Job is the
      # only alerting channel, and there the difference is between a failure
      # someone can still find and one already collected. The interval is
      # recomputed from the schedule, because a comment saying "daily"
      # survives an edit that makes it hourly. The case that must keep
      # failing: any CronJob whose declared limit its own TTL cannot deliver.
      - name: CronJob retention is not self-contradictory
        run: bash scripts/check-cronjob-retention.sh

      # #123 (the second time): two comments explaining that you must DOUBLE
      # the dollar were themselves written with a single one, and envsubst --
      # which scans comments too -- refused the whole Job with "unable to parse
      # variable name". claudecode-db went Ready=False BuildFailed on all three
      # clusters. The case that must keep failing: any manifest Flux will
      # substitute that envsubst cannot parse. Scope is deliberately narrow --
      # only paths a Kustomization substitutes, minus `substitute: disabled` --
      # because seven files in this repo do not parse and are correct.
      - name: everything Flux substitutes actually parses
        run: bash scripts/check-envsubst-parses.sh

      # #136 (from jg-cluster-template#191): claude-workspace read the BULK
      # tier's ${DEFAULT_STORAGE_CLASS}, so moving that tier moved a bound
      # PVC's storageClassName -- immutable, and the HelmRelease wedged for
      # good while Helm rolled back, so nothing stopped serving and the only
      # symptom was a release that never reconciled again. A third cluster was
      # already pinning its bulk default back to local-path to avoid it. The
      # cases that must keep failing: either claim back on the bulk name, the
      # two claims sharing one variable, a hard-coded class, and `retain`
      # going away -- that last one turns a blocked upgrade into a deleted
      # volume, which is strictly worse than what this guard is named for.
      - name: claudecode claims do not share a storage class
        run: bash scripts/check-claudecode-pvc-classes.sh

      # im-onsite-operator-tools: a second Talos credential -- os:operator, with
      # a key inside -- joins the talos-mcp sidecar. What makes that acceptable
      # is insideman's boundary (sidecar only, never the app container), held
      # by three lines in two files that nothing else ties together. The
      # failure that matters is silent: an env path and a mount path that
      # disagree make the server read 0 bytes at its path (== absent, by
      # design) while the real credential sits unread -- reboot_node gone,
      # every signal green. The cases that must keep failing: the key moved to
      # stringData, the two paths diverging, the mount losing readOnly, the app
      # or an init container mounting or env-reading the Secret, POD_IP losing
      # its fieldRef. --self-test runs each of them against a scratch copy.
      - name: operator credential stays in the sidecar
        run: bash scripts/check-operator-credential-isolation.sh && bash scripts/check-operator-credential-isolation.sh --self-test

      # #145: the claudecode state archive mounts PVCs directly, because
      # `kubectl exec` needs a RUNNING pod and a scaled-to-0 instance has
      # none -- its content never reached off-site storage. Mounting removes
      # the pod, and with it the old discriminator: instances used to be
      # DISCOVERED by mount path precisely so a hardcoded list could not
      # silently miss one, and a pod spec has to name the claims it mounts.
      # This guard is what makes the list safe: the subject is the declared
      # claim set, read from the HelmRelease that declares it. The case that
      # must keep failing: a persistence key declared on the base `im`
      # release that the archive does not mount -- an archive short one
      # member is produced, uploaded and reported like a complete one.
      - name: the state archive covers every declared claim
        run: bash scripts/check-archive-covers-claims.sh

      # #145 condition 5: the session cap is the one part of archive.sh that
      # can be wrong without anything downstream noticing -- a cap matching
      # nothing still produces an archive, uploads it and logs a size, and
      # "skipped 0" is also what "nothing to skip" prints. This guard runs the
      # shipped block (extracted from the ConfigMap, never re-typed) against a
      # synthetic tree. The case that must keep failing: a cap that keeps the
      # OLDEST transcripts, which drops the same NUMBER of files and yields an
      # archive of the same shape. ⚠️ It assumes the on-disk layout rather
      # than testing it; that is the live run's job.
      - name: the session cap keeps the newest and spares memory/
        run: bash scripts/check-session-cap-trims.sh

      # #145 + #146: the claudecode archive shares a bucket prefix with the DB
      # off-site archive, and row 21 used to take the newest object in that
      # prefix regardless of family. The two upload from separate Jobs on
      # separate schedules, so a dead `offsite-backup` under a healthy nightly
      # claudecode upload read GREEN. The case that must keep failing: a
      # system archive 72h old with a 1h-old claudecode object beside it.
      # The guard also asserts the claudecode family is still NAMED in every
      # outcome — scoping the row could drop it, and "we stopped looking" is
      # the same green as "it is fine".
      - name: row 21 answers for the system backup family
        run: bash scripts/check-offsite-family-split.sh

      # #145 + #146 (R3): the claudecode archive has no retention logic of its
      # own — monitoring/backup's prune loop sweeps the whole prefix and
      # therefore decides it, at BACKUP_RETAIN_DAYS. Nobody chose that; it is
      # what the two key shapes produce. The case that must keep failing:
      # either key stops yielding an 8-digit stamp, because the loop then skips
      # that family forever and unbounded growth of a credential-bearing
      # archive looks exactly like nothing happening.
      - name: the retention loop still recognises both archive families
        run: bash scripts/check-prune-covers-both-families.sh

      # #129: the sample told operators CLUSTER_GATEWAY_ADDR was
      # envoy-external's LoadBalancer IP; envoy.yaml binds it to
      # envoy-INTERNAL, and the one that really is envoy-external's
      # (CLOUDFLARE_GATEWAY_ADDR) was missing from the sample altogether. It
      # survived because on an appliance envoy-internal and k8s-gateway SHARE
      # one address, so filling it in wrong produces no symptom -- only
      # full/prosumer can tell. Nothing was ever going to report this and the
      # operator pays. The cases that must keep failing: a comment naming the
      # wrong claimant, and an address claimed under network/ that the sample
      # never mentions.
      - name: sample addresses name their claimant
        run: bash scripts/check-sample-addr-comments.sh
      # #130: nobody watched the kubectl version. Alpine v3.20 ships 1.30.9,
      # jg-jiahd's API server measured v1.36.0 -- six minors against a
      # supported skew of one, with nothing in this repo, the report, or any
      # guard able to say so. And the fix MOVES the number rather than removing
      # it (a pinned ARG instead of a distro default), so the row watches the
      # binary itself. The cases that must keep failing: a big skew that does
      # not warn, a small one that does, an ok row that hides the versions,
      # this row recording `fail` (FAIL_COUNT gates the dead-man), and the
      # three not-measured reasons collapsing into one sentence.
      - name: daily-check kubectl skew row
        run: bash scripts/check-kubectl-skew-row.sh
      # #159: row 27 compares each Cilium agent's backends with the API.
      - name: daily-check Cilium backend row
        run: bash scripts/check-cilium-backend-row.sh
      # Row 28: tenant isolation by structure; every verdict from the real
      # block, kubectl stubbed to the four reads it makes.
      - name: daily-check tenant isolation row
        run: bash scripts/check-tenant-isolation-row.sh
      # #199: row 29 reads each Envoy proxy's connected_state gauge; every
      # verdict from the real block, kubectl/curl/sleep stubbed to what it asks.
      - name: daily-check Envoy xDS row
        run: bash scripts/check-envoy-xds-row.sh
      # #205: row 30 dry-runs a compliant and an outside HTTPRoute in a tenant
      # namespace; every verdict from the real block, kubectl stubbed to the
      # namespace list and the dry-run create (it checks the object it is sent).
      - name: daily-check tenant route admission row
        run: bash scripts/check-tenant-route-admission-row.sh
      # #190: ClusterRole tenant-admin is the only thing a tenant SA is bound
      # to. Its deny list -- Flux/cilium/storage/cluster-scoped kinds,
      # escalate/bind/impersonate, any `*`, writable quota -- and a self-test
      # whose mutations (the three #190 names first) must each fail.
      - name: tenant-admin grants nothing that leaves the namespace
        run: bash scripts/check-tenant-admin-role.sh && bash scripts/check-tenant-admin-role.sh --self-test
      # #191: a tenant HTTPRoute may only claim <tenant>.<domain>. Read from
      # `flux build`, because the first draft was right in source and wrong as
      # built (kustomize stamped a namespace onto the cluster-scoped VAP).
      - name: tenant HTTPRoute hostnames bounded, as built
        run: bash scripts/check-tenant-hostname-policy.sh && bash scripts/check-tenant-hostname-policy.sh --self-test
      # #192: a tenant LoadBalancer Service never takes a platform address --
      # every static pool and both lan-address pools exclude `jg.tenant`, and
      # the admission policy makes that label trustworthy.
      - name: tenant LoadBalancer Services kept off the shared pools
        run: bash scripts/check-tenant-lb-policy.sh && bash scripts/check-tenant-lb-policy.sh --self-test
      # #188: the device-request policy is judged by a real kube-apiserver,
      # not by reading its CEL — the envtest binaries (etcd, kube-apiserver,
      # kubectl), at the fleet's Kubernetes minor, pinned by version and
      # sha512 like flux above. The self-test starts seven apiservers.
      - name: tenant device requests need the devices grant
        env:
          ENVTEST_VERSION: 1.36.0
          ENVTEST_SHA512: 302d6a4c3b7d79b8a6168cd9fd5f18e718048211d25012d969d320e06b39672d17338bcd008c29adf98b41048a6f7d80c90ab0165b4b861497ef74c7bc6c1531
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/envtest.tar.gz \
            "https://github.com/kubernetes-sigs/controller-tools/releases/download/envtest-v${ENVTEST_VERSION}/envtest-v${ENVTEST_VERSION}-linux-amd64.tar.gz"
          echo "${ENVTEST_SHA512}  /tmp/envtest.tar.gz" | sha512sum -c -
          tar -xzf /tmp/envtest.tar.gz -C /tmp
          export KUBEBUILDER_ASSETS=/tmp/controller-tools/envtest
          bash scripts/check-tenant-device-policy.sh && bash scripts/check-tenant-device-policy.sh --self-test
      # #187: secondary networks (Multus) need the l2 grant and stay in the
      # tenant's own namespace. Same envtest binaries, unpacked by the step
      # above; if they are missing the script exits 2 and this step is red.
      # The self-test starts ten apiservers.
      - name: tenant secondary networks need the l2 grant
        run: |
          set -euo pipefail
          export KUBEBUILDER_ASSETS=/tmp/controller-tools/envtest
          bash scripts/check-tenant-l2-policy.sh && bash scripts/check-tenant-l2-policy.sh --self-test
      # #124: offsite-backup used to `apk add` its whole toolchain on every
      # schedule -- over 11 minutes of a 13m27s Job on the slow appliance,
      # against a backup body of seconds. Image layers are cached by
      # containerd; apk is not. The cases that must keep failing: the image
      # falling back to a moving tag (ops-latest was measured pointing at the
      # WRONG image for ~20 minutes when three builds raced it, and a skewed
      # moving tag reads exactly like a correct one), an install creeping back
      # into the container command or into backup.sh, and backup.sh growing a
      # call that was not declared when the image was pinned.
      - name: offsite-backup runs the pre-baked image
        run: bash scripts/check-backup-runs-prebaked.sh
      # #208: Longhorn makes its own PDB (minAvailable 1) for csi-attacher and
      # csi-provisioner. At 1 replica the node holding the pod can never be
      # drained, and Omni v1.12.4 drains before every Talos upgrade: jg-jiahd's
      # dk0-t6p sat cordoned ~22.8h. The cases that must keep failing: either
      # count back at 1, or 0.
      - name: Longhorn CSI attacher/provisioner can be drained
        run: bash scripts/check-longhorn-csi-drainable.sh && bash scripts/check-longhorn-csi-drainable.sh --self-test

  diff:
    name: Flux Local Diff
    needs: pre-job
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    strategy:
      matrix:
        resources: ["helmrelease", "kustomization"]
      max-parallel: 4
      fail-fast: false
    # PR-only by nature: it diffs the branch against the default branch, and on
    # a push to main those are the same thing.
    if: ${{ github.event_name == 'pull_request' && needs.pre-job.outputs.any_changed == 'true' }}
    steps:
      - name: Checkout Pull Request Branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          path: pull

      - name: Checkout Default Branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: "${{ github.event.repository.default_branch }}"
          path: default

      # Both trees, same reason as the test job above. The script only
      # exists on the PR branch, so run that copy against both checkouts.
      - name: Stub Flux placeholders in Secret data
        run: |
          python3 pull/.github/scripts/stub-secret-data-placeholders.py pull/kubernetes
          python3 pull/.github/scripts/stub-secret-data-placeholders.py default/kubernetes
          python3 pull/.github/scripts/stub-secret-data-placeholders.py --check pull/kubernetes default/kubernetes

      - name: Run flux-local diff
        uses: docker://ghcr.io/allenporter/flux-local:v8.4.0
        with:
          args: >-
            diff ${{ matrix.resources }}
            --unified 6
            --path /github/workspace/pull/kubernetes/flux/cluster
            --path-orig /github/workspace/default/kubernetes/flux/cluster
            --strip-attrs "helm.sh/chart,checksum/config,app.kubernetes.io/version,chart"
            --limit-bytes 10000
            --all-namespaces
            --sources "flux-system"
            --output-file diff.patch

      - name: Generate Diff
        id: diff
        run: |
          cat diff.patch;
          {
              echo 'diff<<EOF'
              cat diff.patch
              echo EOF
          } >> "$GITHUB_OUTPUT";
          {
              echo "### Diff"
              echo '```diff'
              cat diff.patch
              echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Add Comment
        if: ${{ steps.diff.outputs.diff != '' }}
        continue-on-error: true
        uses: mshick/add-pr-comment@b8f338c590a895d50bcbfa6c5859251edc8952fc # v2.8.2
        with:
          message-id: "${{ github.event.pull_request.number }}/kubernetes/${{ matrix.resources }}"
          message-failure: Diff was not successful
          message: |
            ```diff
            ${{ steps.diff.outputs.diff }}
            ```

  # split-extras 5.3: kubernetes/apps/extras is gone from here and lives in
  # ferry133/jg-extras; this is red if anything is tracked under it again
  # (5.1, #211/#213, had frozen it first). It does not hang off pre-job on
  # purpose: it is cheap, and a check that a wrong "nothing changed" could
  # skip is no check.
  frozen:
    name: Extras absent here (moved to jg-extras)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Check, then prove the check can fail
        run: bash .github/scripts/check-extras-frozen.sh && bash .github/scripts/check-extras-frozen.sh --self-test

  flux-local-status:
    name: Flux Local Success
    # `pre-job` belongs in `needs` (#25). Without it, a failed pre-job left
    # `any_changed` unset, `test` and `diff` skipped, and this check GREEN with
    # nothing validated — reproduced on run 32645294321, and the same input
    # turns this check red once pre-job is listed here (run 32645334405). The
    # whole run went red either way, but branch protection gates on this check,
    # not on the run. On push pre-job is `skipped`, not `failure`, so this does
    # not affect main.
    needs: ["pre-job", "test", "diff", "scripts", "frozen"]
    runs-on: ubuntu-latest
    if: ${{ always() }}
    steps:
      - name: Any jobs failed?
        if: ${{ contains(needs.*.result, 'failure') }}
        run: exit 1

      # The other half of #23. Everything above treats "skipped" as fine, which
      # is right for a PR that touched no manifests and wrong for main, where a
      # skipped suite is indistinguishable from a passing one — and that
      # indistinguishability is the whole defect. On main there is no legitimate
      # reason for `test` to be anything but success.
      - name: Did the suite actually run on main?
        if: ${{ github.event_name == 'push' && needs.test.result != 'success' }}
        run: |
          echo "::error::Flux Local Test did not run on main (result: ${{ needs.test.result }})"
          exit 1

      # `scripts` gets the same treatment for the same reason. Adding a job to
      # `needs` without this would let it be skipped on main and still leave
      # this check green -- which is #23's defect, re-created by the act of
      # fixing #32.
      #
      # ⚠️ NEITHER of these two steps has ever been observed to fire. First
      # push-path execution was 2026-08-28 (runs 33216543714 / 33216563481):
      # both evaluated and both came out `skipped`, which is correct because
      # `test` and `scripts` both succeeded -- but a condition that evaluated
      # false is not a guard that has been shown to work. They are recorded as
      # unexercised rather than counted as passing.
      #
      # Deliberately NOT manufactured: firing them needs `test` to actually
      # fail or be skipped on main, i.e. breaking main. Reproducing it on a
      # fork was offered and declined -- a fork runs a different copy of this
      # workflow, so what it demonstrates is discounted, and the size of the
      # discount is not visible in the result. That is the same shape this
      # whole file exists to remove, so buying confidence that way costs more
      # than the gap.
      #
      # The mechanism itself does have a demonstration: the `pre-job` half of
      # #25 was reproduced red (run 32645334405) against the same
      # `needs.*.result` gating. That is evidence for the construct, not for
      # these two steps.
      - name: Did the script tests actually run on main?
        if: ${{ github.event_name == 'push' && needs.scripts.result != 'success' }}
        run: |
          echo "::error::Repo Script Tests did not run on main (result: ${{ needs.scripts.result }})"
          exit 1

      # `frozen` (the extras-absent check) never depends on pre-job, so on both events the only right
      # result is success; skipped or cancelled would read as green below.
      - name: Did the extras-absent check actually run?
        if: ${{ needs.frozen.result != 'success' }}
        run: |
          echo "::error::Extras absent check did not pass (result: ${{ needs.frozen.result }})"
          exit 1

      - name: All jobs passed or skipped?
        if: ${{ !(contains(needs.*.result, 'failure')) }}
        run: echo "All jobs passed or skipped" && echo "${{ toJSON(needs.*.result) }}"
