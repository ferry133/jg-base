---
name: "Flux Local"

on:
  pull_request:
    branches: ["main"]
  # main too (#23). Until now this workflow had only ever run on pull_request —
  # `gh run list --json event` returned exactly ["pull_request"] — so a commit
  # pushed straight to main was validated by nothing. Landing work through PRs
  # is a habit, not a mechanism, and the gap read exactly like coverage.
  push:
    branches: ["main"]

concurrency:
  # Keyed per pull request, but per *commit* on main, so no two main runs ever
  # share a group. `cancel-in-progress: false` alone would not be enough:
  # GitHub cancels a *pending* run when a newer one is queued into the same
  # group regardless of that setting, so three merges in quick succession would
  # lose the middle commit's verdict. Cancelled is at least visible rather than
  # green, but a per-sha group means it does not happen at all.
  group: ${{ github.workflow }}-${{ github.event.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Purely an optimisation, and deliberately pull_request-only. main runs the
  # suite unconditionally instead: ~25s, and main does not move often.
  #
  # This is a choice not to depend on the action, not a claim that it is broken
  # on push. What is measured is that it answers even where it cannot answer
  # well: with no git repo it silently switches to "Using GitHub's REST API to
  # get changed files" and still reports success (#25 repro run 32645197207).
  # Its push-event base would be `github.event.before`, all-zeroes on a
  # branch's first push; what it reports then is UNMEASURED here. On main a
  # wrong "nothing changed" skips every job below, and a skipped job is green —
  # indistinguishable from a pass, which is the shape #23 exists to remove. So
  # main does not consult it at all.
  pre-job:
    name: Flux Local Pre-Job
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    outputs:
      any_changed: ${{ steps.changed-files.outputs.any_changed }}
    steps:
      # VERIFY ONLY: no checkout forces the REST API path, and the bad token
      # below then fails it. Either one alone is not enough -- measured.
      - name: Get Changed Files
        id: changed-files
        uses: tj-actions/changed-files@7dee1b0c1557f278e5c7dc244927139d78c0e22a # v47.0.4
        with:
          token: "invalid-token-to-force-a-pre-job-failure"
          # The workflow and its helper script are in here too: a change to
          # either has to be exercised by the jobs it changes, otherwise the
          # only feedback is the next unrelated PR.
          files: |
            kubernetes/**
            .github/workflows/flux-local.yaml
            .github/scripts/**

  test:
    name: Flux Local Test
    needs: pre-job
    runs-on: ubuntu-latest
    # `!cancelled()` is required, not decoration: pre-job is skipped on push,
    # and a dependant of a skipped job is skipped by default however its own
    # condition reads.
    if: ${{ !cancelled() && (github.event_name == 'push' || needs.pre-job.outputs.any_changed == 'true') }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # `flux build --dry-run` skips postBuild substitution and then
      # base64-decodes every Secret `data:` value, so a surviving ${VAR}
      # literal fails the build -- and in flux-local that happens during
      # collection, so nothing else gets tested either. See the script's
      # docstring for the upstream code and why there is no config knob.
      - name: Stub Flux placeholders in Secret data
        run: python3 .github/scripts/stub-secret-data-placeholders.py kubernetes

      - name: Verify no placeholder survived the stub
        run: python3 .github/scripts/stub-secret-data-placeholders.py --check kubernetes

      - name: Run flux-local test
        uses: docker://ghcr.io/allenporter/flux-local:v8.1.0
        with:
          args: test --enable-helm --all-namespaces --path /github/workspace/kubernetes/flux/cluster -v

  diff:
    name: Flux Local Diff
    needs: pre-job
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    strategy:
      matrix:
        resources: ["helmrelease", "kustomization"]
      max-parallel: 4
      fail-fast: false
    # PR-only by nature: it diffs the branch against the default branch, and on
    # a push to main those are the same thing.
    if: ${{ github.event_name == 'pull_request' && needs.pre-job.outputs.any_changed == 'true' }}
    steps:
      - name: Checkout Pull Request Branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          path: pull

      - name: Checkout Default Branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: "${{ github.event.repository.default_branch }}"
          path: default

      # Both trees, same reason as the test job above. The script only
      # exists on the PR branch, so run that copy against both checkouts.
      - name: Stub Flux placeholders in Secret data
        run: |
          python3 pull/.github/scripts/stub-secret-data-placeholders.py pull/kubernetes
          python3 pull/.github/scripts/stub-secret-data-placeholders.py default/kubernetes
          python3 pull/.github/scripts/stub-secret-data-placeholders.py --check pull/kubernetes default/kubernetes

      - name: Run flux-local diff
        uses: docker://ghcr.io/allenporter/flux-local:v8.1.0
        with:
          args: >-
            diff ${{ matrix.resources }}
            --unified 6
            --path /github/workspace/pull/kubernetes/flux/cluster
            --path-orig /github/workspace/default/kubernetes/flux/cluster
            --strip-attrs "helm.sh/chart,checksum/config,app.kubernetes.io/version,chart"
            --limit-bytes 10000
            --all-namespaces
            --sources "flux-system"
            --output-file diff.patch

      - name: Generate Diff
        id: diff
        run: |
          cat diff.patch;
          {
              echo 'diff<<EOF'
              cat diff.patch
              echo EOF
          } >> "$GITHUB_OUTPUT";
          {
              echo "### Diff"
              echo '```diff'
              cat diff.patch
              echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Add Comment
        if: ${{ steps.diff.outputs.diff != '' }}
        continue-on-error: true
        uses: mshick/add-pr-comment@b8f338c590a895d50bcbfa6c5859251edc8952fc # v2.8.2
        with:
          message-id: "${{ github.event.pull_request.number }}/kubernetes/${{ matrix.resources }}"
          message-failure: Diff was not successful
          message: |
            ```diff
            ${{ steps.diff.outputs.diff }}
            ```

  flux-local-status:
    name: Flux Local Success
    # `pre-job` belongs in `needs` (#25). Without it, a failed pre-job left
    # `any_changed` unset, `test` and `diff` skipped, and this check GREEN with
    # nothing validated — reproduced on run 32645294321, and the same input
    # turns this check red once pre-job is listed here (run 32645334405). The
    # whole run went red either way, but branch protection gates on this check,
    # not on the run. On push pre-job is `skipped`, not `failure`, so this does
    # not affect main.
    needs: ["pre-job", "test", "diff"]
    runs-on: ubuntu-latest
    if: ${{ always() }}
    steps:
      - name: Any jobs failed?
        if: ${{ contains(needs.*.result, 'failure') }}
        run: exit 1

      # The other half of #23. Everything above treats "skipped" as fine, which
      # is right for a PR that touched no manifests and wrong for main, where a
      # skipped suite is indistinguishable from a passing one — and that
      # indistinguishability is the whole defect. On main there is no legitimate
      # reason for `test` to be anything but success.
      - name: Did the suite actually run on main?
        if: ${{ github.event_name == 'push' && needs.test.result != 'success' }}
        run: |
          echo "::error::Flux Local Test did not run on main (result: ${{ needs.test.result }})"
          exit 1

      - name: All jobs passed or skipped?
        if: ${{ !(contains(needs.*.result, 'failure')) }}
        run: echo "All jobs passed or skipped" && echo "${{ toJSON(needs.*.result) }}"

# (verify/25-branch-protection: throwaway comment, this branch is a measurement)
