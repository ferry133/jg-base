---
name: "Flux Local"

on:
  pull_request:
    branches: ["main"]
  # main too (#23). Until now this workflow had only ever run on pull_request —
  # `gh run list --json event` returned exactly ["pull_request"] — so a commit
  # pushed straight to main was validated by nothing. Landing work through PRs
  # is a habit, not a mechanism, and the gap read exactly like coverage.
  push:
    branches: ["main"]

concurrency:
  # Keyed per pull request, but per *commit* on main, so no two main runs ever
  # share a group. `cancel-in-progress: false` alone would not be enough:
  # GitHub cancels a *pending* run when a newer one is queued into the same
  # group regardless of that setting, so three merges in quick succession would
  # lose the middle commit's verdict. Cancelled is at least visible rather than
  # green, but a per-sha group means it does not happen at all.
  group: ${{ github.workflow }}-${{ github.event.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Purely an optimisation, and deliberately pull_request-only. main runs the
  # suite unconditionally instead: ~25s, and main does not move often.
  #
  # This is a choice not to depend on the action, not a claim that it is broken
  # on push. What is measured is that it answers even where it cannot answer
  # well: with no git repo it silently switches to "Using GitHub's REST API to
  # get changed files" and still reports success (#25 repro run 32645197207).
  # Its push-event base would be `github.event.before`, all-zeroes on a
  # branch's first push; what it reports then is UNMEASURED here. On main a
  # wrong "nothing changed" skips every job below, and a skipped job is green —
  # indistinguishable from a pass, which is the shape #23 exists to remove. So
  # main does not consult it at all.
  pre-job:
    name: Flux Local Pre-Job
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    outputs:
      any_changed: ${{ steps.changed-files.outputs.any_changed }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Get Changed Files
        id: changed-files
        uses: tj-actions/changed-files@7dee1b0c1557f278e5c7dc244927139d78c0e22a # v47.0.4
        with:
          # The workflow and its helper script are in here too: a change to
          # either has to be exercised by the jobs it changes, otherwise the
          # only feedback is the next unrelated PR.
          files: |
            kubernetes/**
            .github/workflows/flux-local.yaml
            .github/scripts/**
            scripts/**

  test:
    name: Flux Local Test
    needs: pre-job
    runs-on: ubuntu-latest
    # `!cancelled()` is required, not decoration: pre-job is skipped on push,
    # and a dependant of a skipped job is skipped by default however its own
    # condition reads.
    if: ${{ !cancelled() && (github.event_name == 'push' || needs.pre-job.outputs.any_changed == 'true') }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # `flux build --dry-run` skips postBuild substitution and then
      # base64-decodes every Secret `data:` value, so a surviving ${VAR}
      # literal fails the build -- and in flux-local that happens during
      # collection, so nothing else gets tested either. See the script's
      # docstring for the upstream code and why there is no config knob.
      - name: Stub Flux placeholders in Secret data
        run: python3 .github/scripts/stub-secret-data-placeholders.py kubernetes

      - name: Verify no placeholder survived the stub
        run: python3 .github/scripts/stub-secret-data-placeholders.py --check kubernetes

      # Same class of problem one field over: a ${VAR} in a Kustomization
      # spec.path is not substituted in dry-run either, and an unresolvable
      # path aborts collection for the whole run. This is what kept
      # apps/extras/** out of CI entirely (#37).
      - name: Stub Flux placeholders in Kustomization spec.path
        run: python3 .github/scripts/stub-kustomization-path-vars.py kubernetes

      - name: Verify no path placeholder survived the stub
        run: python3 .github/scripts/stub-kustomization-path-vars.py --check kubernetes

      - name: Run flux-local test (base)
        uses: docker://ghcr.io/allenporter/flux-local:v8.1.0
        with:
          args: test --enable-helm --all-namespaces --path /github/workspace/kubernetes/flux/cluster -v

      # apps/extras/** is unreachable from the cluster entry point by design —
      # extras are selected by each per-user repo, not by this one — so the run
      # above walks base/ only and reported success on PRs that changed nothing
      # but extras (#37, measured on PR #30). Pointing flux-local straight at
      # the directory makes it collect every extras Kustomization it finds, so
      # there is no second list of "which extras exist" to drift.
      #
      # Verified locally before landing: 20 Kustomizations collected, factory /
      # omni / freepbx / linebot / postgres / synophoto / homebridge / mariadb /
      # mqtt / trello-notifier / ingress-nginx / cloudflare-tunnel-lan all
      # present, HelmReleases rendered. And it can fail — a bad resource ref in
      # extras/factory exits 4, not 0.
      - name: Run flux-local test (extras)
        uses: docker://ghcr.io/allenporter/flux-local:v8.1.0
        with:
          args: test --enable-helm --all-namespaces --path /github/workspace/kubernetes/apps/extras -v

  scripts:
    name: Repo Script Tests
    needs: pre-job
    runs-on: ubuntu-latest
    # Same `!cancelled()` reasoning as `test` above: pre-job is skipped on
    # push, and a dependant of a skipped job is skipped by default.
    if: ${{ !cancelled() && (github.event_name == 'push' || needs.pre-job.outputs.any_changed == 'true') }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # `scripts/check-lan-dns-row.sh` needs yq, and this repo declares no
      # toolchain at all — no .mise.toml, no .tool-versions, no Taskfile. The
      # script's own `command -v yq || exit 1` was correct and unheard, because
      # nothing ran it (#32).
      #
      # Pinned by version AND digest. A version alone is a name, and the thing
      # this repo keeps relearning is that a name is not an instance.
      - name: Install yq
        env:
          YQ_VERSION: v4.48.1
          YQ_SHA256: 99df6047f5b577a9d25f969f7c3823ada3488de2e2115b30a0abb10d9324fd9f
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/yq \
            "https://github.com/mikefarah/yq/releases/download/${YQ_VERSION}/yq_linux_amd64"
          echo "${YQ_SHA256}  /tmp/yq" | sha256sum -c -
          sudo install -m 0755 /tmp/yq /usr/local/bin/yq
          yq --version

      # The repo's only behavioural regression test for a daily-check row, and
      # until now nothing executed it. The row it guards has shipped broken
      # twice (#16, #18); a test nobody runs and a test that passes are the
      # same colour on this page.
      - name: daily-check LAN DNS row
        run: bash scripts/check-lan-dns-row.sh

      # #43: this row was green on a cluster nothing outside could reach. The
      # `no public record -> fail` case below is the one that used to render
      # as a pass, so it is the case that has to keep failing.
      - name: daily-check external endpoint row
        run: bash scripts/check-external-endpoint-row.sh

  diff:
    name: Flux Local Diff
    needs: pre-job
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    strategy:
      matrix:
        resources: ["helmrelease", "kustomization"]
      max-parallel: 4
      fail-fast: false
    # PR-only by nature: it diffs the branch against the default branch, and on
    # a push to main those are the same thing.
    if: ${{ github.event_name == 'pull_request' && needs.pre-job.outputs.any_changed == 'true' }}
    steps:
      - name: Checkout Pull Request Branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          path: pull

      - name: Checkout Default Branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: "${{ github.event.repository.default_branch }}"
          path: default

      # Both trees, same reason as the test job above. The script only
      # exists on the PR branch, so run that copy against both checkouts.
      - name: Stub Flux placeholders in Secret data
        run: |
          python3 pull/.github/scripts/stub-secret-data-placeholders.py pull/kubernetes
          python3 pull/.github/scripts/stub-secret-data-placeholders.py default/kubernetes
          python3 pull/.github/scripts/stub-secret-data-placeholders.py --check pull/kubernetes default/kubernetes

      - name: Run flux-local diff
        uses: docker://ghcr.io/allenporter/flux-local:v8.1.0
        with:
          args: >-
            diff ${{ matrix.resources }}
            --unified 6
            --path /github/workspace/pull/kubernetes/flux/cluster
            --path-orig /github/workspace/default/kubernetes/flux/cluster
            --strip-attrs "helm.sh/chart,checksum/config,app.kubernetes.io/version,chart"
            --limit-bytes 10000
            --all-namespaces
            --sources "flux-system"
            --output-file diff.patch

      - name: Generate Diff
        id: diff
        run: |
          cat diff.patch;
          {
              echo 'diff<<EOF'
              cat diff.patch
              echo EOF
          } >> "$GITHUB_OUTPUT";
          {
              echo "### Diff"
              echo '```diff'
              cat diff.patch
              echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Add Comment
        if: ${{ steps.diff.outputs.diff != '' }}
        continue-on-error: true
        uses: mshick/add-pr-comment@b8f338c590a895d50bcbfa6c5859251edc8952fc # v2.8.2
        with:
          message-id: "${{ github.event.pull_request.number }}/kubernetes/${{ matrix.resources }}"
          message-failure: Diff was not successful
          message: |
            ```diff
            ${{ steps.diff.outputs.diff }}
            ```

  flux-local-status:
    name: Flux Local Success
    # `pre-job` belongs in `needs` (#25). Without it, a failed pre-job left
    # `any_changed` unset, `test` and `diff` skipped, and this check GREEN with
    # nothing validated — reproduced on run 32645294321, and the same input
    # turns this check red once pre-job is listed here (run 32645334405). The
    # whole run went red either way, but branch protection gates on this check,
    # not on the run. On push pre-job is `skipped`, not `failure`, so this does
    # not affect main.
    needs: ["pre-job", "test", "diff", "scripts"]
    runs-on: ubuntu-latest
    if: ${{ always() }}
    steps:
      - name: Any jobs failed?
        if: ${{ contains(needs.*.result, 'failure') }}
        run: exit 1

      # The other half of #23. Everything above treats "skipped" as fine, which
      # is right for a PR that touched no manifests and wrong for main, where a
      # skipped suite is indistinguishable from a passing one — and that
      # indistinguishability is the whole defect. On main there is no legitimate
      # reason for `test` to be anything but success.
      - name: Did the suite actually run on main?
        if: ${{ github.event_name == 'push' && needs.test.result != 'success' }}
        run: |
          echo "::error::Flux Local Test did not run on main (result: ${{ needs.test.result }})"
          exit 1

      # `scripts` gets the same treatment for the same reason. Adding a job to
      # `needs` without this would let it be skipped on main and still leave
      # this check green -- which is #23's defect, re-created by the act of
      # fixing #32.
      #
      # ⚠️ NEITHER of these two steps has ever been observed to fire. First
      # push-path execution was 2026-08-28 (runs 33216543714 / 33216563481):
      # both evaluated and both came out `skipped`, which is correct because
      # `test` and `scripts` both succeeded -- but a condition that evaluated
      # false is not a guard that has been shown to work. They are recorded as
      # unexercised rather than counted as passing.
      #
      # Deliberately NOT manufactured: firing them needs `test` to actually
      # fail or be skipped on main, i.e. breaking main. Reproducing it on a
      # fork was offered and declined -- a fork runs a different copy of this
      # workflow, so what it demonstrates is discounted, and the size of the
      # discount is not visible in the result. That is the same shape this
      # whole file exists to remove, so buying confidence that way costs more
      # than the gap.
      #
      # The mechanism itself does have a demonstration: the `pre-job` half of
      # #25 was reproduced red (run 32645334405) against the same
      # `needs.*.result` gating. That is evidence for the construct, not for
      # these two steps.
      - name: Did the script tests actually run on main?
        if: ${{ github.event_name == 'push' && needs.scripts.result != 'success' }}
        run: |
          echo "::error::Repo Script Tests did not run on main (result: ${{ needs.scripts.result }})"
          exit 1

      - name: All jobs passed or skipped?
        if: ${{ !(contains(needs.*.result, 'failure')) }}
        run: echo "All jobs passed or skipped" && echo "${{ toJSON(needs.*.result) }}"
