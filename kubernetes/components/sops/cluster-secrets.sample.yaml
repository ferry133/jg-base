---
# cluster-secrets.sample.yaml
# Copy to cluster-secrets.sops.yaml, fill in values, then encrypt with:
#   sops --encrypt --in-place cluster-secrets.sops.yaml
#
# Required by: base (all clusters)
# Optional vars are marked with the extras that need them.
apiVersion: v1
kind: Secret
metadata:
  name: cluster-secrets
stringData:
  # ── Base (required for all clusters) ──────────────────────────────────────
  SECRET_DOMAIN: "example.com"            # cluster's primary domain

  # Cloudflare
  CLOUDFLARE_TOKEN: ""                    # API token (DNS edit permission)

  # Cluster network
  CLUSTER_API_ADDR: "10.x.x.x"           # Talos API / k8s API endpoint IP
  CLUSTER_GATEWAY_ADDR: "10.x.x.x"       # envoy-external LoadBalancer IP
  CLUSTER_DNS_GATEWAY_ADDR: "10.x.x.x"   # k8s-gateway (DNS) LoadBalancer IP

  # NAS — base/storage/nfs-subdir (sc-nas) + base/claudecode/claude-code
  NAS_SERVER: "10.x.x.x"                 # NFS server IP
  NAS_PATH: "/volume/path"               # NFS export path for storage provisioner
  NAS_CODING_PATH: "/volume/coding"      # NFS export path for the coding workspace

  # Whether the DB extras render their NAS backup CronJob: "nfs" or "none".
  # Derived in jg-cluster-template from nas_server, never hand-set. It exists
  # because Flux cannot branch on "is NAS_SERVER set" — drone/envsubst has no
  # working `${VAR:+alt}` (measured: it behaves as `${VAR:-alt}`), so the
  # selector has to arrive as a value. Defaults to "nfs" where absent, which is
  # what keeps a cluster that has not re-rendered from silently losing its
  # backups. See kubernetes/apps/extras/*/postgres/backup/none/kustomization.yaml
  # and ferry133/jg-base#17.
  NAS_BACKUP: "nfs"

  # base/storage/longhorn — optional off-node backup target for replicated
  # volumes (ferry133/jg-base#7). Longhorn's replica count survives a node
  # dying; it does not survive `kubectl delete pvc` or a corrupt table, and
  # without this the Longhorn layer has no backups at all.
  #
  # Leave both out entirely and nothing changes: the chart's whole render is
  # byte-identical to a cluster that never had these (measured with
  # `helm template`, see the README). This must NOT be hardcoded in apps/base —
  # the URL below is a LAN address on one specific NAS, and most clusters
  # cannot reach it.
  #
  # Same derived-selector pattern as NAS_BACKUP above and for the same reason,
  # but the default is the other way round: "none", because no cluster has a
  # Longhorn backup today, so defaulting to "nfs" would hand every
  # replicated-storage cluster a job that fails nightly.
  LONGHORN_BACKUP_TARGET: "nfs://10.x.x.x:/volume/backup1/longhorn"
  LONGHORN_BACKUP: "nfs"                 # derived from longhorn_backup_target

  # base/claudecode/claude-code — web terminal at im.${SECRET_DOMAIN} by default.
  # Auth0 OIDC (oauth2-proxy sidecar) is the default gate; these three are
  # rendered from auth0.json in the cluster directory, not hand-filled.
  CLAUDECODE_AUTH0_CLIENT_ID: ""
  CLAUDECODE_AUTH0_CLIENT_SECRET: ""
  CLAUDECODE_OAUTH2_COOKIE_SECRET: ""    # derived from age.key + cluster_name
  TTYD_CREDENTIAL: "user:password"       # ttyd basic auth; only used on claudecode_auth0: false
  TALOS_MCP_CONFIG_B64: ""               # optional: talos-mcp sidecar (read-only Talos)
  TALOS_MCP_SA_KEY: ""
  TALOS_MCP_OMNI_ENDPOINT: ""

  # ── extras/default/postgres ───────────────────────────────────────────────
  POSTGRES_PASSWORD: ""                  # password for linebot DB user

  # ── extras/claudecode/postgres ────────────────────────────────────────────
  CLAUDE_CODE_DATABASE_URL: ""           # optional: enable MCP memory server
                                         # e.g. postgresql://claudecode:pass@postgres.claudecode.svc/claudecode
