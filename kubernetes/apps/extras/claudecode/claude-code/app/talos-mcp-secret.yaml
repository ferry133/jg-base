---
# Dedicated secret for the talos-mcp sidecar's os:reader-scoped Talos
# credential -- kept separate from claude-code-secret so this credential's
# blast radius/RBAC is visibly distinct from ttyd/OAuth/DB secrets. Only the
# talos-mcp container mounts this; the app container never does.
apiVersion: v1
kind: Secret
metadata:
  name: talos-mcp-secret
  namespace: claudecode
data:
  # Already base64 (TALOS_MCP_CONFIG_B64 is itself a b64-wrapped multi-line
  # talosconfig -- see cluster-secrets.sops.yaml.j2). `data:` fields are
  # expected pre-base64-encoded by Kubernetes, so this decodes correctly
  # into a real talosconfig file when mounted as a volume.
  talosconfig: "${TALOS_MCP_CONFIG_B64:-}"
