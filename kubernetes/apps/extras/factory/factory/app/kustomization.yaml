---
# Every manifest in this directory has to be listed here. A file that exists in
# the tree but is missing from this list renders nothing and reports no error —
# and "namespace factory has no Deployment" then looks exactly like 2.3a's
# measured containment, which is the reading that is supposed to be good news.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./rbac.yaml
  - ./ocirepository.yaml
  - ./secret.yaml
  - ./helmrelease.yaml
