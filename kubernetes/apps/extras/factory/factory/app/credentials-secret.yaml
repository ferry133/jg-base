---
# The provisioning credentials, and the half of that job this repo owns.
#
# Ruled 2026-08-23 (ferry133, routed via fleet-ops, jg-base#5): factory-agent
# 7.3 goes route (C) — reprovision jg-janncotcc — which needs 2.9's inventory to
# stop being a design and become a deployment. ferry133 issues the credentials;
# this file and the HelmRelease are the mounting half.
#
# Until 2026-08-23 nobody had measured what the pod actually held. It held none
# of the three: `app` had zero `secretKeyRef`, no `envFrom`, and volumes were
# only the PVC and the allowlist ConfigMap. 2.9's README described all three in
# detail, down to a rotation procedure reading "update the Secret and restart
# factory" — for a Secret that did not exist. That is the failure mode this
# directory keeps naming, so the object is named after what it holds and the
# keys are listed one per line rather than delivered as a bag.
#
# ## Separate from `factory-secret`, and not for tidiness
#
# The Omni service account is issued `--role Operator` with a short TTL (8-24h,
# reissued before each run) rather than the default one-year Admin, so this
# object gets rewritten often. `factory-secret` is the oauth2-proxy login gate —
# the operator's only way in. Sharing one object would put the way in behind
# every credential refresh: a fumbled rotation would lock the terminal instead
# of failing the run. `claudecode` splits for the adjacent reason
# (`talos-mcp-secret` vs `claude-code-secret`, so blast radius is visibly
# distinct); here the reason is rotation frequency, and it is the stronger one.
#
# ## Empty is the shipped state, and it is legible rather than silent
#
# Every value is a Flux postBuild substitution with a `:-` default, so none of
# them can reach a cluster as a literal `${VAR}`. What the default IS differs,
# and the difference matters more than the uniformity: three are `:-}` and
# render an empty string when unset (`omniServiceAccountKey`, `githubToken`,
# `fleetOpsDeployKey`), while `omniEndpoint` carries a working in-cluster
# address —
# `${FACTORY_OMNI_ENDPOINT:-http://omni.omni.svc.cluster.local:8080}` — so
# "absent from cluster.yaml" and "renders empty" are the same thing for three of
# the four and NOT for the endpoint.
#
# For the three that do render empty, empty means "not issued yet" and each
# consumer says so loudly rather than quietly: `omnictl` treats an empty
# `OMNI_SERVICE_ACCOUNT_KEY` as unset and refuses to authenticate, `gh` reports
# no token, and a zero-byte deploy key fails at key load. None of them degrades
# into looking like it worked.
#
# ~~⚠️ **The variables below do not exist in `jg-cluster-template` yet.** There
# is no `cluster.schema.cue` field and no line in `cluster-secrets.sops.yaml.j2`
# for any of them~~ — **retired 2026-09-10 (#95). Both halves have existed
# since jgct#33 merged on 2026-08-27**, and all four this file consumes are
# declared in both places: `cluster.schema.cue:460-463` and
# `cluster-secrets.sops.yaml.j2:175-180`.
#
# The sequencing argument the struck sentence carried is NOT retired and is why
# it is struck rather than deleted: the consuming half belongs here and the
# declaring half is jg-cluster-template's (README.md, "Where the values come
# from"). That was right, and it happened.
#
# **Two of the four are still empty, and the reason changed hands — that is the
# part worth reading.** It is no longer "the declaration does not exist, wait
# for another repo". It is "the declaration exists and nobody has issued the
# credential".
#
# Two separate questions, and conflating them is what produced two wrong
# versions of this paragraph before this one. Whether cluster.yaml carries the
# key was measured on the cluster factory runs on by fleet-ops [8e8ef1] (key
# names and non-emptiness only, never values); what an absent key renders as is
# decided HERE, by the default at the consumption point, and is read off the
# lines below:
#
#   var / field here                  cluster.yaml   default here    renders
#   FACTORY_OMNI_SA_KEY               absent         `:-}`           empty
#     omniServiceAccountKey
#   FACTORY_GITHUB_TOKEN              absent         `:-}`           empty
#     githubToken
#   FACTORY_OMNI_ENDPOINT             absent         in-cluster URL  NON-empty
#     omniEndpoint                                                   (and working)
#   FACTORY_FLEET_OPS_DEPLOY_KEY_B64  SET            `:-}`           NON-empty
#     fleetOpsDeployKey
#
# So the two that need issuing are the Omni service-account key and the GitHub
# token. The endpoint needs nothing: its default is the address of the Omni
# Service in this cluster, and fleet-ops measured that exact value live on
# 2026-08-27 — it was never blocked on anything.
#
# Named one by one rather than counted, and with no "every" or "all", because
# whole-set words are how the two previous versions went wrong: the first said
# every value renders empty and then, one line later, that the deploy key has
# one — both halves on the page, one line apart. The second fixed that and
# still said the endpoint renders empty, because "absent from cluster.yaml" was
# carried over as if it answered "renders empty", and nobody had read the
# defaults further down in this same file.
#
# Field names above, not line numbers: the first draft of this table cited
# `:63`/`:81`/`:91`/`:130` and every one of them was wrong by the time it was
# saved, because this comment is in the same file and pushed those lines down.
# A line reference into its own file invalidates itself as it is written.
#
# So the next step for those two is a few lines in that cluster.yaml plus
# `task configure`, not a pull request in another repository. **The difference
# is who can act**, and the old text sent the reader to the wrong repo.
#
# Why this was never going to be noticed on its own: the conclusion stayed
# true while its reason died. Anyone checking "do these render empty?" got
# yes, agreed with the comment, and moved on. Nothing is deployed by this file
# landing either way — the pod gains the env names and one empty file.
apiVersion: v1
kind: Secret
metadata:
  name: factory-credentials
  namespace: factory
stringData:
  # Omni. Same two variables `talos-mcp` already uses on every cluster
  # (`OMNI_SERVICE_ACCOUNT_KEY` + `OMNI_ENDPOINT`) because they are read by
  # talosctl/omnictl's own auth library, not by anything we wrote — a different
  # name here would be a credential that is present and unfindable.
  #
  # Operator, not Admin. Measured 2026-08-23 that Omni accepts the narrower role
  # (`omnictl serviceaccount create --use-user-role=false --role Operator
  # --ttl 10m`; `serviceaccount list` returned ROLE `Operator` verbatim).
  # ⚠️ Whether Operator suffices to CREATE a cluster is NOT measured. Starting
  # narrow costs nothing here because too-few permissions fails with an explicit
  # error rather than silently — the reverse (starting at Admin "to be safe")
  # is what has no signal.
  omniServiceAccountKey: "${FACTORY_OMNI_SA_KEY:-}"
  # In-cluster by default, which is the entire point of factory living on jcom:
  # Cloudflare Tunnel breaks the gRPC trailers Omni's streaming calls depend on
  # (D1, measured 2026-07-30 against jg-jiahd), so the ClusterIP path is not an
  # optimisation, it is the only path that works.
  #
  # The default is the `omni` extra's own Service — `omni` in namespace `omni`,
  # `service.main.omniPort: 8080` in its HelmRelease — and `http://`, not
  # `https://`: that Service is h2c (cleartext HTTP/2, per its own
  # `traefik.../serversscheme: h2c` annotation), TLS terminating at the ingress.
  # jcom's ClusterIP resolved to 10.43.2.239 with 8080 open when measured
  # 2026-08-18; the name is used rather than the address because the address is
  # not stable across a Service recreate.
  #
  # ⚠️ NOT exercised: that omnictl/the Go SDK accept an `http://` endpoint and
  # that Omni accepts service-account auth over cleartext in-cluster. Both are
  # read off configuration, not off a call. Overridable precisely because that
  # is unverified — a cluster that needs the TLS path sets FACTORY_OMNI_ENDPOINT.
  omniEndpoint: "${FACTORY_OMNI_ENDPOINT:-http://omni.omni.svc.cluster.local:8080}"
  # GitHub, provisioning half: creates and populates each customer's private
  # cluster repo (4.4). `GH_TOKEN` is what the `gh` CLI reads first.
  #
  # ⚠️ Do NOT put the classic `ghp_` token ferry133 uses interactively here. It
  # is account-wide and includes administrative and repository-deletion scopes,
  # so handing it to a pod co-located with a cluster-admin claude-code instance
  # (see README.md, blast radius) hands over the account. A fine-grained token
  # scoped to the repos it must create is the shape. (Scopes not enumerated:
  # this repo is public and that token is in current use.)
  githubToken: "${FACTORY_GITHUB_TOKEN:-}"
  # NO Cloudflare credential, and the absence is the decision (#44).
  #
  # The row that used to be here assumed "the operator's Cloudflare account,
  # which holds every customer zone". D11 (ferry133, 2026-08-25) put each
  # customer's Cloudflare account under the customer's own Google identity, so
  # that clause is false. Measured 2026-08-28: janncot.cc answers from
  # beth/hans.ns.cloudflare.com and jiahd.cc from rajeev/shubhi — Cloudflare
  # assigns an NS pair per account, so those are two accounts.
  #
  # An operator-account token therefore does nothing to a customer zone, and it
  # fails in the worst available way: present, correct-looking, inert, until the
  # first real provisioning run at a customer site.
  #
  # It is REMOVED rather than left empty on purpose. An always-empty key reads
  # exactly like one nobody has filled in yet, and the next person would fill
  # it. Absent, with this comment, is the only version that stays true.
  #
  # And the deciding argument does not depend on the untested cross-account
  # question: even if company membership in a customer account were obtainable,
  # handover is obliged to remove every company-added member. A credential the
  # handover must revoke cannot be one factory holds for the life of a cluster.
  #
  # See README.md, "The Cloudflare credential is gone, because its premise was".
data:
  # fleet-ops read-only deploy key. `data:`, not `stringData:`, and b64 for a
  # measured reason rather than a stylistic one: Flux's `${VAR}` substitution
  # collapses newlines, so a PEM passed through it arrives as one line and no
  # SSH implementation will load it. Same wrapping, same reason, as
  # TALOS_MCP_CONFIG_B64 and OMNI_GPG_KEY_B64 in cluster-secrets.
  #
  # A deploy key rather than a PAT because it binds to one repository and to no
  # account: revoking factory's read access to the runbook and revoking its
  # ability to create customer repos are then two separate acts. That is the
  # whole reason GitHub is two credentials here and not one.
  #
  # Read-only. factory executes the runbook; it does not edit it. A copy that
  # can be written from a pod is a copy that can diverge from the one people
  # read.
  fleetOpsDeployKey: "${FACTORY_FLEET_OPS_DEPLOY_KEY_B64:-}"
