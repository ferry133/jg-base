---
# The provisioning credentials, and the half of that job this repo owns.
#
# Ruled 2026-08-23 (ferry133, routed via fleet-ops, jg-base#5): factory-agent
# 7.3 goes route (C) — reprovision jg-janncotcc — which needs 2.9's inventory to
# stop being a design and become a deployment. ferry133 issues the credentials;
# this file and the HelmRelease are the mounting half.
#
# Until 2026-08-23 nobody had measured what the pod actually held. It held none
# of the three: `app` had zero `secretKeyRef`, no `envFrom`, and volumes were
# only the PVC and the allowlist ConfigMap. 2.9's README described all three in
# detail, down to a rotation procedure reading "update the Secret and restart
# factory" — for a Secret that did not exist. That is the failure mode this
# directory keeps naming, so the object is named after what it holds and the
# keys are listed one per line rather than delivered as a bag.
#
# ## Separate from `factory-secret`, and not for tidiness
#
# The Omni service account is issued `--role Operator` with a short TTL (8-24h,
# reissued before each run) rather than the default one-year Admin, so this
# object gets rewritten often. `factory-secret` is the oauth2-proxy login gate —
# the operator's only way in. Sharing one object would put the way in behind
# every credential refresh: a fumbled rotation would lock the terminal instead
# of failing the run. `claudecode` splits for the adjacent reason
# (`talos-mcp-secret` vs `claude-code-secret`, so blast radius is visibly
# distinct); here the reason is rotation frequency, and it is the stronger one.
#
# ## Empty is the shipped state, and it is legible rather than silent
#
# Every value is a Flux postBuild substitution with a `:-` default, so a cluster
# whose `cluster-secrets` does not carry these renders empty strings — never a
# literal `${VAR}`. Empty means "not issued yet", and each consumer says so
# loudly rather than quietly: `omnictl` treats an empty
# `OMNI_SERVICE_ACCOUNT_KEY` as unset and refuses to authenticate, `gh` reports
# no token, and a zero-byte deploy key fails at key load. None of them degrades
# into looking like it worked.
#
# ⚠️ **The variables below do not exist in `jg-cluster-template` yet.** There is
# no `cluster.schema.cue` field and no line in `cluster-secrets.sops.yaml.j2`
# for any of them, so today every value here renders empty on every cluster.
# That is deliberate sequencing, not an oversight: the consuming half can be
# reviewed and merged here, and the declaring half is jg-cluster-template's
# (see README.md, "Where the values come from"). Nothing is deployed by this
# file landing — the pod gains five env names and one empty file.
apiVersion: v1
kind: Secret
metadata:
  name: factory-credentials
  namespace: factory
stringData:
  # Omni. Same two variables `talos-mcp` already uses on every cluster
  # (`OMNI_SERVICE_ACCOUNT_KEY` + `OMNI_ENDPOINT`) because they are read by
  # talosctl/omnictl's own auth library, not by anything we wrote — a different
  # name here would be a credential that is present and unfindable.
  #
  # Operator, not Admin. Measured 2026-08-23 that Omni accepts the narrower role
  # (`omnictl serviceaccount create --use-user-role=false --role Operator
  # --ttl 10m`; `serviceaccount list` returned ROLE `Operator` verbatim).
  # ⚠️ Whether Operator suffices to CREATE a cluster is NOT measured. Starting
  # narrow costs nothing here because too-few permissions fails with an explicit
  # error rather than silently — the reverse (starting at Admin "to be safe")
  # is what has no signal.
  omniServiceAccountKey: "${FACTORY_OMNI_SA_KEY:-}"
  # In-cluster by default, which is the entire point of factory living on jcom:
  # Cloudflare Tunnel breaks the gRPC trailers Omni's streaming calls depend on
  # (D1, measured 2026-07-30 against jg-jiahd), so the ClusterIP path is not an
  # optimisation, it is the only path that works.
  #
  # The default is the `omni` extra's own Service — `omni` in namespace `omni`,
  # `service.main.omniPort: 8080` in its HelmRelease — and `http://`, not
  # `https://`: that Service is h2c (cleartext HTTP/2, per its own
  # `traefik.../serversscheme: h2c` annotation), TLS terminating at the ingress.
  # jcom's ClusterIP resolved to 10.43.2.239 with 8080 open when measured
  # 2026-08-18; the name is used rather than the address because the address is
  # not stable across a Service recreate.
  #
  # ⚠️ NOT exercised: that omnictl/the Go SDK accept an `http://` endpoint and
  # that Omni accepts service-account auth over cleartext in-cluster. Both are
  # read off configuration, not off a call. Overridable precisely because that
  # is unverified — a cluster that needs the TLS path sets FACTORY_OMNI_ENDPOINT.
  omniEndpoint: "${FACTORY_OMNI_ENDPOINT:-http://omni.omni.svc.cluster.local:8080}"
  # GitHub, provisioning half: creates and populates each customer's private
  # cluster repo (4.4). `GH_TOKEN` is what the `gh` CLI reads first.
  #
  # ⚠️ Do NOT put the classic `ghp_` token ferry133 uses interactively here. It
  # is account-wide and includes administrative and repository-deletion scopes,
  # so handing it to a pod co-located with a cluster-admin claude-code instance
  # (see README.md, blast radius) hands over the account. A fine-grained token
  # scoped to the repos it must create is the shape. (Scopes not enumerated:
  # this repo is public and that token is in current use.)
  githubToken: "${FACTORY_GITHUB_TOKEN:-}"
  # Cloudflare. Scope is `Zone - DNS - Edit` plus `Account - Cloudflare
  # Tunnel - EDIT` — Edit, not Read. Measured 2026-08-23 against
  # jg-janncotcc's live token, which had been issued from README.md's own
  # (wrong) recommendation: same token, same account, same path, only the verb
  # differing — GET /accounts/{id}/cfd_tunnel succeeded and listed four tunnels,
  # POST returned `10000 Authentication error`. The account-level GET passing is
  # what rules out "zone-only token that cannot reach account endpoints".
  #
  # Two names for one value, deliberately and temporarily: `CLOUDFLARE_API_TOKEN`
  # is the SDK/terraform/external-dns convention, and fleet-ops's tunnel probe
  # reads `CF_TOKEN`. One value under two names is cheaper right now than a
  # rename coordinated across two repos, and the alternative failure — the
  # credential present under a name the runbook does not read — is
  # indistinguishable from no credential at all. Collapse to one once
  # fleet-ops's runbook settles on a name.
  cloudflareApiToken: "${FACTORY_CLOUDFLARE_TOKEN:-}"
data:
  # fleet-ops read-only deploy key. `data:`, not `stringData:`, and b64 for a
  # measured reason rather than a stylistic one: Flux's `${VAR}` substitution
  # collapses newlines, so a PEM passed through it arrives as one line and no
  # SSH implementation will load it. Same wrapping, same reason, as
  # TALOS_MCP_CONFIG_B64 and OMNI_GPG_KEY_B64 in cluster-secrets.
  #
  # A deploy key rather than a PAT because it binds to one repository and to no
  # account: revoking factory's read access to the runbook and revoking its
  # ability to create customer repos are then two separate acts. That is the
  # whole reason GitHub is two credentials here and not one.
  #
  # Read-only. factory executes the runbook; it does not edit it. A copy that
  # can be written from a pod is a copy that can diverge from the one people
  # read.
  fleetOpsDeployKey: "${FACTORY_FLEET_OPS_DEPLOY_KEY_B64:-}"
