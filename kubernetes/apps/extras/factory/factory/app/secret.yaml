---
# Only the login gate. None of the three credentials this namespace exists to
# isolate — Omni Admin SA, GitHub PAT, Cloudflare parent token (README.md) — is
# here yet, because nothing consumes them until §4/§5. When they arrive they
# arrive as additional keys on this Secret, and README.md's inventory is the
# place that has to be updated in the same commit.
#
# Every value is a Flux postBuild substitution from `cluster-secrets`, so the
# material is never in this repo. The `:-` defaults matter: a cluster that has
# not set these renders empty strings rather than leaving a literal `${VAR}` in
# the Secret, which oauth2-proxy would accept as a client id and then fail
# against Auth0 with an error that names the provider rather than the cause.
#
# The three CLAUDECODE_* variables are reused rather than redefined. They are
# the *shared Auth0 application's* credentials, already present on every cluster
# for claude-code (jg-cluster-template cluster-secrets.sops.yaml.j2:55-57,
# verified before writing this). Reusing them is what keeps 2.4 from needing new
# template variables in jg-cluster-template — and it is safe precisely because
# the Auth0 application is not the gate. See the allowlist note in
# helmrelease.yaml: authenticating at Auth0 gets a customer nowhere, because
# factory checks the email against its own file afterwards.
apiVersion: v1
kind: Secret
metadata:
  name: factory-secret
  namespace: factory
stringData:
  OAUTH2_PROXY_CLIENT_ID: "${CLAUDECODE_AUTH0_CLIENT_ID:-}"
  OAUTH2_PROXY_CLIENT_SECRET: "${CLAUDECODE_AUTH0_CLIENT_SECRET:-}"
  # Shared with claude-code by derivation (age.key + cluster_name), which is
  # fine: cookies are scoped to factory.<domain> by the browser, so a cookie
  # minted for cc.<domain> is never presented here.
  OAUTH2_PROXY_COOKIE_SECRET: "${CLAUDECODE_OAUTH2_COOKIE_SECRET:-}"
