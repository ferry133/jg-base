---
apiVersion: v1
kind: Secret
metadata:
  name: linebot-secret
  namespace: linebot
stringData:
  LINE_CHANNEL_ACCESS_TOKEN: "${LINE_CHANNEL_ACCESS_TOKEN}"
  LINE_CHANNEL_SECRET: "${LINE_CHANNEL_SECRET}"
  LINE_NOTIFY_GROUP_ID: "${LINE_NOTIFY_GROUP_ID}"
  ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY}"
  TRELLO_API_KEY: "${TRELLO_API_KEY}"
  TRELLO_TOKEN: "${TRELLO_API_TOKEN}"
  DATABASE_URL: "${DATABASE_URL}"
  GANTT_API_TOKEN: "${GANTT_API_TOKEN}"
  # admin UI Auth0 login (ferry133/linebot#50, jg-base#189). Values in jg-jiahd cluster-secrets.
  AUTH0_DOMAIN: "${LINEBOT_AUTH0_DOMAIN}"
  AUTH0_CLIENT_ID: "${LINEBOT_AUTH0_CLIENT_ID}"
  AUTH0_CLIENT_SECRET: "${LINEBOT_AUTH0_CLIENT_SECRET}"
  ADMIN_SESSION_SECRET: "${LINEBOT_ADMIN_SESSION_SECRET}"
