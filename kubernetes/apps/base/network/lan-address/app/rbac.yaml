---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: lan-address-probe
  namespace: network
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: lan-address-probe
rules:
  # The pool is this component's only output. It is deliberately not allowed to
  # touch the pool rendered from cluster.yaml, or any other cluster state.
  - apiGroups: ["cilium.io"]
    resources: ["ciliumloadbalancerippools"]
    verbs: ["get", "create", "patch", "update"]
    resourceNames: ["pool-discovered"]
  # create cannot be restricted by resourceNames — the object does not exist yet
  # when the request is admitted — so it is granted separately and the name is
  # fixed in the script.
  - apiGroups: ["cilium.io"]
    resources: ["ciliumloadbalancerippools"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: lan-address-probe
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: lan-address-probe
subjects:
  - kind: ServiceAccount
    name: lan-address-probe
    namespace: network
