---
# ServiceAccount monitoring/daily-check may write httproutes only as a
# server-side dry-run (ferry133/jg-base#205).
#
# Daily-check row 30 needs `create` on httproutes, because admission runs only
# on writes and the hostname policy can only be watched admitting by writing.
# RBAC cannot grant "dry-run only", so the plain grant would let that account
# create a real route in any namespace, and a route outside a tenant namespace
# is not bounded by tenant-httproute-hostnames: it could claim im.<domain>.
# This policy closes that: any httproutes write by that account that is not a
# dry-run is refused.
#
# - No paramKind: the #205 failure was the ConfigMap param informer, and this
#   policy must not share it.
# - `request.dryRun` is always set for CEL admission (kube-apiserver v1.35
#   staging/src/k8s.io/apiserver/pkg/admission/plugin/cel/activation.go
#   sets DryRun from attr.IsDryRun()); read from source, not measured on a
#   cluster.
# - Every write operation, not CREATE alone, so a later wider grant stays
#   bounded too.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: daily-check-dry-run-only
  labels:
    app.kubernetes.io/part-of: tenant-isolation
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [gateway.networking.k8s.io]
        apiVersions: ["*"]
        operations: [CREATE, UPDATE, DELETE]
        resources: [httproutes]
  matchConditions:
    - name: daily-check-only
      expression: >-
        request.userInfo.username == 'system:serviceaccount:monitoring:daily-check'
  validations:
    - expression: request.dryRun == true
      message: monitoring/daily-check may write httproutes only with --dry-run=server
      reason: Forbidden
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: daily-check-dry-run-only
  labels:
    app.kubernetes.io/part-of: tenant-isolation
spec:
  policyName: daily-check-dry-run-only
  validationActions: [Deny]
