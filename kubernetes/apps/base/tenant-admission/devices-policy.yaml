---
# A pod in a tenant namespace may request a device only when the tenant holds
# the devices grant (ferry133/jg-base#188; fleet-ops root
# `standalone-app-repos` D9, task 8.2).
#
# "A device" is ANY extended resource, not just `devic.es/serial`: the test is
# "a resource name other than cpu, memory, ephemeral-storage or hugepages-*".
# Default-deny on purpose — a device plugin added later (another domain, a
# GPU) is covered without anyone remembering to come back here, and a
# too-narrow policy fails open while a too-broad one fails loudly.
# How MANY devices a granted tenant may take is its ResourceQuota
# (`requests.devic.es/serial`), rendered by jg-cluster-template.
#
# Only `requests` is read, and that covers limits: an extended resource must
# have a limit, and the apiserver defaults its request from that limit BEFORE
# admission. Measured on kube-apiserver v1.36.0 (scripts/check-tenant-device-
# policy.sh): a limit-only pod is denied by a requests-only check, and a
# version that also read limits could not be told apart by any pod. Init
# containers count too; an ephemeral container cannot carry resources at all.
#
# CREATE only, unlike tenant-loadbalancer-services: a pod's container
# resources are immutable after creation (in-place resize covers cpu and
# memory only, through pods/resize), so UPDATE cannot add a device. Matching
# UPDATE would instead deny every later metadata update of a pod whose grant
# was revoked — a finalizer could then never be removed.
#
# Both labels it reads come from the platform: `jg.tenant` and
# `jg.tenant-devices` on the Namespace are rendered by jg-cluster-template,
# and tenant-admin has no verbs on Namespace.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: tenant-device-requests
  labels:
    app.kubernetes.io/part-of: tenant-isolation
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE]
        resources: [pods]
  variables:
    - name: containers
      expression: >-
        object.spec.containers +
        (has(object.spec.initContainers) ? object.spec.initContainers : [])
    - name: devices
      expression: >-
        variables.containers.map(c,
          has(c.resources) && has(c.resources.requests) ? c.resources.requests.map(k, k) : []
        ).map(names, names.filter(k,
          !(k in ['cpu', 'memory', 'ephemeral-storage']) && !k.startsWith('hugepages-')
        )).filter(names, size(names) > 0)
    - name: nsLabels
      expression: namespaceObject.metadata.labels
  matchConditions:
    - name: requests-a-device
      expression: >-
        (object.spec.containers +
         (has(object.spec.initContainers) ? object.spec.initContainers : [])).exists(c,
          has(c.resources) && has(c.resources.requests) && c.resources.requests.exists(k,
            !(k in ['cpu', 'memory', 'ephemeral-storage']) && !k.startsWith('hugepages-')))
  validations:
    - expression: >-
        'jg.tenant-devices' in variables.nsLabels &&
        variables.nsLabels['jg.tenant-devices'] == 'granted'
      messageExpression: >-
        'tenant "' + variables.nsLabels['jg.tenant'] + '" has no devices grant
        (devices in cluster.yaml), so this pod may not request ' +
        variables.devices.map(names, names.join(', ')).join(', ')
      reason: Forbidden
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: tenant-device-requests
  labels:
    app.kubernetes.io/part-of: tenant-isolation
spec:
  policyName: tenant-device-requests
  validationActions: [Deny]
  # Tenant namespaces only: no platform pod is ever evaluated.
  matchResources:
    namespaceSelector:
      matchExpressions:
        - key: jg.tenant
          operator: Exists
