---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: flux-instance
spec:
  chartRef:
    kind: OCIRepository
    name: flux-instance
  interval: 1h
  values:
    instance:
      distribution:
        artifact: oci://ghcr.io/controlplaneio-fluxcd/flux-operator-manifests:v0.43.0
      cluster:
        networkPolicy: false
      components:
        - source-controller
        - kustomize-controller
        - helm-controller
        - notification-controller
      sync:
        kind: GitRepository
        url: "${FLUX_SYNC_URL}"
        ref: "refs/heads/main"
        path: kubernetes/flux/cluster
        # The steady-state half of private-repo support (ferry133/jg-base#53,
        # routed from jg-cluster-template#56). bootstrap already sets a
        # pullSecret on the FluxInstance it creates; this block then declares
        # the WHOLE sync stanza, so minutes later Helm re-renders the same
        # object without one and the SSH URL loses its credential. Bootstrap
        # working is not the same as the cluster staying up.
        #
        # ## What an EMPTY value does, measured rather than assumed
        #
        # #53 held this open on exactly one question: most of the fleet is
        # public and gets "", and nobody had measured whether flux-operator
        # reads that as "unset" or as "a Secret whose name is the empty string".
        # Getting it wrong breaks every public cluster at once.
        #
        # It cannot happen, and the reason is upstream of flux-operator: chart
        # 0.43.0's templates/instance.yaml:61 guards the field with
        # `{{- if .Values.instance.sync.pullSecret }}`, which is false for "",
        # so the key is never emitted. `helm template` of this exact values
        # block, three ways:
        #
        #   pullSecret unset (today)      -> no pullSecret in the FluxInstance
        #   pullSecret ""   (public)      -> byte-identical to today, whole render
        #   pullSecret github-deploy-key  -> exactly one line added
        #
        # So the empty value never reaches the API server and flux-operator
        # never sees it. Same shape as the longhorn backupTarget measurement in
        # #7: the safety comes from the value domain, not from a runtime check.
        #
        # `:=` default because a per-user repo that has not re-rendered has no
        # FLUX_SYNC_PULL_SECRET at all, and this file's convention everywhere
        # else is an explicit default rather than relying on what postBuild does
        # with an undefined name.
        #
        # Quoted, deliberately — a rendered YAML scalar decides its own type and
        # this repo has been bitten three times by that (#16's boolean,
        # NODE_DNS_PATH, jgct's base_repo_ref). A Secret name is a string.
        pullSecret: "${FLUX_SYNC_PULL_SECRET:=}"
      commonMetadata:
        labels:
          app.kubernetes.io/name: flux
      kustomize:
        patches:
          - # Increase the number of workers
            patch: |
              - op: add
                path: /spec/template/spec/containers/0/args/-
                value: --concurrent=10
              - op: add
                path: /spec/template/spec/containers/0/args/-
                value: --requeue-dependency=5s
            target:
              kind: Deployment
              name: (kustomize-controller|helm-controller|source-controller)
          - # Increase the memory limits
            patch: |
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: all
              spec:
                template:
                  spec:
                    containers:
                      - name: manager
                        resources:
                          limits:
                            memory: 1Gi
            target:
              kind: Deployment
              name: (kustomize-controller|helm-controller|source-controller)
          - # Enable in-memory kustomize builds
            patch: |
              - op: add
                path: /spec/template/spec/containers/0/args/-
                value: --concurrent=20
              - op: replace
                path: /spec/template/spec/volumes/0
                value:
                  name: temp
                  emptyDir:
                    medium: Memory
            target:
              kind: Deployment
              name: kustomize-controller
          - # Enable Helm repositories caching
            patch: |
              - op: add
                path: /spec/template/spec/containers/0/args/-
                value: --helm-cache-max-size=10
              - op: add
                path: /spec/template/spec/containers/0/args/-
                value: --helm-cache-ttl=60m
              - op: add
                path: /spec/template/spec/containers/0/args/-
                value: --helm-cache-purge-interval=5m
            target:
              kind: Deployment
              name: source-controller
          - # Flux near OOM detection for Helm
            patch: |
              - op: add
                path: /spec/template/spec/containers/0/args/-
                value: --feature-gates=OOMWatch=true
              - op: add
                path: /spec/template/spec/containers/0/args/-
                value: --oom-watch-memory-threshold=95
              - op: add
                path: /spec/template/spec/containers/0/args/-
                value: --oom-watch-interval=500ms
            target:
              kind: Deployment
              name: helm-controller
          - # Disable chart digest tracking
            patch: |
              - op: add
                path: /spec/template/spec/containers/0/args/-
                value: --feature-gates=DisableChartDigestTracking=true
            target:
              kind: Deployment
              name: helm-controller
          - # Controller-level SOPS decryption
            patch: |
              - op: add
                path: /spec/template/spec/containers/0/args/-
                value: --sops-age-secret=sops-age
            target:
              kind: Deployment
              name: kustomize-controller
          - # Watch configmaps and secrets attached to HelmReleases and Kustomizations
            patch: |-
              - op: add
                path: /spec/template/spec/containers/0/args/-
                value: --watch-configs-label-selector=owner!=helm
            target:
              kind: Deployment
              name: (helm-controller|kustomize-controller)
          - # Cancel health checks on new Kustomizations revisions
            patch: |-
              - op: add
                path: /spec/template/spec/containers/0/args/-
                value: --feature-gates=CancelHealthCheckOnNewRevision=true
            target:
              kind: Deployment
              name: kustomize-controller
