---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: offsite-backup
  namespace: monitoring
---
# Only what a dump needs: find the deployment, then exec pg_dump inside it.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: offsite-backup
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: offsite-backup
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: offsite-backup
subjects:
  - kind: ServiceAccount
    name: offsite-backup
    namespace: monitoring
---
# Publishing the per-database result (offsite-backup-status). A namespaced Role
# and not an addition to the ClusterRole above: the dump needs cluster-wide
# reach to find databases, writing down what it found does not.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: offsite-backup-status
  namespace: monitoring
rules:
  # create cannot be restricted by resourceName — a POST carries the name in the
  # body, not the URL, so there is nothing for RBAC to match on. Everything that
  # can be narrowed is.
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: ["offsite-backup-status"]
    verbs: ["get", "patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: offsite-backup-status
  namespace: monitoring
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: offsite-backup-status
subjects:
  - kind: ServiceAccount
    name: offsite-backup
    namespace: monitoring
