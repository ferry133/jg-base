---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: offsite-backup
  namespace: monitoring
---
# Only what a dump needs: find the deployment, then exec pg_dump inside it.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: offsite-backup
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: offsite-backup
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: offsite-backup
subjects:
  - kind: ServiceAccount
    name: offsite-backup
    namespace: monitoring
