---
apiVersion: v1
kind: ConfigMap
metadata:
  name: offsite-backup
  namespace: monitoring
  annotations:
    # Without this, Flux's postBuild substitution rewrites the script before it
    # ever runs: every `${...}` is treated as a variable to replace. Shell
    # locals become empty (`deploy/${deploy}` → `deploy/`, which kubectl
    # rejects), `${STAMP}` disappears from the archive name so every upload
    # would overwrite the last, and — worst — the R2 credentials get inlined as
    # literals into this ConfigMap, where anything that can read ConfigMaps in
    # this namespace can read them.
    #
    # The script takes all of those from the container's environment, which the
    # CronJob populates from cluster-secrets. Substitution here has nothing to
    # contribute and everything to break.
    #
    # Measured on jgt-appliance 2026-08-15: the dump failed with an empty
    # deployment name and the job reported "nothing to back up" — the same line
    # a cluster with no databases prints, which is why nobody saw it.
    kustomize.toolkit.fluxcd.io/substitute: disabled
data:
  backup.sh: |
    #!/bin/bash
    # Off-site backup: databases, encrypted to the
    # cluster's own age public key, pushed to Cloudflare R2.
    #
    # An appliance is a single node on a single disk. Losing that disk loses the
    # database and every bit of context the agent has accumulated for that
    # customer, none of which is reconstructible. That is why backup_r2_* is
    # required under the appliance profile rather than optional.
    #
    # That sentence was true and the code did not implement it (#54). Until
    # 2026-09-01 this job dumped databases and nothing else, on the reasoning
    # recorded at the staging check below: the agent's context "lives in the
    # database, so the dumps above already cover it". **That premise is false on
    # exactly the profile the paragraph above is about** — an appliance runs no
    # database at all, so the mandatory backup protected nothing, succeeded every
    # night, and said so. Measured across three clusters: 1.5 MiB/day on a full
    # cluster with databases, ~1.6 KB/day on an appliance without.
    #
    # So this job now also captures each claude-code instance's config volume,
    # which is where that context actually lives.
    #
    # Encrypted to a public key, not a shared secret: R2 holds ciphertext that
    # the operator who owns the R2 account cannot read. Decryption travels with
    # age.key, which is what changes hands at handover.
    set -uo pipefail

    log() { echo "[$(date -u '+%Y-%m-%dT%H:%M:%SZ')] $*"; }

    if [[ -z "${BACKUP_R2_BUCKET:-}" || -z "${BACKUP_R2_ENDPOINT:-}" \
       || -z "${BACKUP_R2_ACCESS_KEY_ID:-}" || -z "${BACKUP_R2_SECRET_ACCESS_KEY:-}" ]]; then
      log "off-site backup not configured — set backup_r2_* in cluster.yaml"
      exit 0
    fi
    if [[ -z "${BACKUP_AGE_RECIPIENT:-}" ]]; then
      # Refusing is the point: uploading readable data to someone else's object
      # store is worse than not uploading, so this is a failure, not a skip.
      log "FATAL: BACKUP_AGE_RECIPIENT is empty; refusing to upload unencrypted data"
      exit 1
    fi

    STAMP="$(date -u '+%Y%m%dT%H%M%SZ')"
    WORK="$(mktemp -d)"
    trap 'rm -rf "$WORK"' EXIT
    STAGE="$WORK/${CLUSTER_NAME}-${STAMP}"
    mkdir -p "$STAGE"
    FAILED=0

    # --- databases -----------------------------------------------------------
    # Dumped through the API rather than read off disk: a file-level copy of a
    # running database's data directory is not a backup, it is a torn page.
    #
    # The dump runs inside the database's own container, so nothing is installed
    # here for it — pg_dump and mariadb-dump are already there, at versions that
    # match the server by construction. Covering another engine means adding a
    # case below, never a package to the CronJob.
    DUMPED=0 ABSENT=0 BROKEN=0
    # Names as well as counts. The counts are for the log; the names are what
    # gets published for daily-check, because "one of four failed" and "which
    # one failed" are different questions and only the second is actionable at
    # 08:00. Space-separated strings rather than arrays — see the sed note in
    # the retention block for why this file avoids clever constructs.
    DUMPED_NAMES="" ABSENT_NAMES="" BROKEN_NAMES=""

    dump_db() {
      local engine="$1" ns="$2" deploy="$3" out="$4"
      # 2>&1 >/dev/null keeps stderr and discards stdout: what the probe says on
      # failure is the whole point of running it this way.
      local probe
      if ! probe="$(kubectl -n "$ns" get deploy "$deploy" 2>&1 >/dev/null)"; then
        if [[ "$probe" == *NotFound* ]]; then
          # Absent is a normal state — each cluster installs a subset of the
          # extras — but it is reported rather than skipped in silence. Silence
          # here is indistinguishable from a database that IS installed and
          # quietly not being dumped, which is how freepbx/mariadb reached 92
          # days unbacked without anything looking wrong.
          log "${ns}/${deploy}: not installed"
          ABSENT=$((ABSENT + 1)); ABSENT_NAMES="${ABSENT_NAMES} ${ns}/${deploy}"
        else
          # An apiserver timeout, a TLS blip or a narrowed RBAC fail this probe
          # too. Counting those as "not installed" would rebuild the exact
          # silence this job exists to remove, one level further down: the
          # cluster would report a database it cannot see as one it does not
          # have. A probe that cannot answer is a failure, not an absence.
          log "${ns}/${deploy}: ERROR: cannot determine whether it exists: ${probe}"
          BROKEN=$((BROKEN + 1)); FAILED=1; BROKEN_NAMES="${BROKEN_NAMES} ${ns}/${deploy}"
        fi
        return 0
      fi

      # Single-quoted on purpose: the credentials expand inside the target
      # container, not in this shell, which never sees them.
      local cmd
      case "$engine" in
        postgres)
          cmd='pg_dump -U "$POSTGRES_USER" "$POSTGRES_DB"'
          ;;
        mariadb)
          # --single-transaction so InnoDB is read from one consistent snapshot
          # without locking a live PBX out of its own database; routines,
          # triggers and events because those are schema too, and a restore
          # missing them is not the same system.
          #
          # mariadb-dump, not mysqldump: the freepbx image carries only the
          # former, and MariaDB has shipped that name since 10.5. If some future
          # image disagrees the dump now fails loudly, which is the whole point
          # of the counters below.
          #
          # --ignore-database=mysql because the system database holds the
          # accounts, and these containers' entrypoints create those from the
          # current cluster-secrets on every fresh start. Restoring dump-time
          # accounts over them means a password rotated after the dump locks the
          # restored database against the secret the cluster actually holds —
          # discovered, if ever, in the middle of a disaster recovery. Verified
          # on jcom: --all-databases covers asterisk AND mysql; with this flag,
          # asterisk alone.
          cmd='mariadb-dump -uroot -p"$MYSQL_ROOT_PASSWORD" --all-databases --ignore-database=mysql --single-transaction --routines --triggers --events'
          ;;
        *)
          log "${ns}/${deploy}: ERROR: unknown engine ${engine}"
          BROKEN=$((BROKEN + 1)); FAILED=1; BROKEN_NAMES="${BROKEN_NAMES} ${ns}/${deploy}"; return 0
          ;;
      esac

      log "dumping ${ns}/${deploy}"
      if kubectl -n "$ns" exec "deploy/${deploy}" -- sh -c "$cmd" \
           > "$STAGE/${out}.sql" 2>"$WORK/err"; then
        if [[ -s "$STAGE/${out}.sql" ]]; then
          log "  $(wc -c <"$STAGE/${out}.sql") bytes"
          DUMPED=$((DUMPED + 1)); DUMPED_NAMES="${DUMPED_NAMES} ${ns}/${deploy}"
        else
          log "  ERROR: dump is empty"; rm -f "$STAGE/${out}.sql"
          BROKEN=$((BROKEN + 1)); FAILED=1; BROKEN_NAMES="${BROKEN_NAMES} ${ns}/${deploy}"
        fi
      else
        log "  ERROR: $(tail -1 "$WORK/err")"; rm -f "$STAGE/${out}.sql"
        BROKEN=$((BROKEN + 1)); FAILED=1; BROKEN_NAMES="${BROKEN_NAMES} ${ns}/${deploy}"
      fi
    }

    # Every database extra the cluster template recognises (#BlockTierExtras in
    # cluster.schema.cue). Exhaustive on purpose: a cluster states what it does
    # not have, so "that database was never covered" cannot be reached by an
    # entry quietly missing from this list — which is exactly how both MariaDB
    # extras went uncovered from the day this script was written.
    dump_db postgres db         postgres default-postgres
    dump_db postgres claudecode postgres claudecode-postgres
    dump_db mariadb  default    mariadb  default-mariadb
    dump_db mariadb  freepbx    mariadb  freepbx-mariadb

    log "databases: ${DUMPED} dumped, ${ABSENT} not installed, ${BROKEN} failed"

    # --- agent context (claude-code config volumes) --------------------------
    # The half #54 found missing. `claudecode/claude-code` is a base app, so
    # every cluster ships at least one instance, and each one carries a config
    # PVC holding ~/.claude — the memory, settings and history the agent has
    # accumulated for that customer. None of it is in any database, and on an
    # appliance there is no database for it to have been in.
    #
    # Captured by exec, not by mounting: instances are RWO and held by a running
    # pod, and this Job is in another namespace. `kubectl exec ... tar` sidesteps
    # both, and it is the same technique the dumps above already use, on the same
    # ClusterRole (`pods/exec: create` is already cluster-wide in rbac.yaml, so
    # this adds no permission).
    #
    # Instances are DISCOVERED, never listed: the names are template-time
    # structure from `claude_instances` (default ["im"], jg-jiahd pins ["cc"]),
    # so a hardcoded list here would silently miss whichever instance a cluster
    # actually runs — the same failure mode as the database list this file
    # already documents. The discriminator is the mount path rather than the
    # name, because that is the thing being backed up.
    #
    # NOT the keyring, which is the same PVC mounted at a different path
    # (/home/claude/.local/share/keyrings, subPath keyrings). Excluded by
    # construction rather than by a filter: tarring ~/.claude simply does not
    # reach it. D8's test is the right one and the keyring passes it — a login
    # can be redone, a year of accumulated context cannot — and it keeps the
    # cluster's live OAuth credential out of an archive that travels off-site.
    dump_claude_config() {
      local ns=claudecode
      local instances
      # jsonpath and not jq: this image installs bash/age/aws-cli/kubectl and no
      # jq, and adding a package to read one field is a worse trade than a grep.
      instances="$(kubectl -n "$ns" get deploy -o jsonpath='{range .items[*]}{.metadata.name}{" "}{.spec.template.spec.containers[*].volumeMounts[*].mountPath}{"\n"}{end}' 2>"$WORK/err" \
                    | grep -F '/home/claude/.claude' | awk '{print $1}')"
      if [[ -s "$WORK/err" ]]; then
        # Could not ask. Not the same as "there are none", and the difference is
        # the entire subject of this file.
        log "${ns}: ERROR: cannot list claude-code instances: $(tail -1 "$WORK/err")"
        BROKEN=$((BROKEN + 1)); FAILED=1; BROKEN_NAMES="${BROKEN_NAMES} ${ns}/claude-config"
        return 0
      fi
      if [[ -z "$instances" ]]; then
        # A real state: claudecode can be suspended on a cluster. Reported, not
        # silent, for the same reason an absent database is.
        log "${ns}: no claude-code instance mounts /home/claude/.claude"
        ABSENT=$((ABSENT + 1)); ABSENT_NAMES="${ABSENT_NAMES} ${ns}/claude-config"
        return 0
      fi
      local inst out
      for inst in $instances; do
        out="claudecode-${inst}-config.tar.gz"
        log "capturing ${ns}/${inst}:~/.claude"
        # -C /home/claude .claude, so the archive unpacks as .claude/ rather
        # than an absolute path.
        if kubectl -n "$ns" exec "deploy/${inst}" -- tar -czf - -C /home/claude .claude \
             > "$STAGE/${out}" 2>"$WORK/err"; then
          if [[ -s "$STAGE/${out}" ]]; then
            log "  $(wc -c <"$STAGE/${out}") bytes"
            DUMPED=$((DUMPED + 1)); DUMPED_NAMES="${DUMPED_NAMES} ${ns}/${inst}-config"
          else
            log "  ERROR: capture is empty"; rm -f "$STAGE/${out}"
            BROKEN=$((BROKEN + 1)); FAILED=1; BROKEN_NAMES="${BROKEN_NAMES} ${ns}/${inst}-config"
          fi
        else
          log "  ERROR: $(tail -1 "$WORK/err")"; rm -f "$STAGE/${out}"
          BROKEN=$((BROKEN + 1)); FAILED=1; BROKEN_NAMES="${BROKEN_NAMES} ${ns}/${inst}-config"
        fi
      done
    }

    dump_claude_config

    log "artifacts staged: ${DUMPED} captured, ${ABSENT} not installed, ${BROKEN} failed"

    # Publish the per-database outcome where daily-check can read it.
    #
    # The Job's exit code is one bit and now carries four databases, so
    # "mariadb failed while postgres succeeded", "one of four failed" and
    # "everything failed" all reach the health check as the same signal. The
    # log already distinguishes them and nothing reads the log.
    #
    # A ConfigMap rather than an annotation on the CronJob: Flux owns that
    # object and strips foreign fields on the next reconcile. And rather than
    # daily-check parsing this log, which would couple the check to wording
    # that changed twice in the week this was written.
    #
    # Three separate keys, never one pre-rendered sentence. "absent" and
    # "failed" must not be able to arrive as the same string at any layer —
    # that equivalence is the whole defect this file has been fixing.
    #
    # Deliberately written before the upload: it describes dump coverage, not
    # whether the archive landed. Those are different questions and daily-check
    # answers the second one from Job status.
    # A database that was being dumped yesterday and is merely "absent" today is
    # the 92-day failure coming back through another door. Absence does not set
    # FAILED — correctly, since most clusters install a subset — so the Job
    # succeeds, the archive uploads without that database, and every check goes
    # green forever. A Deployment does not disappear during a rolling restart:
    # this means renamed, moved namespace, deleted, or replaced by a StatefulSet.
    #
    # One generation of history separates "this cluster never had it" from "this
    # cluster stopped backing it up", and one generation is all this keeps —
    # today's dumped set is tomorrow's comparison.
    PREV_DUMPED="$(kubectl -n monitoring get cm offsite-backup-status \
                     -o jsonpath='{.data.dumped}' 2>/dev/null || true)"
    REGRESSED=""
    for prev in $PREV_DUMPED; do
      case " ${ABSENT_NAMES} " in
        *" ${prev} "*) REGRESSED="${REGRESSED} ${prev}" ;;
      esac
    done
    if [[ -n "$REGRESSED" ]]; then
      log "REGRESSION: dumped on the previous run, absent now:${REGRESSED}"
    fi

    # How much was actually staged, published where a check can act on it. #54's
    # third condition was that an empty or near-empty archive must not read as a
    # success, and the gap it named is precise: the log already printed
    # "encrypted: 1626 bytes" every night and **nothing anywhere said that number
    # was too small**. A magic floor here would be a guess (a full cluster is
    # ~1.5 MiB, an appliance legitimately far less), so the number is published
    # instead and daily-check's check 20 reports it — a size in the daily report
    # is a number a human compares to yesterday's, which is the comparison no
    # constant in this file could make correctly.
    #
    # `cat | wc -c` rather than `du -sb`: busybox du has no -b.
    STAGED_BYTES="$(cat "$STAGE"/* 2>/dev/null | wc -c | tr -d ' ')"
    log "staged ${STAGED_BYTES} bytes across $(ls -1 "$STAGE" 2>/dev/null | wc -l | tr -d ' ') artifact(s)"

    if kubectl -n monitoring create configmap offsite-backup-status \
         --from-literal=timestamp="$(date -u '+%Y-%m-%dT%H:%M:%SZ')" \
         --from-literal=staged_bytes="${STAGED_BYTES}" \
         --from-literal=dumped="${DUMPED_NAMES# }" \
         --from-literal=absent="${ABSENT_NAMES# }" \
         --from-literal=failed="${BROKEN_NAMES# }" \
         --from-literal=regressed="${REGRESSED# }" \
         --dry-run=client -o yaml \
         | kubectl apply -f - >/dev/null 2>"$WORK/cmerr"; then
      log "published status: configmap/offsite-backup-status"
    else
      # Never fatal. Failing a backup because its status could not be written
      # would turn a reporting problem into a data problem.
      log "WARNING: could not publish status: $(tail -1 "$WORK/cmerr" 2>/dev/null)"
    fi

    # D8 said the agent WORKSPACE stays out because its files are working copies
    # that can be recreated, while the context that cannot be recreated "lives in
    # the database, so the dumps above already cover it".
    #
    # The first half still holds and the workspace is still out. The second half
    # was wrong, and #54 is what it cost: an appliance runs no database, so on
    # the one profile where this backup is MANDATORY it covered nothing.
    #
    # D8's other objection — "a PVC in another namespace cannot be mounted from
    # here" — is about MOUNTING, and the capture above does not mount anything.
    # It execs, exactly as the database dumps twenty lines up already do. The
    # obstacle was real for the approach D8 had in mind and does not apply to
    # this one.
    #
    # Nothing here reads kubernetes manifests. Those live in git, which is
    # already the authoritative copy; restoring them from an archive would be
    # restoring a stale snapshot of something git holds correctly.

    if [[ -z "$(ls -A "$STAGE")" ]]; then
      # Two unrelated situations used to print the same line here, and that
      # ambiguity is D46's exact shape: a cluster whose only dump was broken
      # said "nothing to back up", word for word what a cluster with no
      # databases says on a completely healthy night.
      if (( BROKEN > 0 )); then
        log "FATAL: every database on this cluster failed to dump"
      else
        # Names what was looked for, not just that nothing was found. Since #54
        # this covers claude-code config volumes as well as databases, so
        # reaching here means BOTH were absent — which on a cluster running the
        # claudecode base app is worth reading twice, not skimming.
        log "nothing to back up: no databases installed, and no claude-code instance mounting ~/.claude"
      fi
      exit "$FAILED"
    fi

    # --- encrypt then upload -------------------------------------------------
    ARCHIVE="$WORK/${CLUSTER_NAME}-${STAMP}.tar.gz"
    tar -czf "$ARCHIVE" -C "$WORK" "${CLUSTER_NAME}-${STAMP}" || { log "FATAL: archive failed"; exit 1; }
    age -r "$BACKUP_AGE_RECIPIENT" -o "${ARCHIVE}.age" "$ARCHIVE" \
      || { log "FATAL: encryption failed"; exit 1; }
    rm -f "$ARCHIVE"
    log "encrypted: $(wc -c <"${ARCHIVE}.age") bytes"

    export AWS_ACCESS_KEY_ID="$BACKUP_R2_ACCESS_KEY_ID"
    export AWS_SECRET_ACCESS_KEY="$BACKUP_R2_SECRET_ACCESS_KEY"
    export AWS_DEFAULT_REGION=auto
    KEY="${CLUSTER_NAME}/${CLUSTER_NAME}-${STAMP}.tar.gz.age"
    if aws s3 cp --endpoint-url "$BACKUP_R2_ENDPOINT" --only-show-errors \
         "${ARCHIVE}.age" "s3://${BACKUP_R2_BUCKET}/${KEY}"; then
      log "uploaded s3://${BACKUP_R2_BUCKET}/${KEY}"
    else
      log "FATAL: upload failed"; exit 1
    fi

    # --- retention -----------------------------------------------------------
    # A cutoff this cannot compute must never become a cutoff that deletes.
    # `|| date -u '+%Y%m%d'` turned "I could not work out the date" into
    # "everything before today goes" — and that branch was taken on every single
    # run ever: this image is alpine, alpine ships no coreutils, and busybox
    # date rejects `-d '30 days ago'` outright. BACKUP_RETAIN_DAYS has therefore
    # never once had an effect. It stayed invisible only because substitution
    # broke the script upstream of here and nothing ever uploaded (D46).
    #
    # Measured on jgt-appliance 2026-08-16, the first run that got this far: the
    # first two archives this system ever produced were pruned the day after
    # they were written, with KEEP at 30.
    #
    # `-d @<epoch>` is the one spelling busybox and GNU date both accept, so the
    # arithmetic below fixes this without adding coreutils to the image.
    KEEP="${BACKUP_RETAIN_DAYS:-30}"
    CUTOFF=""
    case "$KEEP" in
      ''|*[!0-9]*)
        log "WARNING: BACKUP_RETAIN_DAYS='${KEEP}' is not a number" ;;
      *)
        # Zero has no legitimate meaning in a retention window: it places the
        # cutoff at today and deletes every archive but this run's — the same
        # outcome as the bug above, reached through configuration rather than
        # through busybox.
        if [[ "$KEEP" -lt 1 ]]; then
          log "WARNING: BACKUP_RETAIN_DAYS=${KEEP} would delete every older archive"
        else
          CUTOFF="$(date -u -d "@$(( $(date -u +%s) - KEEP * 86400 ))" '+%Y%m%d' 2>/dev/null)"
        fi ;;
    esac
    # Glob rather than a regex: this file has been bitten once already by a
    # clever construct (see the sed note below), and eight digits is eight
    # digits. An unusable cutoff keeps everything — the only safe direction.
    case "$CUTOFF" in
      [0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9]) ;;
      *) log "WARNING: no usable retention cutoff; keeping every archive"; CUTOFF="" ;;
    esac
    if [[ -n "$CUTOFF" ]]; then
      log "pruning archives older than ${CUTOFF} (${KEEP} days)"
      aws s3 ls --endpoint-url "$BACKUP_R2_ENDPOINT" "s3://${BACKUP_R2_BUCKET}/${CLUSTER_NAME}/" 2>/dev/null \
        | awk '{print $4}' | while read -r name; do
            # sed, not a bash regex capture. This script is a ConfigMap and Flux
            # runs envsubst over it before it is applied; a BASH_REMATCH capture
            # written with a numeric index reads as a variable name containing a
            # bracket, which fails to parse and takes the whole manifest with it.
            # (Array expansions using @ survive — daily-check has used them for
            # months — so it is the numeric index specifically.)
            stamp="$(echo "$name" | sed -n 's/.*-\([0-9]\{8\}\)T.*/\1/p')"
            [ -n "$stamp" ] || continue
            if [[ "$stamp" < "$CUTOFF" ]]; then
              aws s3 rm --endpoint-url "$BACKUP_R2_ENDPOINT" --only-show-errors \
                "s3://${BACKUP_R2_BUCKET}/${CLUSTER_NAME}/${name}" && log "pruned $name"
            fi
          done
    fi

    exit "$FAILED"
