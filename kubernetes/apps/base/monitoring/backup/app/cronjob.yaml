---
apiVersion: v1
kind: Secret
metadata:
  name: offsite-backup-config
  namespace: monitoring
type: Opaque
stringData:
  CLUSTER_NAME: "${CLUSTER_NAME}"
  BACKUP_AGE_RECIPIENT: "${BACKUP_AGE_RECIPIENT:=}"
  BACKUP_R2_BUCKET: "${BACKUP_R2_BUCKET:=}"
  BACKUP_R2_ENDPOINT: "${BACKUP_R2_ENDPOINT:=}"
  BACKUP_R2_ACCESS_KEY_ID: "${BACKUP_R2_ACCESS_KEY_ID:=}"
  BACKUP_R2_SECRET_ACCESS_KEY: "${BACKUP_R2_SECRET_ACCESS_KEY:=}"
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: offsite-backup
  namespace: monitoring
  labels:
    # Declared subject for daily-check's backup row (#85). The row also
    # matches on a `*-backup` name, because Longhorn generates its own
    # CronJob and RecurringJob.spec.labels labels the snapshots, not that
    # CronJob (measured against Longhorn's docs) -- so a label-only subject
    # would silently drop it. This label is what a NEW backup shipped from
    # this repo is found by; scripts/check-backup-label.sh fails the build if
    # a `*-backup` CronJob here is missing it.
    app.kubernetes.io/component: backup
spec:
  # 18:00 UTC = 02:00 Asia/Taipei, ahead of the 08:00 health check so a failure
  # is reported the same morning rather than a day late.
  schedule: "0 18 * * *"
  timeZone: "Etc/UTC"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      ttlSecondsAfterFinished: 172800
      # An upper bound, because without one a stuck run is not merely slow —
      # `concurrencyPolicy: Forbid` above means it blocks EVERY later schedule,
      # and a blocked schedule leaves no trace of its own. The stuck Job stays
      # `Running`, so nothing goes red; `startingDeadlineSeconds: 3600` stops
      # even counting missed starts after an hour; and the only signal left is
      # daily-check rows 19/21, which warn at 26h and fail at 48h — **a day
      # after the backups stopped** (ferry133/jg-base#126).
      #
      # 3600 and not 600. The measured worst case for a HEALTHY run on the slow
      # appliance is 13m27s = 807 seconds, almost all of it `apk add` pulling
      # aws-cli over a ~100 KB/s link (ferry133/jg-base#124, measured by
      # FO-openspec [8e8ef1] 2026-09-20). A 600-second deadline would kill a
      # backup that was going to succeed — turning "slow" into "no backup",
      # which is worse than the thing it guards against. Revisit downward once
      # #124 removes the install from the critical path; not before.
      activeDeadlineSeconds: 3600
      template:
        spec:
          restartPolicy: Never
          serviceAccountName: offsite-backup
          securityContext:
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: backup
              image: alpine:3.20
              command:
                - /bin/sh
                - -c
                - |
                  apk add --no-cache --quiet bash age aws-cli kubectl postgresql16-client >/dev/null \
                    && exec /bin/bash /scripts/backup.sh
              envFrom:
                - secretRef:
                    name: offsite-backup-config
              volumeMounts:
                - name: scripts
                  mountPath: /scripts
              resources:
                requests:
                  cpu: 50m
                  memory: 128Mi
                limits:
                  memory: 1Gi
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
          volumes:
            - name: scripts
              configMap:
                name: offsite-backup
                defaultMode: 0755
