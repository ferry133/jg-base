---
apiVersion: v1
kind: ConfigMap
metadata:
  name: daily-check-script
  namespace: monitoring
  annotations:
    kustomize.toolkit.fluxcd.io/substitute: disabled
data:
  msmtprc.template: |
    defaults
    auth           on
    tls            on
    tls_trust_file /etc/ssl/certs/ca-certificates.crt
    logfile        -

    account        gmail
    host           __SMTP_HOST__
    port           __SMTP_PORT__
    from           __SMTP_FROM__
    user           __SMTP_USERNAME__
    password       __SMTP_PASSWORD__

    account default : gmail

  run-check.sh: |
    #!/bin/bash
    # Production daily health check for a single cluster.
    # Reads config from env vars (sourced from daily-check-config Secret).
    # Outputs an email and pings healthchecks.io.
    set -uo pipefail

    : "${CLUSTER_NAME:?required}"
    : "${SMTP_HOST:?required}"
    : "${SMTP_PORT:?required}"

    # daily-check is a base app, so it lands on clusters whose cluster.yaml has
    # no daily_check_* values yet. Skip quietly instead of failing a Job every
    # day: there is nowhere to send the report until those are filled in.
    if [[ -z "${SMTP_USERNAME:-}" || -z "${SMTP_PASSWORD:-}" || -z "${SMTP_FROM:-}" || -z "${NOTIFY_EMAIL_TO:-}" ]]; then
      echo "daily-check is not configured for cluster ${CLUSTER_NAME}: set" \
           "daily_check_smtp_username / _password / _from / _notify_email_to" \
           "in cluster.yaml, then re-run task configure. Skipping this run."
      exit 0
    fi
    NAS_SERVER="${NAS_SERVER:-}"
    HEALTHCHECKS_PING_URL="${HEALTHCHECKS_PING_URL:-}"
    ENDPOINTS_TO_PROBE="${ENDPOINTS_TO_PROBE:-}"

    echo "==> Installing tools"
    apk add --no-cache --quiet bash curl jq msmtp ca-certificates bind-tools openssl coreutils >/dev/null
    K8S_VERSION=$(curl -fsSL https://dl.k8s.io/release/stable.txt)
    curl -fsSL "https://dl.k8s.io/release/${K8S_VERSION}/bin/linux/amd64/kubectl" -o /usr/local/bin/kubectl
    chmod +x /usr/local/bin/kubectl

    echo "==> Configuring msmtp"
    mkdir -p /tmp/msmtp
    sed \
      -e "s|__SMTP_HOST__|${SMTP_HOST}|g" \
      -e "s|__SMTP_PORT__|${SMTP_PORT}|g" \
      -e "s|__SMTP_FROM__|${SMTP_FROM}|g" \
      -e "s|__SMTP_USERNAME__|${SMTP_USERNAME}|g" \
      -e "s|__SMTP_PASSWORD__|${SMTP_PASSWORD}|g" \
      /scripts/msmtprc.template > /tmp/msmtp/msmtprc
    chmod 600 /tmp/msmtp/msmtprc

    echo "==> Running checks"
    DATE_LOCAL=$(TZ=Asia/Taipei date '+%Y-%m-%d %H:%M %Z')
    declare -a SUMMARY=()
    declare -a DETAILS=()
    FAIL_COUNT=0
    WARN_COUNT=0
    SKIP_COUNT=0

    # Three outcomes, not two. `skip` is "this check could not be evaluated
    # here" — a gate is unset, a tool is missing, the question does not apply to
    # this cluster. With only pass/fail, that state has nowhere to go but
    # silence, and a check that emitted no row reads exactly like one that
    # passed. It carries no alarm and gates nothing; it is only there so the
    # reader can see the difference between seventeen checks passing and
    # sixteen passing while one never ran.
    record() {
      local level="$1" name="$2" msg="${3:-}"
      case "$level" in
        ok)   SUMMARY+=("✅ ${name}") ;;
        warn) SUMMARY+=("⚠️ ${name} — ${msg}"); DETAILS+=("[WARN] ${name}: ${msg}"); ((WARN_COUNT++)) ;;
        fail) SUMMARY+=("❌ ${name} — ${msg}"); DETAILS+=("[FAIL] ${name}: ${msg}"); ((FAIL_COUNT++)) ;;
        skip) SUMMARY+=("➖ ${name} — ${msg}"); DETAILS+=("[SKIP] ${name}: ${msg}"); ((SKIP_COUNT++)) ;;
      esac
    }

    # RFC3339 (what the API server returns) to epoch seconds. Prints nothing if
    # it cannot parse, and callers must treat that as "unknown" rather than
    # substituting a number.
    #
    # This is not fixing a live defect: the install step above adds coreutils,
    # so `date` here is GNU and `-d "<RFC3339>"` parses. It removes a way to
    # fail badly rather than a failure. The previous spelling ended `|| echo 0`,
    # which turns an unparseable timestamp into the epoch — 1970, i.e. an age of
    # roughly half a million hours, i.e. a confident FAIL and a withheld
    # dead-man ping, in response to not knowing.
    #
    # The busybox fallback is cheap insurance, not decoration: the sibling job
    # in this same directory runs on alpine WITHOUT coreutils, and a GNU date
    # spelling there is exactly what silently deleted its own backups until
    # 6403b5c. Measured in that image: `-d "<RFC3339>"` is refused outright,
    # while the explicit strptime form `-D` works. GNU has no -D, so GNU is
    # tried first.
    epoch_of() {
      date -u -d "$1" +%s 2>/dev/null \
        || date -u -D "%Y-%m-%dT%H:%M:%SZ" -d "$1" +%s 2>/dev/null \
        || true
    }

    # 0. Purge ghost pods — terminal-phase (Succeeded/Failed) pods owned by a
    # replica controller (ReplicaSet/DaemonSet/StatefulSet). These are leftovers
    # from node disruption/eviction that the controller has already replaced;
    # they cause false FAILs (e.g. a "Completed" cloudflare-tunnel pod) and clutter.
    # Job/CronJob-owned Completed pods are intentionally NOT purged (that is normal
    # job history managed by the Job controller).
    GHOST_PODS=$(kubectl get pods -A -o json 2>/dev/null | jq -r '
      .items[]
      | select(.status.phase=="Failed" or .status.phase=="Succeeded")
      | select(((.metadata.ownerReferences // [])[0].kind // "") as $k
               | $k=="ReplicaSet" or $k=="DaemonSet" or $k=="StatefulSet")
      | "\(.metadata.namespace)/\(.metadata.name)"')
    PURGED=0
    if [[ -n "$GHOST_PODS" ]]; then
      while IFS= read -r np; do
        [[ -z "$np" ]] && continue
        kubectl delete pod -n "${np%%/*}" "${np#*/}" --grace-period=0 >/dev/null 2>&1 && PURGED=$((PURGED+1))
      done <<< "$GHOST_PODS"
    fi
    [[ "$PURGED" -gt 0 ]] && record ok "Purged ${PURGED} ghost pod(s)" || record ok "No ghost pods"

    # 1. Nodes Ready
    NOT_READY=$(kubectl get nodes --no-headers 2>&1 | awk '$2 != "Ready" {print $1}')
    if [[ -z "$NOT_READY" ]]; then
      record ok "Nodes Ready"
    else
      record fail "Nodes Ready" "Not Ready: $(echo "$NOT_READY" | tr '\n' ' ')"
    fi

    # 2. Flux Kustomizations
    #
    # Split by `spec.suspend`, because the two are not the same finding and one
    # of them cannot be fixed by anything this cluster will do on its own.
    #
    # A suspended Kustomization does not reconcile, so whatever Ready it last
    # wrote is frozen there. If it failed and was then suspended, `Ready=False`
    # stays forever and no reconcile will ever clear it — reporting that as a
    # live failure is an alarm that can never go off, which this repo treats as
    # worse than no alarm because it teaches people to skip the row. It is a
    # warning naming a stale status instead.
    #
    # `[]?` still matters: an object that has never reconciled has no
    # conditions, produces zero rows here, and is counted as neither. That is
    # what lets a new Kustomization ship suspended to every cluster (see
    # storage/longhorn/backup-ks.yaml) without turning this check red.
    KS_JSON=$(kubectl get kustomization -A -o json 2>/dev/null)
    BAD_KS=$(echo "$KS_JSON" | \
      jq -r '.items[] | select(.spec.suspend != true) | select(.status.conditions[]? | select(.type=="Ready" and .status!="True")) | "\(.metadata.namespace)/\(.metadata.name)"')
    STALE_KS=$(echo "$KS_JSON" | \
      jq -r '.items[] | select(.spec.suspend == true) | select(.status.conditions[]? | select(.type=="Ready" and .status!="True")) | "\(.metadata.namespace)/\(.metadata.name)"')
    if [[ -n "$BAD_KS" ]]; then
      record fail "Flux Kustomizations" "Not Ready: $(echo "$BAD_KS" | tr '\n' ' ')"
    elif [[ -n "$STALE_KS" ]]; then
      record warn "Flux Kustomizations" "suspended while not Ready, so this status is frozen and will not clear itself: $(echo "$STALE_KS" | tr '\n' ' ')"
    else
      record ok "Flux Kustomizations all Ready"
    fi

    # 3. HelmReleases
    BAD_HR=$(kubectl get hr -A -o json 2>/dev/null | \
      jq -r '.items[] | select(.status.conditions[]? | select(.type=="Ready" and .status!="True")) | "\(.metadata.namespace)/\(.metadata.name)"')
    if [[ -z "$BAD_HR" ]]; then
      record ok "HelmReleases all Ready"
    else
      record fail "HelmReleases" "Not Ready: $(echo "$BAD_HR" | tr '\n' ' ')"
    fi

    # 4. Pod restarts (>5 in last 24h) and abnormal pods
    ABNORMAL_PODS=$(kubectl get pods -A --no-headers 2>/dev/null | \
      awk '$4 != "Running" && $4 != "Completed" && $4 != "Succeeded" {print $1"/"$2" ("$4")"}' | head -20)
    if [[ -z "$ABNORMAL_PODS" ]]; then
      record ok "Pods all healthy"
    else
      record fail "Pods abnormal" "$(echo "$ABNORMAL_PODS" | head -10 | tr '\n' '; ')"
    fi

    # Pods that restarted within the last 24h (recency-based, NOT lifetime total).
    # k8s only exposes cumulative .restartCount, so a long-lived-but-stable pod would
    # trip a ">N lifetime" check forever. Gate on the most recent restart time
    # (lastState.terminated.finishedAt) so this reflects *current* instability.
    RECENT_RESTART=$(kubectl get pods -A -o json 2>/dev/null | jq -r '
      .items[] |
      select(.status.containerStatuses != null) |
      . as $p |
      ($p.status.containerStatuses | map(.restartCount) | add) as $total |
      ([ $p.status.containerStatuses[] | .lastState.terminated.finishedAt // empty ]
        | map(fromdateiso8601) | max // 0) as $last |
      select($total > 0 and $last > (now - 86400)) |
      "\($p.metadata.namespace)/\($p.metadata.name): \($total) total, last \(((now - $last)/3600)|floor)h ago"' | head -10)
    if [[ -z "$RECENT_RESTART" ]]; then
      record ok "No pods restarted in last 24h"
    else
      record warn "Pods restarted in last 24h" "$(echo "$RECENT_RESTART" | tr '\n' '; ')"
    fi

    # 5. PVCs all Bound
    BAD_PVC=$(kubectl get pvc -A --no-headers 2>/dev/null | awk '$3 != "Bound" {print $1"/"$2" ("$3")"}')
    if [[ -z "$BAD_PVC" ]]; then
      record ok "PVCs all Bound"
    else
      record fail "PVCs" "$(echo "$BAD_PVC" | tr '\n' '; ')"
    fi

    # 6. Postgres backup CronJob
    if kubectl -n db get cronjob postgres-backup >/dev/null 2>&1; then
      LAST_BACKUP_JOB=$(kubectl -n db get jobs --sort-by=.metadata.creationTimestamp -o json 2>/dev/null | \
        jq -r '[.items[] | select(.metadata.name | startswith("postgres-backup-"))] | last')
      # k8s 1.33+ adds a "SuccessCriteriaMet" condition before "Complete", so
      # conditions[0] is no longer reliable — match the condition by type instead.
      LAST_STATUS=$(echo "$LAST_BACKUP_JOB" | jq -r '
        if   ((.status.conditions // []) | any(.type=="Complete" and .status=="True")) then "Complete"
        elif ((.status.conditions // []) | any(.type=="Failed"   and .status=="True")) then "Failed"
        else "Unknown" end')
      LAST_TIME=$(echo "$LAST_BACKUP_JOB" | jq -r '.metadata.creationTimestamp // "never"')
      if [[ "$LAST_STATUS" == "Complete" ]]; then
        record ok "Postgres backup (last: ${LAST_TIME})"
      else
        record fail "Postgres backup" "Last job status: ${LAST_STATUS}, time: ${LAST_TIME}"
      fi
    else
      # skip, not ok (#43). "There is no CronJob here" is an absence of
      # measurement, and a ✅ against a line reading "backup" is read as
      # "backups are fine". The data may well be covered by offsite-backup —
      # another row says so — but this row cannot see that, and a check that
      # renders identically whether or not it looked is the thing this report
      # exists not to do.
      record skip "Postgres backup" "no backup CronJob is deployed here, so this row measured nothing — it is not a statement that the data is unprotected, nor that it is protected"
    fi

    # 7. Postgres pod
    if kubectl -n db get deploy postgres >/dev/null 2>&1; then
      PG_READY=$(kubectl -n db get deploy postgres -o jsonpath='{.status.readyReplicas}' 2>/dev/null)
      if [[ "$PG_READY" == "1" ]]; then
        record ok "Postgres pod Ready"
      else
        record fail "Postgres pod" "ReadyReplicas=${PG_READY:-0}"
      fi
    fi

    # 8. TLS certificates nearing expiry (14 days)
    CERT_ISSUES=$(kubectl get certificate -A -o json 2>/dev/null | jq -r '
      .items[] |
      select(.status.notAfter != null) |
      .status.notAfter as $exp |
      ($exp | fromdate) as $expEpoch |
      (now + (14 * 86400)) as $threshold |
      select($expEpoch < $threshold) |
      "\(.metadata.namespace)/\(.metadata.name) expires \($exp)"')
    if [[ -z "$CERT_ISSUES" ]]; then
      record ok "TLS certificates (>14d remaining)"
    else
      record warn "TLS certificates nearing expiry" "$(echo "$CERT_ISSUES" | tr '\n' '; ')"
    fi

    # 9. Warning events in last 1h (limited window since events default TTL is 1h)
    WARN_EVENTS=$(kubectl get events -A --field-selector type=Warning --no-headers 2>/dev/null | wc -l)
    if [[ "$WARN_EVENTS" -le 20 ]]; then
      record ok "Warning events in last hour: ${WARN_EVENTS}"
    else
      TOP_WARNS=$(kubectl get events -A --field-selector type=Warning --no-headers 2>/dev/null | \
        awk '{print $4}' | sort | uniq -c | sort -rn | head -5 | tr '\n' '; ')
      record warn "Warning events spiked (${WARN_EVENTS})" "Top reasons: ${TOP_WARNS}"
    fi

    # 10. Cloudflare tunnel pods
    TUNNEL_BAD=$(kubectl get pod -A -l app.kubernetes.io/name=cloudflare-tunnel --no-headers 2>/dev/null | \
      awk '$4 != "Running" {print $1"/"$2" ("$4")"}')
    if [[ -z "$TUNNEL_BAD" ]]; then
      record ok "Cloudflare tunnel pods Running"
    else
      record fail "Cloudflare tunnel pods" "$(echo "$TUNNEL_BAD" | tr '\n' '; ')"
    fi

    # 11. External endpoint reachability (ferry133/jg-base#43).
    #
    # This check used to `curl "$url"` straight from the pod, and on every
    # cluster here that measures the wrong thing. k8s-gateway serves split DNS,
    # so an external name resolves to the LAN address of envoy-internal and the
    # probe reaches the internal gateway. Measured 2026-08-28 on an appliance
    # cluster: this row was `✅ External endpoints OK`, FAIL_COUNT=0, while an
    # off-site vantage got FAILED / HTTP 000 for the same names — that zone had
    # no public A record at all. **Not reachable from anywhere outside, and
    # this check was green.**
    #
    # It also stayed green after the zone was fixed, so its two states are
    # indistinguishable: it has never carried information about the thing its
    # name claims.
    #
    # The fix is to resolve the name the way the outside world does and then
    # force the connection to that address:
    #
    #   1. Resolve over DoH. **HTTPS on 443, not UDP/53** — a LAN router that
    #      transparently redirects all outbound :53 makes `dig @1.1.1.1` answer
    #      from the router while looking like a public query, which is the trap
    #      the factory README documents and the one #43 hit on a workstation.
    #      Naming a public resolver is not the same as reaching one.
    #   2. `curl --resolve host:443:<public-ip>`, which bypasses the pod
    #      resolver entirely, so the request follows public DNS → Cloudflare
    #      edge → tunnel rather than the LAN shortcut.
    #
    # THREE outcomes, not two, because "I could not measure this" is a distinct
    # answer and a two-outcome check files it under `ok`:
    #
    #   fail  - resolves nowhere publicly, or the public path answers non-2xx/3xx
    #   skip  - no public resolver reachable, or the public record is RFC1918
    #   ok    - a public address answered
    #
    # NXDOMAIN is confirmed against a SECOND resolver before it counts as a
    # failure: one resolver having a bad moment must not mark a healthy cluster
    # down. An address from either is enough to proceed.
    #
    # Honest boundary: this still runs inside the cluster, so it proves the
    # public name and the edge answer, not that an arbitrary internet client
    # gets through. It is strictly more than before — it can now be red — but a
    # true outside vantage is still the only thing that measures the whole path.
    #
    # ⚠️ ENDPOINTS_TO_PROBE is by definition a list of names that MUST be
    # reachable from OUTSIDE. An internal-only name belongs in no part of it:
    # `echo-int.<domain>` is published on envoy-internal and correctly has no
    # public A record, so this check would call a correctly configured cluster
    # broken every morning. That is the mirror of the defect this rewrite fixes
    # — not a false green but a **false red**, and a false red gets silenced,
    # after which it reads exactly like coverage.
    #
    # The list is the declaration of intent, because nothing here can derive it.
    # "Is this endpoint supposed to be reachable from outside" is not a property
    # of the name or of DNS. Both sides were measured on 2026-08-28, and they
    # are the same observation:
    #
    #   im.janncot.cc      during the outage (SHOULD be external)
    #                        -> no public A record, resolves inside the cluster
    #   echo-int.janncot.cc deliberately internal
    #                        -> no public A record, resolves inside the cluster
    #
    # So anything keying on the name or on DNS is guessing intent. The two wrong
    # guesses do not cost the same: guessing "internal, so skip" turns a real
    # outage silent, guessing "external, so fail" is merely noisy. **When it is
    # genuinely unclear whether to alarm, alarming is the safe side** — the
    # inverse of the rule check 18 follows, and not in tension with it, because
    # there the level was asserting something the probe could not support.
    #
    # Considered and not taken: reading the HTTPRoute's parentRef to see which
    # gateway serves the hostname. Not because it costs a cluster query —
    # that reason falls over the moment someone points out operators mistype
    # lists, which they do. It is not taken because **it answers a different
    # question**:
    #
    #   "is this external endpoint reachable from outside?"   <- this check
    #   "does the endpoint list agree with the routing?"      <- parentRef
    #
    # The second is worth checking on its own (a list naming echo-int while its
    # HTTPRoute sits on envoy-internal is a real contradiction). Folded in here,
    # a red row would no longer say which of the two failed — which is exactly
    # the mistake #43's own acceptance condition made by combining "can the
    # logic go red" with "does it behave in a real container". If parentRef is
    # ever done it is a NEW check, not an upgrade of this one.
    #
    # The failure message carries the operator-facing half of this, because the
    # person who hits it is reading the report, not this comment. It gives BOTH
    # readings and says the check cannot separate them — malignant first (the
    # record is gone, i.e. an outage) and benign second (the name is internal
    # and should not be in the list).
    #
    # Writing only the benign one, which an earlier version did, hands a
    # reassuring sentence to whoever is looking at a real outage. Narrowing it
    # instead — only hint "internal-only" when the name NEVER had a public
    # record — was considered and is not possible: that needs history, and each
    # run is stateless. A single run sees "no public A record now" and cannot
    # separate "never had one" from "had one until an hour ago". That is the
    # same indistinguishability as the intent question above, moved onto the
    # time axis.
    #
    # So the message states its own limit rather than picking a side. Narrowing
    # would have made it silent in one of the two cases, and silence is the
    # thing this whole rewrite exists to remove.
    #
    # ⚠️ STATE OF VERIFICATION, 2026-08-28 (fleet-ops session, on jg-janncotcc,
    # against the deployed ConfigMap):
    #
    #   ok    exercised -- "External endpoints reachable via public DNS"
    #   fail  exercised -- an internal-only name in the list produced the row
    #         above and FAIL_COUNT=1, by overriding ENDPOINTS_TO_PROBE only,
    #         with no change to cluster configuration
    #   skip  NOT exercised
    #
    # The skip branch is the one that most needed it and the one that could not
    # be reached: forcing it means blocking BOTH DoH providers from the pod,
    # which is deliberate damage to a live cluster. It is left explicitly
    # unverified rather than presumed from the other two passing -- if it is
    # broken, its symptom is reading "could not measure" as something else,
    # which is the subject of #43 rather than an unrelated risk.
    if [[ -n "$ENDPOINTS_TO_PROBE" ]]; then
      ENDPOINT_FAILS=()
      ENDPOINT_UNMEASURED=()
      for url in $ENDPOINTS_TO_PROBE; do
        ep_host="${url#*://}"; ep_host="${ep_host%%/*}"; ep_host="${ep_host%%:*}"
        PUB_IP=""; DOH_REACHED=0
        for doh in "https://cloudflare-dns.com/dns-query" "https://dns.google/resolve"; do
          doh_ans=$(curl -fsS -m 10 -H 'accept: application/dns-json' "${doh}?name=${ep_host}&type=A" 2>/dev/null) || continue
          DOH_REACHED=1
          PUB_IP=$(echo "$doh_ans" | jq -r '[(.Answer // [])[] | select(.type == 1) | .data] | first // empty' 2>/dev/null)
          [[ -n "$PUB_IP" ]] && break
        done
        if [[ $DOH_REACHED -eq 0 ]]; then
          ENDPOINT_UNMEASURED+=("${ep_host}=no public resolver reachable")
          continue
        fi
        if [[ -z "$PUB_IP" ]]; then
          ENDPOINT_FAILS+=("${ep_host}=no public DNS record — either the record is gone (an outage: this name was reachable before) or this name is internal-only and does not belong in DAILY_CHECK_ENDPOINTS. This check cannot tell which; look at the zone")
          continue
        fi
        if [[ "$PUB_IP" =~ ^(10\.|172\.(1[6-9]|2[0-9]|3[01])\.|192\.168\.) ]]; then
          ENDPOINT_UNMEASURED+=("${ep_host}=public record is private (${PUB_IP}), unreachable from outside by design")
          continue
        fi
        code=$(curl -ksI -o /dev/null -w '%{http_code}' --max-time 10 --resolve "${ep_host}:443:${PUB_IP}" "$url" || echo "000")
        if [[ "$code" =~ ^(2|3) ]]; then
          : # reachable over the public path
        else
          ENDPOINT_FAILS+=("$url=$code via ${PUB_IP}")
        fi
      done
      if [[ ${#ENDPOINT_FAILS[@]} -gt 0 ]]; then
        record fail "External endpoints unreachable from outside" "$(printf '%s; ' "${ENDPOINT_FAILS[@]}")"
      elif [[ ${#ENDPOINT_UNMEASURED[@]} -gt 0 ]]; then
        record skip "External endpoints" "$(printf '%s; ' "${ENDPOINT_UNMEASURED[@]}")this row cannot claim external reachability, and saying so is not the same as saying it is fine"
      else
        record ok "External endpoints reachable via public DNS"
      fi
    fi

    # 12. NAS connectivity (ICMP via in-cluster shell — only check DNS resolution since ICMP often blocked)
    if [[ -n "$NAS_SERVER" ]]; then
      if curl -ksS --connect-timeout 5 "https://${NAS_SERVER}:5001/" -o /dev/null 2>&1 || \
         nc -zw5 "$NAS_SERVER" 2049 2>/dev/null; then
        record ok "NAS ${NAS_SERVER} reachable"
      else
        record fail "NAS ${NAS_SERVER}" "Not reachable on port 2049/5001"
      fi
    fi

    # 13. Node resource usage
    if kubectl top nodes >/dev/null 2>&1; then
      NODE_PRESSURE=$(kubectl top nodes --no-headers 2>/dev/null | \
        awk '{
          cpu = $3+0; mem = $5+0;
          if (cpu > 80) printf "%s CPU=%s%% ", $1, $3;
          if (mem > 85) printf "%s MEM=%s%% ", $1, $5;
        }')
      if [[ -z "$NODE_PRESSURE" ]]; then
        record ok "Node resource pressure normal"
      else
        record warn "Node resource pressure" "$NODE_PRESSURE"
      fi
    fi

    # 14. Node disk pressure (via Conditions)
    DISK_PRESSURE=$(kubectl get nodes -o json 2>/dev/null | jq -r '
      .items[] | .metadata.name as $n |
      .status.conditions[] | select(.type=="DiskPressure" and .status=="True") | $n')
    if [[ -z "$DISK_PRESSURE" ]]; then
      record ok "Node disk pressure clear"
    else
      record fail "Node DiskPressure" "$(echo "$DISK_PRESSURE" | tr '\n' ' ')"
    fi

    # 15. GitRepository sources
    BAD_GIT=$(kubectl get gitrepository -A -o json 2>/dev/null | \
      jq -r '.items[] | select(.status.conditions[]? | select(.type=="Ready" and .status!="True")) | "\(.metadata.namespace)/\(.metadata.name)"')
    if [[ -z "$BAD_GIT" ]]; then
      record ok "Flux GitRepository sources Ready"
    else
      record fail "Flux GitRepository sources" "$(echo "$BAD_GIT" | tr '\n' ' ')"
    fi

    # 16. LoadBalancer address assignment.
    #
    # Cilium's own message is misleading here and must not be forwarded as-is.
    # A port collision on a shared address reports reason=out_of_ips with
    # "pools ... ran out of allocatable IPs", which sends the reader looking for
    # a pool that is too small when the real cause is that another Service
    # already claimed that port on that address. Under the single-address LAN
    # design those two causes are indistinguishable from the message alone, so
    # the explanation has to come from here.
    UNSATISFIED=$(kubectl get svc -A -o json 2>/dev/null | jq -r '
      .items[]
      | select(.spec.type=="LoadBalancer")
      | select(.status.conditions[]? | select(.type=="cilium.io/IPAMRequestSatisfied" and .status!="True"))
      | "\(.metadata.namespace)/\(.metadata.name)=\(
          [.status.conditions[]? | select(.type=="cilium.io/IPAMRequestSatisfied") | .reason][0] // "unknown")"')
    if [[ -z "$UNSATISFIED" ]]; then
      record ok "LoadBalancer addresses assigned"
    else
      HINT=""
      if grep -q "out_of_ips" <<<"$UNSATISFIED"; then
        HINT=" (out_of_ips usually means a port clash on the shared address, not a small pool)"
      fi
      if grep -q "already_allocated_incompatible_service" <<<"$UNSATISFIED"; then
        HINT="${HINT} (incompatible_service usually means a missing lbipam.cilium.io/sharing-cross-namespace)"
      fi
      record fail "LoadBalancer addresses" "$(echo "$UNSATISFIED" | tr '\n' ' ')${HINT}"
    fi

    # 17. Discovered LAN addresses.
    #
    # NOT appliance-only, however much the component reads that way. The probe
    # lives in apps/base/network/, so it ships to every cluster, and suspending
    # its Kustomization does not remove a Deployment already created — measured
    # 2026-08-19: jcom has lan-address-probe running 7d, `lan-address-probe`
    # suspended=true, and a stray `pool-discovered` holding 10.9.8.254 that no
    # Service uses. jg-jiahd has neither. So "declares its addresses" predicts
    # nothing about whether pool-discovered exists, and any check here that
    # assumes an appliance runs on clusters that are not one.
    #
    # Both pools, not just the shared one. lan-address publishes two scoped
    # pools (see kubernetes/apps/base/network/lan-address/README.md), and
    # reading only `pool-discovered` meant a reselection of the envoy-external
    # address was never reported at all — the record existed on an object
    # nothing looked at, which is indistinguishable from no reselection.
    SHARED_POOL_ADDR=""; EXT_POOL_ADDR=""; EXT_POOL_ABSENT=0
    if kubectl get ciliumloadbalancerippool pool-discovered >/dev/null 2>&1; then
      LB_SVC=$(kubectl get svc -A -o json 2>/dev/null)
      svc_holding() {  # every ns/name whose LoadBalancer address is $1
        jq -r --arg ip "$1" '[.items[]
          | select([.status.loadBalancer.ingress[]?.ip] | index($ip))
          | "\(.metadata.namespace)/\(.metadata.name)"] | join(" ")' <<<"$LB_SVC"
      }
      gw_lb_ip() {
        jq -r --arg gw "$1" '[.items[]
          | select(.metadata.labels["gateway.envoyproxy.io/owning-gateway-name"]==$gw)
          | .status.loadBalancer.ingress[0].ip // empty][0] // ""' <<<"$LB_SVC"
      }
      for POOL_SPEC in "pool-discovered:shared address" "pool-discovered-external:envoy-external address"; do
        DISC_POOL="${POOL_SPEC%%:*}"; DISC_WHAT="${POOL_SPEC#*:}"
        DISC=$(kubectl get ciliumloadbalancerippool "$DISC_POOL" -o json 2>/dev/null) || DISC=""
        if [[ -z "$DISC" ]]; then
          # Noted, not reported — 17a decides whether a missing pool matters,
          # because on a cluster whose discovered pool nothing uses it does not.
          # jcom is that cluster and its probe is suspended, so it will never
          # publish the second pool: a warn here would be permanently amber and
          # would assert a mechanism ("on its next pass") that is untrue there.
          # A daily amber row nobody can clear trains the same blindness as a
          # red one nobody reads — see check 18.
          [[ "$DISC_POOL" == "pool-discovered-external" ]] && EXT_POOL_ABSENT=1
          continue
        fi
        DISC_ADDR=$(jq -r '.spec.blocks[0].start // "none"' <<<"$DISC")
        DISC_PREV=$(jq -r '.metadata.annotations["lan-address.jg-base/previous"] // ""' <<<"$DISC")
        DISC_AT=$(jq -r '.metadata.annotations["lan-address.jg-base/reselected-at"] // ""' <<<"$DISC")
        case "$DISC_POOL" in
          pool-discovered)          SHARED_POOL_ADDR="$DISC_ADDR" ;;
          pool-discovered-external) EXT_POOL_ADDR="$DISC_ADDR" ;;
        esac
        if [[ "$DISC_ADDR" == "none" ]]; then
          record warn "LAN ${DISC_WHAT} unallocated" "${DISC_POOL} is empty — the probe found no free address for it, so its consumer stays <pending>"
        elif [[ -n "$DISC_PREV" ]]; then
          # A reselection means a LAN-facing service moved address. Anything
          # that cached the old one — a pinned MQTT broker, a HomeKit pairing —
          # has to be repointed, so this is reported rather than logged quietly.
          record warn "LAN ${DISC_WHAT} reselected" "now ${DISC_ADDR}, was ${DISC_PREV} (at ${DISC_AT}); LAN clients holding the old address need repointing"
        else
          record ok "LAN ${DISC_WHAT} stable (${DISC_ADDR})"
        fi
      done

      # 17a. Is the partition holding — is envoy-external kept off the shared
      # address, and the shared group off envoy-external's?
      #
      # That is the property, and it is worth being exact about why it is
      # phrased this way. The first version of this check asserted that each
      # Service's address EQUALS its pool's address. On an appliance those
      # coincide, so it looked right. On a cluster that declares its addresses
      # AND has a pool-discovered lying around, they are two pools with two
      # purposes and equality was never the contract: measured on jcom,
      # envoy-internal holds 10.9.8.4 and k8s-gateway 10.9.8.3 from the static
      # pool while pool-discovered holds an unused 10.9.8.254 — two mismatches,
      # a daily FAIL, and with it the /fail ping for the other twenty checks.
      # An appliance-only invariant behind a guard that is not appliance-only.
      #
      # The obvious repair — skip Services carrying lbipam.cilium.io/ips — is
      # wrong in the way that matters: an appliance declaring lan_shared_addr
      # back-fills ${CLUSTER_GATEWAY_ADDR}, so envoy-internal and k8s-gateway
      # carry that annotation there too (measured on jgt-appliance). It would
      # switch this check off on exactly the cluster it exists to protect, and a
      # check that has quietly stopped applying reads like one that passed.
      #
      # So: assert the partition, not equality. Both halves stay true whether or
      # not addresses are declared, and only one of them can be false at a time
      # for a benign reason.
      #
      # It still runs only where the discovered pool is actually serving this
      # cluster. A pool nothing draws from has no allocation to check, and
      # saying so beats inventing a verdict about it.
      SHARED_HOLDERS=""
      [[ -n "$SHARED_POOL_ADDR" && "$SHARED_POOL_ADDR" != "none" ]] && \
        SHARED_HOLDERS=$(svc_holding "$SHARED_POOL_ADDR")
      EXT_HOLDERS=""
      [[ -n "$EXT_POOL_ADDR" && "$EXT_POOL_ADDR" != "none" ]] && \
        EXT_HOLDERS=$(svc_holding "$EXT_POOL_ADDR")
      EXT_ACTUAL=$(gw_lb_ip envoy-external)

      if [[ -z "$SHARED_HOLDERS" && -z "$EXT_HOLDERS" ]]; then
        record ok "Discovered LAN pool present but unused" "no Service holds ${SHARED_POOL_ADDR}${EXT_POOL_ADDR:+ or ${EXT_POOL_ADDR}}; this cluster gets its LoadBalancer addresses from the static pool, so there is no discovered allocation to check. If this cluster is not an appliance, the pool and its probe are strays worth removing"
      else
        PART_BAD=""; PART_NOTE=""
        # The #9 failure itself: envoy-external on the shared address evicts
        # envoy-internal, k8s-gateway and mqtt together, and LAN DNS goes down
        # completely rather than partially.
        if [[ -n "$EXT_ACTUAL" && "$EXT_ACTUAL" == "$SHARED_POOL_ADDR" ]]; then
          PART_BAD+="envoy-external holds the shared address ${SHARED_POOL_ADDR}; "
        fi
        # The mirror: nothing but envoy-external may draw from its pool.
        if [[ -n "$EXT_HOLDERS" ]]; then
          for HOLDER in $EXT_HOLDERS; do
            case "$HOLDER" in
              network/envoy-external) ;;
              *) PART_BAD+="${HOLDER} holds envoy-external's address ${EXT_POOL_ADDR}; " ;;
            esac
          done
        fi
        # The external pool exists, nothing drew from it, and envoy-external has
        # no address — the shape a serviceSelector that stopped matching leaves.
        if [[ -n "$EXT_POOL_ADDR" && "$EXT_POOL_ADDR" != "none" && -z "$EXT_HOLDERS" && -z "$EXT_ACTUAL" ]]; then
          PART_NOTE="pool-discovered-external holds ${EXT_POOL_ADDR} and no Service drew from it while envoy-external has no address — check that its serviceSelector still matches"
        elif [[ "$EXT_POOL_ABSENT" == 1 ]]; then
          # Only here: the discovered pool IS serving this cluster, so the
          # second one is genuinely owed and its absence leaves envoy-external
          # unscoped — the pre-#9 state.
          PART_NOTE="pool-discovered is in use but pool-discovered-external does not exist, so envoy-external is drawing from an unscoped pool. Either the probe has not completed a pass since ferry133/jg-base#9 landed, or it is not reconciling — check whether Kustomization lan-address-probe is suspended"
        fi

        if [[ -n "$PART_BAD" ]]; then
          record fail "LAN address partition broken" "${PART_BAD}the serviceSelectors on pool-discovered/pool-discovered-external are not keeping these Services apart — see kubernetes/apps/base/network/lan-address/README.md and ferry133/jg-base#9. If envoy-external holds the shared address, the sharing group is one Service recreation away from losing LAN DNS entirely"
        elif [[ -n "$PART_NOTE" ]]; then
          record warn "LAN address partition not observable" "${PART_NOTE} — this is not a pass, it is a missing measurement"
        elif [[ -z "$EXT_POOL_ADDR" || "$EXT_POOL_ADDR" == "none" ]]; then
          # Say what was actually asserted. With no external pool there is only
          # half a partition to check, and calling that "allocation matches its
          # pools" would claim the half that was never looked at.
          record ok "envoy-external is off the discovered shared address (${SHARED_POOL_ADDR})"
        else
          record ok "LAN address partition holds (shared ${SHARED_POOL_ADDR} → ${SHARED_HOLDERS:-nobody}, external ${EXT_POOL_ADDR} → ${EXT_HOLDERS:-nobody})"
        fi
      fi
    fi

    # 18. Can the LAN still resolve internal names?
    #
    # Can a client on this LAN still resolve internal names?
    #
    # That is the whole question. Every internal hostname resolves to an address
    # on the customer's own LAN, and the path that delivers it — the router's
    # DNS pointed at k8s-gateway (D32) — is an external contract this cluster
    # cannot enforce. A router reset, a replacement unit, or an ISP-pushed
    # config takes every internal name down while every component in here stays
    # green.
    #
    # So ask it the way a client asks it: resolve the name through the node's
    # ordinary resolution path, no @server. Which of the three methods in
    # fleet-ops docs/operations/router-dns.md is in force does not matter,
    # because all three are just routes for the same answer and this asks
    # whether the answer arrives.
    #
    # The two earlier versions both asked a narrower question and paid for it.
    # Asking the router directly (dig @gateway) asked whether the ROUTER
    # resolves, which is
    # only a question under conditional forwarding — under the shipping default
    # the router hands out the cluster's resolver address and is never in the
    # resolution path, so it failed every morning on correctly configured
    # appliances (jg-base 260db56 downgraded it to a warning). Declaring the
    # method in cluster.yaml would have fixed that by storing a second copy of a
    # fact that lives in the router; when the two disagree the check does not go
    # quiet, it makes a confident wrong claim.
    #
    # It does not try to say WHY. An alarm is the deliverable; a human reads
    # fleet-ops docs/operations/router-dns.md and finds out which layer broke.
    #
    # `fleet-ops ` is a repo name, not a directory: the runbooks moved out of
    # the public jg-cluster-template on 2026-08-22 because a tracked file there
    # is copied into every customer repo. ferry133/fleet-ops is private, and
    # jg-cluster-template spells its own `fleet-ops docs/...` pointers the same
    # way on purpose (its README.md says so, and says outright that an operator
    # without access cannot follow them) — one convention, not two. Deliberately
    # no count here: a number in a comment is a measurement that expires, and
    # the one that was here said 25 when `git grep -o "fleet-ops docs/"` on
    # jg-cluster-template origin/main returns 20.
    #
    # ⚠️ Re-review the two message strings below when
    # `daily_check_notify_email_to` first names anyone other than ferry133.
    # Those two live in an EMAIL, unlike jg-cluster-template's, which live in
    # files their reader has checked out. A recipient without fleet-ops
    # access cannot follow them. Measured 2026-08-23 (fleet-ops#1): every
    # configured recipient on jcom, jg-janncotcc and jg-jiahd is ferry133
    # himself, and cluster.sample.yaml ships the field commented out. That is
    # the only reason this is acceptable today.
    #
    # NODE_DNS_PATH gates it because the probe is only valid where the node's
    # resolution path IS the LAN's. With nameservers pinned to a public resolver
    # the node cannot see what a client sees, and Cloudflare will not serve the
    # RFC1918 answer at all (D29) — so the probe could never pass, on a cluster
    # whose LAN is perfectly healthy. Derived in jg-cluster-template from
    # node_dns_servers; never declared by an operator.
    #
    # It is a word and not a boolean, and that is load-bearing (#16). Kustomize
    # does not preserve the quotes around a bare `${VAR}` — measured, and
    # `!!str`, single quotes and block scalars are all normalised away too — so
    # whatever Flux substitutes in is re-typed by the YAML parser. `true` came
    # back as a YAML boolean, `stringData` only accepts strings, and the API
    # server rejected the WHOLE Secret: no daily-check at all, no eighteen
    # checks, no dead-man ping. `lan` and `public` cannot be read as anything
    # but strings. Do not "tidy" them back into true/false, and note that
    # yes/no/on/off are YAML 1.1 booleans as well.
    #
    # Unset is a third outcome, not a quiet pass: a cluster that has not been
    # re-rendered since jg-cluster-template started emitting this cannot say
    # whether its nodes resolve like a LAN client, and "cannot say" must look
    # different from "asked and fine".
    case "${NODE_DNS_PATH:-}" in
      lan)
        if [[ -n "${SECRET_DOMAIN:-}" ]] && command -v dig >/dev/null 2>&1; then
          INTERNAL_NAME="internal.${SECRET_DOMAIN}"
          LAN_ANS=$(dig +short +time=3 +tries=1 "$INTERNAL_NAME" A 2>/dev/null | head -1)
          if [[ "$LAN_ANS" =~ ^(10\.|172\.(1[6-9]|2[0-9]|3[01])\.|192\.168\.) ]]; then
            record ok "LAN resolves internal names (${LAN_ANS})"
          elif [[ -z "$LAN_ANS" ]]; then
            # warn and not fail (ferry133, 2026-08-28, ferry133/jg-base#41):
            # "if cannot get internal.<domain>'s IP, just clear alarm this issue
            # which might be related to DNS setting. Do not alarm the cluster
            # failure."
            #
            # This is the third check in this file to reach that conclusion, and
            # the other two both named THIS one as the counterexample: check 16
            # ("a permanently red row, which is the failure mode check 18
            # already documents") and check 21 ("that is exactly #6: check 18
            # FAILs every day under the shipping DNS default"). Only FAIL_COUNT
            # gates the dead-man ping at the end of this script, so `fail` here
            # pings /fail and healthchecks.io shows the whole cluster Down.
            #
            # The old message already said "the cluster itself may be entirely
            # healthy" while recording `fail`, which pinged /fail and said the
            # opposite. The level, not the prose, is what the dashboard reads.
            #
            # There is also a limit on what this probe can support. INTERNAL_NAME
            # is served by k8s-gateway and only reaches a node if the LAN router
            # forwards ${SECRET_DOMAIN} to it — a router-side provisioning step
            # outside this cluster. An empty answer therefore cannot separate
            # "that step was never done" from "it was done and broke": both are
            # NXDOMAIN, byte for byte. `fail` asserted the second on evidence
            # that cannot distinguish it from the first.
            #
            # Why this became urgent rather than staying theoretical:
            # jg-cluster-template#29 changed node_dns_servers to default to
            # node_default_gateway, which is always private, so NODE_DNS_PATH
            # now derives to `lan` where it used to derive to `public`. #6 was
            # survived by not probing at all; that shelter is gone, and the
            # structural fix was never made. This is it.
            record warn "LAN cannot resolve internal names" "${INTERNAL_NAME} did not resolve through this node's ordinary resolution path, so a client on this LAN cannot reach anything by name either. This is a LAN DNS provisioning fact, not a statement about this cluster — the cluster may be entirely healthy, and it is deliberately not counted as a cluster failure. Start at fleet-ops docs/operations/router-dns.md"
          else
            record warn "LAN resolves internal names to an unexpected address" "${INTERNAL_NAME} resolved to ${LAN_ANS}, which is not an address on this LAN"
          fi
        else
          record skip "LAN resolves internal names" "this cluster's nodes do resolve like a LAN client, but the probe could not run: SECRET_DOMAIN is unset or dig is missing from this image"
        fi
        ;;
      public)
        record skip "LAN resolves internal names" "these nodes resolve through a public resolver, so a node cannot stand in for a LAN client here and the probe would fail on a perfectly healthy LAN — see fleet-ops docs/operations/router-dns.md"
        ;;
      *)
        record skip "LAN resolves internal names" "NODE_DNS_PATH is unset, so it is not known whether this node's resolution path is the LAN's. The cluster has not been re-rendered since jg-cluster-template started emitting it — nothing is known about LAN name resolution here, in either direction"
        ;;
    esac

    # 19. Off-site backup freshness.
    #
    # An appliance is one disk. A backup that silently stopped running is
    # indistinguishable from one that never existed until the day it is needed,
    # so staleness is a FAIL — which withholds the dead-man ping and surfaces it
    # even if the mail itself never arrives.
    LAST_BACKUP=$(kubectl -n monitoring get jobs -o json 2>/dev/null | jq -r '
      [.items[]
       | select(.metadata.name | startswith("offsite-backup"))
       | select(.status.succeeded == 1)
       | .status.completionTime] | sort | last // ""')
    if [[ -n "${BACKUP_R2_BUCKET:-}" ]]; then
      if [[ -z "$LAST_BACKUP" ]]; then
        record fail "Off-site backup" "configured but has never completed successfully"
      else
        BACKUP_EPOCH="$(epoch_of "$LAST_BACKUP")"
        if [[ -z "$BACKUP_EPOCH" ]]; then
          # Unknown age, said as unknown. Guessing in either direction is worse:
          # low invents a healthy backup, high invents an outage.
          record warn "Off-site backup" "cannot parse completion time (${LAST_BACKUP})"
        else
          AGE_H=$(( ( $(date -u +%s) - BACKUP_EPOCH ) / 3600 ))
          if (( AGE_H > 48 )); then
            record fail "Off-site backup stale" "last success ${AGE_H}h ago (${LAST_BACKUP})"
          elif (( AGE_H > 26 )); then
            record warn "Off-site backup late" "last success ${AGE_H}h ago"
          else
            record ok "Off-site backup fresh (${AGE_H}h ago)"
          fi
        fi
      fi
    else
      # warn, not ok. "Not configured" was green on the reasoning that it is a
      # statement about this cluster rather than a fault — a prosumer/full
      # cluster may well have its own backups elsewhere. That reasoning holds
      # and still produces the wrong row: a green tick against a backup line
      # reads as "backups are fine", when what is true is that nothing here is
      # copied off-site and nothing here can see a backup taken by other means.
      # An undiscriminating check that renders identically to a passing one is
      # the thing this report exists to not do.
      #
      # warn and not fail, deliberately: only FAIL_COUNT gates the dead-man ping
      # (see the end of this script), so failing here would cost the /fail
      # signal for every other check on every cluster that backs up by other
      # means — a permanently red row, which is the failure mode check 18
      # already documents. Appliance validation requires backup_r2_* precisely
      # so this branch cannot be reached there.
      record warn "Off-site backup not configured" "BACKUP_R2_BUCKET is unset, so nothing in this cluster is copied off-site. Deliberate if this cluster is backed up by other means — but that is not visible from here, so it cannot be reported as healthy"
    fi

    # 20. Off-site backup coverage — which databases, not merely whether it ran.
    #
    # Check 19 answers "did the pipeline land recently". This answers "did every
    # database it knows about make it into the archive", and the two fail
    # independently: an archive can upload on time with a database missing from
    # it, and check 19 cannot tell.
    #
    # The Job's exit code is one bit and the script now covers four databases,
    # so "mariadb failed while postgres succeeded" and "everything failed"
    # arrive here identically. The detail is read from a ConfigMap the backup
    # publishes rather than parsed out of its log — parsing would couple this
    # check to wording that changed twice in the week it was written — and the
    # outcomes are separate keys so "absent" and "failed" cannot reach this
    # check as the same string.
    if [[ -n "${BACKUP_R2_BUCKET:-}" ]]; then
      # stderr to its own file and branch on the exit code, rather than folding
      # 2>&1 into the value: the API server prepends Warning: headers to
      # perfectly successful reads (admission webhooks, deprecations), which
      # would make a healthy GET look unreadable and paste the warning into the
      # email. Swallowing stderr entirely is the other wrong answer — then "not
      # published yet" and "cannot read it" become the same line, which is the
      # conflation this pair of checks exists to remove.
      COV_ERR=$(mktemp)
      if COV=$(kubectl -n monitoring get cm offsite-backup-status -o json 2>"$COV_ERR"); then
        COV_READ=1
      else
        COV_READ=0; COV_MSG=$(tr '\n' ' ' <"$COV_ERR")
      fi
      rm -f "$COV_ERR"
      if [[ "$COV_READ" -eq 0 ]]; then
        if [[ "$COV_MSG" == *NotFound* ]]; then
          # Expected on the first run after this shipped, and worth a warn
          # rather than silence if it persists: the backup is not publishing.
          record warn "Off-site backup coverage" \
            "no status published yet — appears after the next backup run"
        else
          record warn "Off-site backup coverage" "cannot read status: ${COV_MSG}"
        fi
      else
        # `absent` is deliberately published but not read here: keeping it a
        # separate key is what stops it ever being folded into `failed`, and
        # the log already names which databases a cluster does not have.
        COV_TS=$(echo "$COV"   | jq -r '.data.timestamp // ""')
        COV_OK=$(echo "$COV"   | jq -r '.data.dumped // ""')
        COV_BAD=$(echo "$COV"  | jq -r '.data.failed // ""')
        # A database that was dumped on the previous run and is absent now. The
        # backup cannot call that a failure — absence is normal — but it is the
        # one shape of absence that means coverage was lost rather than never
        # configured, and it must not reach a green line.
        COV_GONE=$(echo "$COV" | jq -r '.data.regressed // ""')
        COV_EPOCH="$(epoch_of "$COV_TS")"
        COV_AGE_H=""
        [[ -n "$COV_EPOCH" ]] && COV_AGE_H=$(( ( $(date -u +%s) - COV_EPOCH ) / 3600 ))
        if [[ -n "$COV_BAD" || -n "$COV_GONE" ]]; then
          # The line this whole issue exists for: name them.
          COV_MSG=""
          [[ -n "$COV_BAD" ]] && COV_MSG="failed to dump: ${COV_BAD}"
          [[ -n "$COV_GONE" ]] && COV_MSG="${COV_MSG:+${COV_MSG}; }was dumped on the previous run, absent now: ${COV_GONE}"
          record fail "Off-site backup coverage" "$COV_MSG"
        elif [[ -z "$COV_AGE_H" ]]; then
          # Unknown age, said as unknown — the same rule check 19 follows twenty
          # lines up. Falling through to ok would assert coverage from a status
          # that might be months old.
          record warn "Off-site backup coverage" "cannot parse status timestamp (${COV_TS})"
        elif (( COV_AGE_H > 26 )); then
          # 26h, matching check 19's "late" threshold rather than its 48h
          # "stale". A different number here produces a report that says the
          # backup is late and, on the next line, that coverage is fine.
          record warn "Off-site backup coverage" \
            "status is ${COV_AGE_H}h old and describes an earlier run"
        elif [[ -z "$COV_OK" ]]; then
          # No databases dumped, none failed, and none lost since the last run:
          # this cluster installed none of them. A real state, and distinct from
          # a failure, which is why they are separate keys.
          record ok "Off-site backup coverage (no databases installed)"
        else
          record ok "Off-site backup coverage (${COV_OK})"
        fi
      fi
    fi

    # 21. Stalled provisioning tickets (factory-agent 3.8).
    #
    # This check NEVER records `fail`, and that is a property of the design
    # rather than an accident of today's threshold. Only FAIL_COUNT gates the
    # dead-man ping at the end of this script, so a `fail` here would let one
    # slow delivery mark the whole cluster Down on healthchecks.io. That is
    # exactly #6: check 18 FAILs every day under the shipping DNS default, so
    # "the cluster died" and "one check is noisy" became the same state on that
    # dashboard. **A ticket sitting too long is a fact about a delivery, not
    # about whether this cluster is alive.** Anything added here later must keep
    # that separation.
    #
    # Silent unless configured, following ENDPOINTS_TO_PROBE and NAS_SERVER
    # above. No cluster sets these today, so this adds nothing anywhere until
    # someone opts in.
    if [[ -n "${FACTORY_TICKET_REPO:-}" && -n "${FACTORY_TICKET_TOKEN:-}" ]]; then
      STAGE_PREFIX="${FACTORY_STAGE_LABEL_PREFIX:-stage/}"
      # Deliberately generous, and the number is the point of the whole check.
      # No provisioning has been timed end to end yet, so anything tighter would
      # be invented rather than derived — and a check that trips during normal
      # work teaches the reader to skip it, which costs more than the check is
      # worth. Tighten once real stage durations exist: that is a value change,
      # not a code change.
      STALL_H="${FACTORY_STALL_HOURS:-48}"
      GH_AUTH="Authorization: Bearer ${FACTORY_TICKET_TOKEN}"
      GH_ACC="Accept: application/vnd.github+json"
      GH_BASE="https://api.github.com/repos/${FACTORY_TICKET_REPO}"

      TICKETS=$(curl -fsS --max-time 20 -H "$GH_AUTH" -H "$GH_ACC" \
        "${GH_BASE}/issues?state=open&per_page=100" 2>/dev/null || true)

      if [[ -z "$TICKETS" ]]; then
        # The third state, said as itself. "Could not ask" is not "nothing is
        # stalled", and folding it into ok is how an unreachable API, a revoked
        # token or a rate limit becomes a clean report. Warn, not fail: an
        # unreachable github.com says nothing about this cluster's liveness.
        record warn "Stalled provisioning tickets" \
          "could not query ${FACTORY_TICKET_REPO} — network, token or rate limit. NOT measured this run"
      else
        # 3.3's invariant is exactly one stage label per ticket. Tickets holding
        # more than one are reported rather than resolved by picking: silently
        # choosing would conceal the precise inconsistency 3.7 exists to
        # escalate, and would do it while printing a reassuring number.
        mapfile -t TICKET_ROWS < <(printf '%s' "$TICKETS" | jq -r --arg p "$STAGE_PREFIX" '
          .[] | select(has("pull_request") | not) | . as $i
          | [ $i.labels[].name | select(startswith($p)) ] as $s
          | select(($s | length) > 0)
          | "\($i.number)\t\($s | join(","))\t\($s | length)"' 2>/dev/null || true)

        TOTAL_TICKETS=$(printf '%s' "$TICKETS" | jq -r 'length' 2>/dev/null || echo 0)
        STALLED=(); MULTI=(); UNMEASURED=()

        if (( ${#TICKET_ROWS[@]} > 0 )); then
          for row in "${TICKET_ROWS[@]}"; do
            [[ -z "$row" ]] && continue
            num=${row%%$'\t'*}; rest=${row#*$'\t'}
            stage=${rest%%$'\t'*}; cnt=${rest##*$'\t'}
            if (( cnt > 1 )); then MULTI+=("#${num} carries ${cnt}: ${stage}"); continue; fi
            # updated_at is the wrong clock — a comment resets it without the
            # stage moving. Time-in-stage is the age of the `labeled` event for
            # the label the ticket holds now.
            EV=$(curl -fsS --max-time 20 -H "$GH_AUTH" -H "$GH_ACC" \
              "${GH_BASE}/issues/${num}/events?per_page=100" 2>/dev/null || true)
            TS=$(printf '%s' "$EV" | jq -r --arg l "$stage" \
              '[ .[] | select(.event=="labeled" and .label.name==$l) ] | last | .created_at // empty' \
              2>/dev/null || true)
            EP=$(epoch_of "$TS")
            if [[ -z "$EP" ]]; then
              # Same rule as checks 19 and 20: unknown age is reported as
              # unknown. epoch_of prints nothing rather than 0, so this cannot
              # become an age of half a million hours.
              UNMEASURED+=("#${num} (${stage})"); continue
            fi
            AGE_H=$(( ( $(date -u +%s) - EP ) / 3600 ))
            (( AGE_H > STALL_H )) && STALLED+=("#${num} ${stage} ${AGE_H}h")
          done
        fi

        # 100 is the page size and no pagination is followed. Say so when the
        # cap is reached rather than reporting a clean subset as a clean whole.
        (( TOTAL_TICKETS >= 100 )) && UNMEASURED+=("first page only: ${TOTAL_TICKETS} open tickets returned, later pages not fetched")

        MSG=""
        (( ${#STALLED[@]} > 0 ))    && MSG="stalled >${STALL_H}h: $(printf '%s; ' "${STALLED[@]}")"
        (( ${#MULTI[@]} > 0 ))      && MSG="${MSG:+${MSG} }multiple stage labels (3.3 violated): $(printf '%s; ' "${MULTI[@]}")"
        (( ${#UNMEASURED[@]} > 0 )) && MSG="${MSG:+${MSG} }not measured: $(printf '%s; ' "${UNMEASURED[@]}")"

        if [[ -n "$MSG" ]]; then
          record warn "Provisioning tickets" "$MSG"
        else
          record ok "Provisioning tickets (${#TICKET_ROWS[@]} in progress, none over ${STALL_H}h)"
        fi
      fi
    fi

    echo "==> Compiling report"
    if [[ $FAIL_COUNT -gt 0 ]]; then
      STATUS_TAG="❌ ${FAIL_COUNT} FAIL"
      [[ $WARN_COUNT -gt 0 ]] && STATUS_TAG="${STATUS_TAG}, ${WARN_COUNT} WARN"
    elif [[ $WARN_COUNT -gt 0 ]]; then
      STATUS_TAG="⚠️ ${WARN_COUNT} WARN"
    else
      STATUS_TAG="✅ OK"
    fi
    SUBJECT="[${CLUSTER_NAME}] Daily Health Check — ${DATE_LOCAL%% *} ${STATUS_TAG}"

    BODY_FILE=$(mktemp)
    {
      echo "From: ${SMTP_FROM}"
      echo "To: ${NOTIFY_EMAIL_TO}"
      echo "Subject: ${SUBJECT}"
      echo "Content-Type: text/plain; charset=UTF-8"
      echo "MIME-Version: 1.0"
      echo ""
      echo "Cluster:  ${CLUSTER_NAME}"
      echo "Time:     ${DATE_LOCAL}"
      echo "Result:   ${STATUS_TAG}"
      echo "Counts:   ${FAIL_COUNT} FAIL, ${WARN_COUNT} WARN, ${SKIP_COUNT} NOT MEASURED, $((${#SUMMARY[@]} - FAIL_COUNT - WARN_COUNT - SKIP_COUNT)) OK"
      echo
      echo "=== Summary ==="
      for line in "${SUMMARY[@]}"; do
        echo "  $line"
      done
      if [[ ${#DETAILS[@]} -gt 0 ]]; then
        echo
        echo "=== Issue Details ==="
        for line in "${DETAILS[@]}"; do
          echo "  $line"
        done
      fi
      echo
      echo "-- "
      echo "daily-check from cluster ${CLUSTER_NAME}"
    } > "$BODY_FILE"

    echo "==> Summary"
    for line in "${SUMMARY[@]}"; do
      echo "  $line"
    done
    if [[ ${#DETAILS[@]} -gt 0 ]]; then
      echo "==> Details"
      for line in "${DETAILS[@]}"; do
        echo "  $line"
      done
    fi

    echo "==> Sending email to ${NOTIFY_EMAIL_TO}"
    IFS=',' read -ra RECIPIENTS <<< "$NOTIFY_EMAIL_TO"
    if msmtp --file=/tmp/msmtp/msmtprc "${RECIPIENTS[@]/#/ }" < "$BODY_FILE"; then
      echo "Email sent successfully."
    else
      echo "WARNING: msmtp returned non-zero. Email may not have been delivered." >&2
    fi

    echo "==> Pinging healthchecks.io"
    if [[ -n "$HEALTHCHECKS_PING_URL" ]]; then
      if [[ $FAIL_COUNT -gt 0 ]]; then
        curl -fsS -m 10 --retry 3 "${HEALTHCHECKS_PING_URL}/fail" -o /dev/null && echo "Pinged /fail" || echo "Ping to /fail failed" >&2
      else
        curl -fsS -m 10 --retry 3 "${HEALTHCHECKS_PING_URL}" -o /dev/null && echo "Ping OK" || echo "Ping failed" >&2
      fi
    else
      echo "HEALTHCHECKS_PING_URL not set, skipping ping"
    fi

    echo "==> Done. Exit FAIL_COUNT=${FAIL_COUNT}"
    # Always exit 0 — failures are reported via email, not via job status
    exit 0
