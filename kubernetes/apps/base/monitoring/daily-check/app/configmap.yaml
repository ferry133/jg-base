---
apiVersion: v1
kind: ConfigMap
metadata:
  name: daily-check-script
  namespace: monitoring
  annotations:
    kustomize.toolkit.fluxcd.io/substitute: disabled
data:
  msmtprc.template: |
    defaults
    auth           on
    tls            on
    tls_trust_file /etc/ssl/certs/ca-certificates.crt
    logfile        -

    account        gmail
    host           __SMTP_HOST__
    port           __SMTP_PORT__
    from           __SMTP_FROM__
    user           __SMTP_USERNAME__
    password       __SMTP_PASSWORD__

    account default : gmail

  run-check.sh: |
    #!/bin/bash
    # Production daily health check for a single cluster.
    # Reads config from env vars (sourced from daily-check-config Secret).
    # Outputs an email and pings healthchecks.io.
    set -uo pipefail

    : "${CLUSTER_NAME:?required}"
    : "${SMTP_HOST:?required}"
    : "${SMTP_PORT:?required}"

    # daily-check is a base app, so it lands on clusters whose cluster.yaml has
    # no daily_check_* values yet. That state has to stay visible from OUTSIDE
    # the cluster, because on such a cluster no other channel can report it:
    #
    #   email     gated on DAILY_CHECK_SMTP_{USERNAME,PASSWORD,FROM} + _NOTIFY_EMAIL_TO
    #   dead-man  gated on DAILY_CHECK_HEALTHCHECKS_PING_URL
    #
    # All five sit under one `default('')` and one operator action in
    # jg-cluster-template's cluster-secrets template, so an unconfigured cluster
    # was never registered on healthchecks.io either — there is nothing there
    # that could go red. Two defences sharing a premise are one defence.
    #
    # Until 2026-09-19 this branch printed the line below and `exit 0`, so the
    # Job read `Complete 1/1` and the only watcher's ABSENCE looked exactly like
    # a healthy cluster. ferry133/jg-base#112, routed from fleet-ops#13: jg-jcc1
    # ran from creation to discovery with zero successful off-site backups while
    # three layers stayed quiet, and this was the outermost of them.
    #
    # The Job's exit status is the one channel that needs no cluster.yaml value
    # and no extra RBAC, so it now carries this and only this: did the run get
    # its result to somewhere a person can see. Row-level failures still never
    # touch it — they go in the email, and FAIL_COUNT alone gates the dead-man
    # (#6: a check that fires on every run gets switched off). What separates
    # this red from #6's is whether action can clear it: #6's flew over a
    # CORRECTLY configured cluster and no action could clear it, so it was
    # silenced; this one is cleared by filling in four fields. The same yardstick
    # is written out at the ENDPOINTS_TO_PROBE warning further down.
    #
    # 78 is sysexits.h EX_CONFIG: it keeps "unconfigured" distinguishable from a
    # crash under `set -u` without anyone having to read the log.
    if [[ -z "${SMTP_USERNAME:-}" || -z "${SMTP_PASSWORD:-}" || -z "${SMTP_FROM:-}" || -z "${NOTIFY_EMAIL_TO:-}" ]]; then
      echo "daily-check is not configured for cluster ${CLUSTER_NAME}: set" \
           "daily_check_smtp_username / _password / _from / _notify_email_to" \
           "in cluster.yaml, then re-run task configure. This Job fails on" \
           "purpose: an unconfigured cluster must not read as a healthy one." >&2
      exit 78
    fi
    NAS_SERVER="${NAS_SERVER:-}"
    HEALTHCHECKS_PING_URL="${HEALTHCHECKS_PING_URL:-}"
    ENDPOINTS_TO_PROBE="${ENDPOINTS_TO_PROBE:-}"

    echo "==> Installing tools"
    # aws-cli is for check 21 only (reading the backup destination back).
    # Proven on this image: base/monitoring/backup installs the same package
    # on the same alpine:3.20 and uploads with it every night.
    apk add --no-cache --quiet bash curl jq msmtp ca-certificates bind-tools openssl coreutils aws-cli >/dev/null
    K8S_VERSION=$(curl -fsSL https://dl.k8s.io/release/stable.txt)
    curl -fsSL "https://dl.k8s.io/release/${K8S_VERSION}/bin/linux/amd64/kubectl" -o /usr/local/bin/kubectl
    chmod +x /usr/local/bin/kubectl

    echo "==> Configuring msmtp"
    mkdir -p /tmp/msmtp
    sed \
      -e "s|__SMTP_HOST__|${SMTP_HOST}|g" \
      -e "s|__SMTP_PORT__|${SMTP_PORT}|g" \
      -e "s|__SMTP_FROM__|${SMTP_FROM}|g" \
      -e "s|__SMTP_USERNAME__|${SMTP_USERNAME}|g" \
      -e "s|__SMTP_PASSWORD__|${SMTP_PASSWORD}|g" \
      /scripts/msmtprc.template > /tmp/msmtp/msmtprc
    chmod 600 /tmp/msmtp/msmtprc

    echo "==> Running checks"
    DATE_LOCAL=$(TZ=Asia/Taipei date '+%Y-%m-%d %H:%M %Z')
    declare -a SUMMARY=()
    declare -a DETAILS=()
    FAIL_COUNT=0
    WARN_COUNT=0
    SKIP_COUNT=0
    # Whether the report reached a human. Deliberately NOT part of FAIL_COUNT:
    # FAIL_COUNT says "this cluster is unhealthy" and gates the dead-man, while
    # this says "you did not get told". Folding one into the other leaves
    # neither answerable — a silent mailer would read as a sick cluster, and a
    # sick cluster whose mail worked would be indistinguishable from it (#114).
    MAIL_DELIVERED=0

    # Three outcomes, not two. `skip` is "this check could not be evaluated
    # here" — a gate is unset, a tool is missing, the question does not apply to
    # this cluster. With only pass/fail, that state has nowhere to go but
    # silence, and a check that emitted no row reads exactly like one that
    # passed. It carries no alarm and gates nothing; it is only there so the
    # reader can see the difference between seventeen checks passing and
    # sixteen passing while one never ran.
    record() {
      local level="$1" name="$2" msg="${3:-}"
      case "$level" in
        ok)   SUMMARY+=("✅ ${name}${msg:+ — ${msg}}") ;;
        warn) SUMMARY+=("⚠️ ${name} — ${msg}"); DETAILS+=("[WARN] ${name}: ${msg}"); ((WARN_COUNT++)) ;;
        fail) SUMMARY+=("❌ ${name} — ${msg}"); DETAILS+=("[FAIL] ${name}: ${msg}"); ((FAIL_COUNT++)) ;;
        skip) SUMMARY+=("➖ ${name} — ${msg}"); DETAILS+=("[SKIP] ${name}: ${msg}"); ((SKIP_COUNT++)) ;;
      esac
    }

    # RFC3339 (what the API server returns) to epoch seconds. Prints nothing if
    # it cannot parse, and callers must treat that as "unknown" rather than
    # substituting a number.
    #
    # This is not fixing a live defect: the install step above adds coreutils,
    # so `date` here is GNU and `-d "<RFC3339>"` parses. It removes a way to
    # fail badly rather than a failure. The previous spelling ended `|| echo 0`,
    # which turns an unparseable timestamp into the epoch — 1970, i.e. an age of
    # roughly half a million hours, i.e. a confident FAIL and a withheld
    # dead-man ping, in response to not knowing.
    #
    # The busybox fallback is cheap insurance, not decoration: the sibling job
    # in this same directory runs on alpine WITHOUT coreutils, and a GNU date
    # spelling there is exactly what silently deleted its own backups until
    # 6403b5c. Measured in that image: `-d "<RFC3339>"` is refused outright,
    # while the explicit strptime form `-D` works. GNU has no -D, so GNU is
    # tried first.
    epoch_of() {
      date -u -d "$1" +%s 2>/dev/null \
        || date -u -D "%Y-%m-%dT%H:%M:%SZ" -d "$1" +%s 2>/dev/null \
        || true
    }

    # 0. Purge ghost pods — terminal-phase (Succeeded/Failed) pods owned by a
    # replica controller (ReplicaSet/DaemonSet/StatefulSet). These are leftovers
    # from node disruption/eviction that the controller has already replaced;
    # they cause false FAILs (e.g. a "Completed" cloudflare-tunnel pod) and clutter.
    # Job/CronJob-owned Completed pods are intentionally NOT purged (that is normal
    # job history managed by the Job controller).
    GHOST_PODS=$(kubectl get pods -A -o json 2>/dev/null | jq -r '
      .items[]
      | select(.status.phase=="Failed" or .status.phase=="Succeeded")
      | select(((.metadata.ownerReferences // [])[0].kind // "") as $k
               | $k=="ReplicaSet" or $k=="DaemonSet" or $k=="StatefulSet")
      | "\(.metadata.namespace)/\(.metadata.name)"')
    PURGED=0
    if [[ -n "$GHOST_PODS" ]]; then
      while IFS= read -r np; do
        [[ -z "$np" ]] && continue
        kubectl delete pod -n "${np%%/*}" "${np#*/}" --grace-period=0 >/dev/null 2>&1 && PURGED=$((PURGED+1))
      done <<< "$GHOST_PODS"
    fi
    [[ "$PURGED" -gt 0 ]] && record ok "Purged ${PURGED} ghost pod(s)" || record ok "No ghost pods"

    # 1. Nodes Ready
    NOT_READY=$(kubectl get nodes --no-headers 2>&1 | awk '$2 != "Ready" {print $1}')
    if [[ -z "$NOT_READY" ]]; then
      record ok "Nodes Ready"
    else
      record fail "Nodes Ready" "Not Ready: $(echo "$NOT_READY" | tr '\n' ' ')"
    fi

    # Lists one Flux kind cluster-wide into FLUX_JSON for rows 2 and 15, or
    # says in FLUX_WHY why that list cannot be read as this cluster's (#215).
    # Three ways to fail, and each used to render as "all Ready":
    #   - kubectl exits non-zero (RBAC, API error): stdout is empty;
    #   - it exits 0 but the output is not an object with an `.items` array;
    #   - the list lacks flux-system/flux-system. FluxInstance creates that
    #     Kustomization and GitRepository on every cluster (measured on
    #     jg-jiahd and jcom 2026-10-25, both Ready), so a list without it is
    #     not this cluster's list, whatever else is in it. An empty list is
    #     the commonest case of this.
    # The level is warn, as in row 6's "could not list CronJobs": skip would
    # say "does not apply here", and fail would page about the watcher rather
    # than the cluster.
    flux_list() {
      local err rc=0
      FLUX_WHY=""
      err=$(mktemp)
      FLUX_JSON=$(kubectl get "$1" -A -o json 2>"$err") || rc=$?
      if (( rc != 0 )); then
        FLUX_WHY="could not list $1 cluster-wide (kubectl rc=$rc: $(head -n1 "$err"))"
      elif ! echo "$FLUX_JSON" | jq -e '.items | type == "array"' >/dev/null 2>&1; then
        FLUX_WHY="kubectl get $1 returned no item list"
      elif ! echo "$FLUX_JSON" | jq -e 'any(.items[]; .metadata.namespace == "flux-system" and .metadata.name == "flux-system")' >/dev/null; then
        FLUX_WHY="the $1 list has no flux-system/flux-system, which every cluster has ($(echo "$FLUX_JSON" | jq '.items | length') items), so it is not this cluster's list"
      fi
      rm -f "$err"
    }

    # The same "could not measure" outcome for nine more rows (#217): 3, 4, 5,
    # 8, 9, 10, 13, 14, 16 each ran `kubectl ... 2>/dev/null`, never read the
    # exit status, and judged only whether the bad list was empty — so a query
    # that failed printed ✅.
    #
    # kget runs `kubectl "$@"` into KGET_OUT; on a non-zero exit KGET_WHY says
    # so, with stderr's first line. kget_items also requires `-o json` output
    # to be an object with an `.items` array. Each row then adds the one thing
    # every cluster is known to have, where there is such a thing — not
    # in flux_list's single helper, because the anchor differs per row and
    # some rows have none (an empty PVC or event list is a real answer).
    kget() {
      local err rc=0
      KGET_WHY=""
      err=$(mktemp)
      KGET_OUT=$(kubectl "$@" 2>"$err") || rc=$?
      if (( rc != 0 )); then
        KGET_WHY="could not run kubectl $* (rc=$rc: $(head -n1 "$err"))"
      fi
      rm -f "$err"
    }
    kget_items() {
      kget "$@"
      if [[ -z "$KGET_WHY" ]] && ! echo "$KGET_OUT" | jq -e '.items | type == "array"' >/dev/null 2>&1; then
        KGET_WHY="kubectl $* returned no item list"
      fi
    }

    # 2. Flux Kustomizations
    #
    # Split by `spec.suspend`, because the two are not the same finding and one
    # of them cannot be fixed by anything this cluster will do on its own.
    #
    # A suspended Kustomization does not reconcile, so whatever Ready it last
    # wrote is frozen there. If it failed and was then suspended, `Ready=False`
    # stays forever and no reconcile will ever clear it — reporting that as a
    # live failure is an alarm that can never go off, which this repo treats as
    # worse than no alarm because it teaches people to skip the row. It is a
    # warning naming a stale status instead.
    #
    # `[]?` still matters: an object that has never reconciled has no
    # conditions, produces zero rows here, and is counted as neither. That is
    # what lets a new Kustomization ship suspended to every cluster (see
    # storage/longhorn/backup-ks.yaml) without turning this check red.
    #
    # Could not measure is its own outcome (#215). This used to read
    # `KS_JSON=$(kubectl ... 2>/dev/null)` and judge only whether the not-Ready
    # list was empty — so a failed query (RBAC lost, API down) produced an
    # empty list and printed the same ✅ as "all Ready". split-extras 5.4 used
    # this row as its gate, and its green could not be taken as a reading.
    # flux_list is shared with row 15, which had the same shape.
    flux_list kustomization
    KS_JSON="$FLUX_JSON"
    BAD_KS=$(echo "$KS_JSON" | \
      jq -r '.items[] | select(.spec.suspend != true) | select(.status.conditions[]? | select(.type=="Ready" and .status!="True")) | "\(.metadata.namespace)/\(.metadata.name)"')
    STALE_KS=$(echo "$KS_JSON" | \
      jq -r '.items[] | select(.spec.suspend == true) | select(.status.conditions[]? | select(.type=="Ready" and .status!="True")) | "\(.metadata.namespace)/\(.metadata.name)"')
    if [[ -n "$FLUX_WHY" ]]; then
      record warn "Flux Kustomizations" "${FLUX_WHY} — this row measured nothing"
    elif [[ -n "$BAD_KS" ]]; then
      record fail "Flux Kustomizations" "Not Ready: $(echo "$BAD_KS" | tr '\n' ' ')"
    elif [[ -n "$STALE_KS" ]]; then
      record warn "Flux Kustomizations" "suspended while not Ready, so this status is frozen and will not clear itself: $(echo "$STALE_KS" | tr '\n' ' ')"
    else
      record ok "Flux Kustomizations all Ready"
    fi

    # 3. HelmReleases
    # flux-system/flux-instance is a base HelmRelease (measured on jg-jiahd and
    # jcom 2026-10-25), so a list without it is not this cluster's (#217).
    kget_items get hr -A -o json
    if [[ -z "$KGET_WHY" ]] && ! echo "$KGET_OUT" | jq -e 'any(.items[]; .metadata.namespace == "flux-system" and .metadata.name == "flux-instance")' >/dev/null; then
      KGET_WHY="the HelmRelease list has no flux-system/flux-instance, which every cluster has, so it is not this cluster's list"
    fi
    BAD_HR=$(echo "$KGET_OUT" | \
      jq -r '.items[]? | select(.status.conditions[]? | select(.type=="Ready" and .status!="True")) | "\(.metadata.namespace)/\(.metadata.name)"' 2>/dev/null)
    if [[ -n "$KGET_WHY" ]]; then
      record warn "HelmReleases" "${KGET_WHY} — this row measured nothing"
    elif [[ -z "$BAD_HR" ]]; then
      record ok "HelmReleases all Ready"
    else
      record fail "HelmReleases" "Not Ready: $(echo "$BAD_HR" | tr '\n' ' ')"
    fi

    # 4. Pod restarts (>5 in last 24h) and abnormal pods
    # Every cluster runs pods in kube-system (#217).
    kget get pods -A --no-headers
    if [[ -z "$KGET_WHY" ]] && ! awk '$1 == "kube-system" {found=1} END {exit !found}' <<<"$KGET_OUT"; then
      KGET_WHY="the pod list has no pod in kube-system, which every cluster has, so it is not this cluster's list"
    fi
    ABNORMAL_PODS=$(printf '%s' "$KGET_OUT" | \
      awk '$4 != "Running" && $4 != "Completed" && $4 != "Succeeded" {print $1"/"$2" ("$4")"}' | head -20)
    if [[ -n "$KGET_WHY" ]]; then
      record warn "Pods" "${KGET_WHY} — this row measured nothing"
    elif [[ -z "$ABNORMAL_PODS" ]]; then
      record ok "Pods all healthy"
    else
      record fail "Pods abnormal" "$(echo "$ABNORMAL_PODS" | head -10 | tr '\n' '; ')"
    fi

    # Pods that restarted within the last 24h (recency-based, NOT lifetime total).
    # k8s only exposes cumulative .restartCount, so a long-lived-but-stable pod would
    # trip a ">N lifetime" check forever. Gate on the most recent restart time
    # (lastState.terminated.finishedAt) so this reflects *current* instability.
    kget_items get pods -A -o json
    if [[ -z "$KGET_WHY" ]] && ! echo "$KGET_OUT" | jq -e 'any(.items[]; .metadata.namespace == "kube-system")' >/dev/null; then
      KGET_WHY="the pod list has no pod in kube-system, which every cluster has, so it is not this cluster's list"
    fi
    RECENT_RESTART=$(echo "$KGET_OUT" | jq -r '
      .items[] |
      select(.status.containerStatuses != null) |
      . as $p |
      ($p.status.containerStatuses | map(.restartCount) | add) as $total |
      ([ $p.status.containerStatuses[] | .lastState.terminated.finishedAt // empty ]
        | map(fromdateiso8601) | max // 0) as $last |
      select($total > 0 and $last > (now - 86400)) |
      "\($p.metadata.namespace)/\($p.metadata.name): \($total) total, last \(((now - $last)/3600)|floor)h ago"' 2>/dev/null | head -10)
    if [[ -n "$KGET_WHY" ]]; then
      record warn "Pod restarts" "${KGET_WHY} — this row measured nothing"
    elif [[ -z "$RECENT_RESTART" ]]; then
      record ok "No pods restarted in last 24h"
    else
      record warn "Pods restarted in last 24h" "$(echo "$RECENT_RESTART" | tr '\n' '; ')"
    fi

    # 5. PVCs all Bound
    # Exit status only: a cluster with no PVC at all is a real answer (#217).
    # The text rows feed awk with `printf '%s'`, not echo: echo of an empty
    # string is one empty line, which awk reads as a PVC that is not Bound.
    kget get pvc -A --no-headers
    BAD_PVC=$(printf '%s' "$KGET_OUT" | awk '$3 != "Bound" {print $1"/"$2" ("$3")"}')
    if [[ -n "$KGET_WHY" ]]; then
      record warn "PVCs" "${KGET_WHY} — this row measured nothing"
    elif [[ -z "$BAD_PVC" ]]; then
      record ok "PVCs all Bound"
    else
      record fail "PVCs" "$(echo "$BAD_PVC" | tr '\n' '; ')"
    fi

    # 6. Backup CronJobs — every namespace, enumerated from the cluster.
    #
    # This row read `kubectl -n db get cronjob postgres-backup` until #83 — both
    # the namespace and the name were pinned. #73 moved the claudecode postgres
    # into base, where its backup CronJob is in namespace `claudecode`, and
    # freepbx's `mariadb-backup` has been in `freepbx` all along.
    #
    # What that cost was measured on the three live clusters, and it is worse
    # than a gap in coverage. jg-jiahd runs TWO CronJobs called
    # `postgres-backup`: `db/` (healthy) and `claudecode/` (never completed
    # once, for over two months). The pinned lookup found `db/` and printed
    # "Postgres backup ✅" every morning — a true sentence about `db` and a
    # false impression of the cluster. jcom and jg-janncotcc, having no `db`
    # copy, got the honest `skip`. So the one cluster that was broken is the
    # one that got a green tick, because two objects shared a name and the
    # lookup picked the good one.
    #
    # A guard that raises a flag on correct input is worse than no guard; this
    # is its mirror — a green flag on the wrong object. The check never broke.
    # It stopped pointing at the thing, and "pointing elsewhere" renders exactly
    # like "pointing here and it is fine".
    #
    # So the row reports `namespace/name` per CronJob and not one verdict:
    # "something failed" and "which one failed" are different questions at
    # 08:00, and pinning a different namespace would only move the mine.
    #
    # Enumerated, not listed: a fixture of names written here would miss
    # precisely the backup nobody remembered to add to it — so the subject is
    # whatever the cluster actually runs. offsite-backup is excluded because
    # check 19 measures it with logic this row has not got, and two rows for
    # one job would make the report look wider than it is.
    #
    # `.status.lastSuccessfulTime` and not the last Job's conditions: it is
    # directly the question being asked, and it sidesteps the k8s 1.33
    # SuccessCriteriaMet ordering that the old spelling had to work around.
    BACKUP_CJ_JSON=$(kubectl get cronjob -A -o json 2>/dev/null || true)
    if [[ -z "$BACKUP_CJ_JSON" ]]; then
      # Could not measure — distinct from "there are none". RBAC loss or an API
      # error would otherwise produce an empty list, i.e. the skip branch, i.e.
      # a calm-looking report about a cluster nobody looked at.
      record warn "Backup CronJobs" "could not list CronJobs cluster-wide (RBAC or API error) — this row measured nothing"
    else
      BACKUP_CJ=$(echo "$BACKUP_CJ_JSON" | jq -r '
        [.items[]
         | select((.metadata.labels["app.kubernetes.io/component"] == "backup")
                  or (.metadata.name | endswith("-backup")))
         | select(.metadata.name | startswith("offsite-backup") | not)]
        | sort_by(.metadata.namespace + "/" + .metadata.name)
        | .[]
        | "\(.metadata.namespace)\t\(.metadata.name)\t\(.spec.suspend // false)\t\(if .metadata.labels["app.kubernetes.io/component"] == "backup" then "label" else "name" end)\t\(.status.lastSuccessfulTime // "")"')
      if [[ -z "$BACKUP_CJ" ]]; then
        record skip "Backup CronJobs" "no backup CronJob is deployed on this cluster, so this row measured nothing — it is not a statement that the data is unprotected, nor that it is protected (off-site backup is a separate row)"
      else
        BACKUP_CJ_N=$(echo "$BACKUP_CJ" | wc -l | tr -d " ")
        BACKUP_BY_NAME=""
        # lastSuccessfulTime is LAST on purpose: tab is an IFS whitespace
        # character, so `read` collapses runs of it. An empty field anywhere
        # but the end silently shifts every field after it -- putting `how`
        # after it made B_LAST read "name" and the row reported "cannot parse
        # last success time (name)" instead of "has never completed". Caught by
        # check-backup-cronjob-row.sh on the first run, which is what it is for.
        while IFS=$'\t' read -r B_NS B_NAME B_SUSP B_HOW B_LAST; do
          [[ -z "$B_NAME" ]] && continue
          [[ "$B_HOW" == "name" ]] && BACKUP_BY_NAME+=" ${B_NS}/${B_NAME}"
          B_ID="Backup ${B_NS}/${B_NAME}"
          if [[ "$B_SUSP" == "true" ]]; then
            # Measured, so not skip: the CronJob is here and is deliberately not
            # running. warn, because from the data's point of view "suspended"
            # and "backing up nightly" are the same picture.
            record warn "$B_ID" "CronJob is suspended — no new backups are being taken"
          elif [[ -z "$B_LAST" ]]; then
            # jg-jiahd's exact state (#82): the CronJob exists, the schedule
            # fires, and nothing has ever completed. concurrencyPolicy: Forbid
            # means one stuck pod also silently skips every later run.
            record fail "$B_ID" "has never completed successfully (status.lastSuccessfulTime is unset)"
          else
            B_EPOCH="$(epoch_of "$B_LAST")"
            if [[ -z "$B_EPOCH" ]]; then
              record warn "$B_ID" "cannot parse last success time (${B_LAST})"
            else
              B_AGE_H=$(( ( $(date -u +%s) - B_EPOCH ) / 3600 ))
              # Same thresholds as check 19: every backup this repo ships is
              # daily, so >26h is late and >48h has missed two.
              if (( B_AGE_H > 48 )); then
                record fail "${B_ID} stale" "last success ${B_AGE_H}h ago (${B_LAST})"
              elif (( B_AGE_H > 26 )); then
                record warn "${B_ID} late" "last success ${B_AGE_H}h ago"
              else
                record ok "${B_ID} (last success ${B_AGE_H}h ago)"
              fi
            fi
          fi
        done <<< "$BACKUP_CJ"
        # Coverage, stated as a number, and the number is the signal: when an
        # app moves namespace or is dropped, the count changes and the change is
        # visible. A report that lists rows without saying how many it looked
        # for cannot show a coverage drop — which is #83.
        #
        # The ones matched only by NAME are named, not just counted (#85). The
        # subject is a union: the declared label, or a `*-backup` name. The
        # label is the contract for anything this repo ships; the name is what
        # catches a CronJob a controller generated for us — Longhorn's
        # `daily-backup` is the live case, and it cannot be labelled from here
        # because RecurringJob.spec.labels labels the snapshots, not the
        # CronJob it creates.
        #
        # So a name in this list is normal for the controller-generated ones,
        # and is a to-do for anything else: it means a backup this repo ships
        # reached a cluster without the label. Naming them is what makes that
        # difference visible; a count alone cannot, because the
        # controller-generated one keeps it permanently non-zero.
        if [[ -n "$BACKUP_BY_NAME" ]]; then
          record ok "Backup CronJobs measured: ${BACKUP_CJ_N} (by name only:${BACKUP_BY_NAME})"
        else
          record ok "Backup CronJobs measured: ${BACKUP_CJ_N} (all labelled)"
        fi
      fi
    fi

    # 7. Postgres pod
    if kubectl -n db get deploy postgres >/dev/null 2>&1; then
      PG_READY=$(kubectl -n db get deploy postgres -o jsonpath='{.status.readyReplicas}' 2>/dev/null)
      if [[ "$PG_READY" == "1" ]]; then
        record ok "Postgres pod Ready"
      else
        record fail "Postgres pod" "ReadyReplicas=${PG_READY:-0}"
      fi
    fi

    # 8. TLS certificates nearing expiry (14 days)
    # Exit status and list shape only: no one certificate name is fleet-wide (#217).
    kget_items get certificate -A -o json
    CERT_ISSUES=$(echo "$KGET_OUT" | jq -r '
      .items[] |
      select(.status.notAfter != null) |
      .status.notAfter as $exp |
      ($exp | fromdate) as $expEpoch |
      (now + (14 * 86400)) as $threshold |
      select($expEpoch < $threshold) |
      "\(.metadata.namespace)/\(.metadata.name) expires \($exp)"' 2>/dev/null)
    if [[ -n "$KGET_WHY" ]]; then
      record warn "TLS certificates" "${KGET_WHY} — this row measured nothing"
    elif [[ -z "$CERT_ISSUES" ]]; then
      record ok "TLS certificates (>14d remaining)"
    else
      record warn "TLS certificates nearing expiry" "$(echo "$CERT_ISSUES" | tr '\n' '; ')"
    fi

    # 9. Warning events in last 1h (limited window since events default TTL is 1h)
    # Exit status only: zero Warning events is a real answer (#217). Counted
    # with grep -c, not wc -l: an empty output is one empty line to wc.
    kget get events -A --field-selector type=Warning --no-headers
    WARN_EVENTS=$(grep -c . <<<"$KGET_OUT")
    if [[ -n "$KGET_WHY" ]]; then
      record warn "Warning events" "${KGET_WHY} — this row measured nothing"
    elif [[ "$WARN_EVENTS" -le 20 ]]; then
      record ok "Warning events in last hour: ${WARN_EVENTS}"
    else
      TOP_WARNS=$(printf '%s' "$KGET_OUT" | \
        awk '{print $4}' | sort | uniq -c | sort -rn | head -5 | tr '\n' '; ')
      record warn "Warning events spiked (${WARN_EVENTS})" "Top reasons: ${TOP_WARNS}"
    fi

    # 10. Cloudflare tunnel pods
    # cloudflare-tunnel is a base app, so at least one pod carries the label
    # (one each on jg-jiahd and jcom, 2026-10-25). Zero is not "all Running":
    # it is the label or the app gone, and this row pointing at nothing (#217).
    kget get pod -A -l app.kubernetes.io/name=cloudflare-tunnel --no-headers
    if [[ -z "$KGET_WHY" && -z "$KGET_OUT" ]]; then
      KGET_WHY="no pod carries app.kubernetes.io/name=cloudflare-tunnel, and every cluster runs the tunnel"
    fi
    TUNNEL_BAD=$(printf '%s' "$KGET_OUT" | \
      awk '$4 != "Running" {print $1"/"$2" ("$4")"}')
    if [[ -n "$KGET_WHY" ]]; then
      record warn "Cloudflare tunnel pods" "${KGET_WHY} — this row measured nothing"
    elif [[ -z "$TUNNEL_BAD" ]]; then
      record ok "Cloudflare tunnel pods Running"
    else
      record fail "Cloudflare tunnel pods" "$(echo "$TUNNEL_BAD" | tr '\n' '; ')"
    fi

    # 11. External endpoint reachability (ferry133/jg-base#43).
    #
    # This check used to `curl "$url"` straight from the pod, and on every
    # cluster here that measures the wrong thing. k8s-gateway serves split DNS,
    # so an external name resolves to the LAN address of envoy-internal and the
    # probe reaches the internal gateway. Measured 2026-08-28 on an appliance
    # cluster: this row was `✅ External endpoints OK`, FAIL_COUNT=0, while an
    # off-site vantage got FAILED / HTTP 000 for the same names — that zone had
    # no public A record at all. **Not reachable from anywhere outside, and
    # this check was green.**
    #
    # It also stayed green after the zone was fixed, so its two states are
    # indistinguishable: it has never carried information about the thing its
    # name claims.
    #
    # The fix is to resolve the name the way the outside world does and then
    # force the connection to that address:
    #
    #   1. Resolve over DoH. **HTTPS on 443, not UDP/53** — a LAN router that
    #      transparently redirects all outbound :53 makes `dig @1.1.1.1` answer
    #      from the router while looking like a public query, which is the trap
    #      the factory README documents and the one #43 hit on a workstation.
    #      Naming a public resolver is not the same as reaching one.
    #   2. `curl --resolve host:443:<public-ip>`, which bypasses the pod
    #      resolver entirely, so the request follows public DNS → Cloudflare
    #      edge → tunnel rather than the LAN shortcut.
    #
    # THREE outcomes, not two, because "I could not measure this" is a distinct
    # answer and a two-outcome check files it under `ok`:
    #
    #   fail  - resolves nowhere publicly, or the public path answers non-2xx/3xx
    #   skip  - no public resolver reachable, or the public record is RFC1918
    #   ok    - a public address answered
    #
    # NXDOMAIN is confirmed against a SECOND resolver before it counts as a
    # failure: one resolver having a bad moment must not mark a healthy cluster
    # down. An address from either is enough to proceed.
    #
    # Honest boundary: this still runs inside the cluster, so it proves the
    # public name and the edge answer, not that an arbitrary internet client
    # gets through. It is strictly more than before — it can now be red — but a
    # true outside vantage is still the only thing that measures the whole path.
    #
    # ⚠️ ENDPOINTS_TO_PROBE is by definition a list of names that MUST be
    # reachable from OUTSIDE. An internal-only name belongs in no part of it:
    # `echo-int.<domain>` is published on envoy-internal and correctly has no
    # public A record, so this check would call a correctly configured cluster
    # broken every morning. That is the mirror of the defect this rewrite fixes
    # — not a false green but a **false red**, and a false red gets silenced,
    # after which it reads exactly like coverage.
    #
    # The list is the declaration of intent, because nothing here can derive it.
    # It is narrower than "external names", and the extra clause was learned the
    # first time the rule was actually applied (fleet-ops, 2026-08-29, filling
    # daily_check_endpoints on jg-jiahd and jcom): a name whose workload is
    # scaled to zero answers HTTP 503 while being completely valid at the DNS
    # layer — public A record, Cloudflare-proxied, indistinguishable from a
    # healthy one until the probe runs. `cc.jiahd.cc` and `cc.janncot.com` were
    # both in that state. Following "external names only" mechanically would
    # have put a permanent red on two correctly configured clusters.
    #
    # So the list means: reachable from outside AND expected to be serving.
    # That second half is intent again and equally underivable — a 503 from a
    # deliberately idled workload and a 503 from a crashed one are the same
    # response.
    # "Is this endpoint supposed to be reachable from outside" is not a property
    # of the name or of DNS. Both sides were measured on 2026-08-28, and they
    # are the same observation:
    #
    #   im.janncot.cc      during the outage (SHOULD be external)
    #                        -> no public A record, resolves inside the cluster
    #   echo-int.janncot.cc deliberately internal
    #                        -> no public A record, resolves inside the cluster
    #
    # So anything keying on the name or on DNS is guessing intent. The two wrong
    # guesses do not cost the same: guessing "internal, so skip" turns a real
    # outage silent, guessing "external, so fail" is merely noisy. **When it is
    # genuinely unclear whether to alarm, alarming is the safe side** — the
    # inverse of the rule check 18 follows, and not in tension with it, because
    # there the level was asserting something the probe could not support.
    #
    # Considered and not taken: reading the HTTPRoute's parentRef to see which
    # gateway serves the hostname. Not because it costs a cluster query —
    # that reason falls over the moment someone points out operators mistype
    # lists, which they do. It is not taken because **it answers a different
    # question**:
    #
    #   "is this external endpoint reachable from outside?"   <- this check
    #   "does the endpoint list agree with the routing?"      <- parentRef
    #
    # The second is worth checking on its own (a list naming echo-int while its
    # HTTPRoute sits on envoy-internal is a real contradiction). Folded in here,
    # a red row would no longer say which of the two failed — which is exactly
    # the mistake #43's own acceptance condition made by combining "can the
    # logic go red" with "does it behave in a real container". If parentRef is
    # ever done it is a NEW check, not an upgrade of this one.
    #
    # The failure message carries the operator-facing half of this, because the
    # person who hits it is reading the report, not this comment. It gives BOTH
    # readings and says the check cannot separate them — malignant first (the
    # record is gone, i.e. an outage) and benign second (the name is internal
    # and should not be in the list).
    #
    # Writing only the benign one, which an earlier version did, hands a
    # reassuring sentence to whoever is looking at a real outage. Narrowing it
    # instead — only hint "internal-only" when the name NEVER had a public
    # record — was considered and is not possible: that needs history, and each
    # run is stateless. A single run sees "no public A record now" and cannot
    # separate "never had one" from "had one until an hour ago". That is the
    # same indistinguishability as the intent question above, moved onto the
    # time axis.
    #
    # So the message states its own limit rather than picking a side. Narrowing
    # would have made it silent in one of the two cases, and silence is the
    # thing this whole rewrite exists to remove.
    #
    # ⚠️ STATE OF VERIFICATION, 2026-08-28 (fleet-ops session, on jg-janncotcc,
    # against the deployed ConfigMap):
    #
    #   ok    exercised -- "External endpoints reachable via public DNS"
    #   fail  exercised -- an internal-only name in the list produced the row
    #         above and FAIL_COUNT=1, by overriding ENDPOINTS_TO_PROBE only,
    #         with no change to cluster configuration
    #   skip  NOT exercised
    #
    # The skip branch is the one that most needed it and the one that could not
    # be reached: forcing it means blocking BOTH DoH providers from the pod,
    # which is deliberate damage to a live cluster. It is left explicitly
    # unverified rather than presumed from the other two passing -- if it is
    # broken, its symptom is reading "could not measure" as something else,
    # which is the subject of #43 rather than an unrelated risk.
    if [[ -n "$ENDPOINTS_TO_PROBE" ]]; then
      ENDPOINT_FAILS=()
      ENDPOINT_UNMEASURED=()
      for url in $ENDPOINTS_TO_PROBE; do
        ep_host="${url#*://}"; ep_host="${ep_host%%/*}"; ep_host="${ep_host%%:*}"
        PUB_IP=""; DOH_REACHED=0
        for doh in "https://cloudflare-dns.com/dns-query" "https://dns.google/resolve"; do
          doh_ans=$(curl -fsS -m 10 -H 'accept: application/dns-json' "${doh}?name=${ep_host}&type=A" 2>/dev/null) || continue
          DOH_REACHED=1
          PUB_IP=$(echo "$doh_ans" | jq -r '[(.Answer // [])[] | select(.type == 1) | .data] | first // empty' 2>/dev/null)
          [[ -n "$PUB_IP" ]] && break
        done
        if [[ $DOH_REACHED -eq 0 ]]; then
          ENDPOINT_UNMEASURED+=("${ep_host}=no public resolver reachable")
          continue
        fi
        if [[ -z "$PUB_IP" ]]; then
          ENDPOINT_FAILS+=("${ep_host}=no public DNS record — either the record is gone (an outage: this name was reachable before) or this name is internal-only and does not belong in DAILY_CHECK_ENDPOINTS. This check cannot tell which; look at the zone")
          continue
        fi
        if [[ "$PUB_IP" =~ ^(10\.|172\.(1[6-9]|2[0-9]|3[01])\.|192\.168\.) ]]; then
          ENDPOINT_UNMEASURED+=("${ep_host}=public record is private (${PUB_IP}), unreachable from outside by design")
          continue
        fi
        code=$(curl -ksI -o /dev/null -w '%{http_code}' --max-time 10 --resolve "${ep_host}:443:${PUB_IP}" "$url" || echo "000")
        if [[ "$code" =~ ^(2|3) ]]; then
          : # reachable over the public path
        else
          ENDPOINT_FAILS+=("$url=$code via ${PUB_IP}")
        fi
      done
      if [[ ${#ENDPOINT_FAILS[@]} -gt 0 ]]; then
        record fail "External endpoints unreachable from outside" "$(printf '%s; ' "${ENDPOINT_FAILS[@]}")"
      elif [[ ${#ENDPOINT_UNMEASURED[@]} -gt 0 ]]; then
        record skip "External endpoints" "$(printf '%s; ' "${ENDPOINT_UNMEASURED[@]}")this row cannot claim external reachability, and saying so is not the same as saying it is fine"
      else
        record ok "External endpoints reachable via public DNS"
      fi
    fi

    # 12. NAS connectivity (ICMP via in-cluster shell — only check DNS resolution since ICMP often blocked)
    if [[ -n "$NAS_SERVER" ]]; then
      if curl -ksS --connect-timeout 5 "https://${NAS_SERVER}:5001/" -o /dev/null 2>&1 || \
         nc -zw5 "$NAS_SERVER" 2049 2>/dev/null; then
        record ok "NAS ${NAS_SERVER} reachable"
      else
        record fail "NAS ${NAS_SERVER}" "Not reachable on port 2049/5001"
      fi
    fi

    # 13. Node resource usage
    if kubectl top nodes >/dev/null 2>&1; then
      kget top nodes --no-headers
      NODE_PRESSURE=$(printf '%s' "$KGET_OUT" | \
        awk '{
          cpu = $3+0; mem = $5+0;
          if (cpu > 80) printf "%s CPU=%s%% ", $1, $3;
          if (mem > 85) printf "%s MEM=%s%% ", $1, $5;
        }')
      if [[ -n "$KGET_WHY" || -z "$KGET_OUT" ]]; then
        record warn "Node resource pressure" "${KGET_WHY:-kubectl top nodes printed no node} — this row measured nothing"
      elif [[ -z "$NODE_PRESSURE" ]]; then
        record ok "Node resource pressure normal"
      else
        record warn "Node resource pressure" "$NODE_PRESSURE"
      fi
    else
      # This used to emit no row at all, which reads exactly like a row that
      # passed (#217). No metrics API is a cluster without metrics-server, not
      # an unhealthy one, so skip and not warn.
      record skip "Node resource pressure" "the metrics API did not answer kubectl top nodes, so CPU and memory were not read"
    fi

    # 14. Node disk pressure (via Conditions)
    # A cluster has at least one node; an empty list is not this cluster's (#217).
    kget_items get nodes -o json
    if [[ -z "$KGET_WHY" ]] && ! echo "$KGET_OUT" | jq -e '.items | length > 0' >/dev/null; then
      KGET_WHY="the node list is empty"
    fi
    DISK_PRESSURE=$(echo "$KGET_OUT" | jq -r '
      .items[] | .metadata.name as $n |
      .status.conditions[] | select(.type=="DiskPressure" and .status=="True") | $n' 2>/dev/null)
    if [[ -n "$KGET_WHY" ]]; then
      record warn "Node disk pressure" "${KGET_WHY} — this row measured nothing"
    elif [[ -z "$DISK_PRESSURE" ]]; then
      record ok "Node disk pressure clear"
    else
      record fail "Node DiskPressure" "$(echo "$DISK_PRESSURE" | tr '\n' ' ')"
    fi

    # 15. GitRepository sources
    # The same empty-list-reads-as-ok shape as row 2 (#215); see flux_list.
    flux_list gitrepository
    BAD_GIT=$(echo "$FLUX_JSON" | \
      jq -r '.items[]? | select(.status.conditions[]? | select(.type=="Ready" and .status!="True")) | "\(.metadata.namespace)/\(.metadata.name)"')
    if [[ -n "$FLUX_WHY" ]]; then
      record warn "Flux GitRepository sources" "${FLUX_WHY} — this row measured nothing"
    elif [[ -z "$BAD_GIT" ]]; then
      record ok "Flux GitRepository sources Ready"
    else
      record fail "Flux GitRepository sources" "$(echo "$BAD_GIT" | tr '\n' ' ')"
    fi

    # 16. LoadBalancer address assignment.
    #
    # Cilium's own message is misleading here and must not be forwarded as-is.
    # A port collision on a shared address reports reason=out_of_ips with
    # "pools ... ran out of allocatable IPs", which sends the reader looking for
    # a pool that is too small when the real cause is that another Service
    # already claimed that port on that address. Under the single-address LAN
    # design those two causes are indistinguishable from the message alone, so
    # the explanation has to come from here.
    # default/kubernetes exists on every cluster (#217).
    kget_items get svc -A -o json
    if [[ -z "$KGET_WHY" ]] && ! echo "$KGET_OUT" | jq -e 'any(.items[]; .metadata.namespace == "default" and .metadata.name == "kubernetes")' >/dev/null; then
      KGET_WHY="the Service list has no default/kubernetes, which every cluster has, so it is not this cluster's list"
    fi
    UNSATISFIED=$(echo "$KGET_OUT" | jq -r '
      .items[]
      | select(.spec.type=="LoadBalancer")
      | select(.status.conditions[]? | select(.type=="cilium.io/IPAMRequestSatisfied" and .status!="True"))
      | "\(.metadata.namespace)/\(.metadata.name)=\(
          [.status.conditions[]? | select(.type=="cilium.io/IPAMRequestSatisfied") | .reason][0] // "unknown")"' 2>/dev/null)
    if [[ -n "$KGET_WHY" ]]; then
      record warn "LoadBalancer addresses" "${KGET_WHY} — this row measured nothing"
    elif [[ -z "$UNSATISFIED" ]]; then
      record ok "LoadBalancer addresses assigned"
    else
      HINT=""
      if grep -q "out_of_ips" <<<"$UNSATISFIED"; then
        HINT=" (out_of_ips usually means a port clash on the shared address, not a small pool)"
      fi
      if grep -q "already_allocated_incompatible_service" <<<"$UNSATISFIED"; then
        HINT="${HINT} (incompatible_service usually means a missing lbipam.cilium.io/sharing-cross-namespace)"
      fi
      record fail "LoadBalancer addresses" "$(echo "$UNSATISFIED" | tr '\n' ' ')${HINT}"
    fi

    # 17. Discovered LAN addresses.
    #
    # NOT appliance-only, however much the component reads that way. The probe
    # lives in apps/base/network/, so it ships to every cluster, and suspending
    # its Kustomization does not remove a Deployment already created — measured
    # 2026-08-19: jcom has lan-address-probe running 7d, `lan-address-probe`
    # suspended=true, and a stray `pool-discovered` holding 10.9.8.254 that no
    # Service uses. jg-jiahd has neither. So "declares its addresses" predicts
    # nothing about whether pool-discovered exists, and any check here that
    # assumes an appliance runs on clusters that are not one.
    #
    # Both pools, not just the shared one. lan-address publishes two scoped
    # pools (see kubernetes/apps/base/network/lan-address/README.md), and
    # reading only `pool-discovered` meant a reselection of the envoy-external
    # address was never reported at all — the record existed on an object
    # nothing looked at, which is indistinguishable from no reselection.
    SHARED_POOL_ADDR=""; EXT_POOL_ADDR=""; EXT_POOL_ABSENT=0
    if kubectl get ciliumloadbalancerippool pool-discovered >/dev/null 2>&1; then
      LB_SVC=$(kubectl get svc -A -o json 2>/dev/null)
      svc_holding() {  # every ns/name whose LoadBalancer address is $1
        jq -r --arg ip "$1" '[.items[]
          | select([.status.loadBalancer.ingress[]?.ip] | index($ip))
          | "\(.metadata.namespace)/\(.metadata.name)"] | join(" ")' <<<"$LB_SVC"
      }
      gw_lb_ip() {
        jq -r --arg gw "$1" '[.items[]
          | select(.metadata.labels["gateway.envoyproxy.io/owning-gateway-name"]==$gw)
          | .status.loadBalancer.ingress[0].ip // empty][0] // ""' <<<"$LB_SVC"
      }
      for POOL_SPEC in "pool-discovered:shared address" "pool-discovered-external:envoy-external address"; do
        DISC_POOL="${POOL_SPEC%%:*}"; DISC_WHAT="${POOL_SPEC#*:}"
        DISC=$(kubectl get ciliumloadbalancerippool "$DISC_POOL" -o json 2>/dev/null) || DISC=""
        if [[ -z "$DISC" ]]; then
          # Noted, not reported — 17a decides whether a missing pool matters,
          # because on a cluster whose discovered pool nothing uses it does not.
          # jcom is that cluster and its probe is suspended, so it will never
          # publish the second pool: a warn here would be permanently amber and
          # would assert a mechanism ("on its next pass") that is untrue there.
          # A daily amber row nobody can clear trains the same blindness as a
          # red one nobody reads — see check 18.
          [[ "$DISC_POOL" == "pool-discovered-external" ]] && EXT_POOL_ABSENT=1
          continue
        fi
        DISC_ADDR=$(jq -r '.spec.blocks[0].start // "none"' <<<"$DISC")
        DISC_PREV=$(jq -r '.metadata.annotations["lan-address.jg-base/previous"] // ""' <<<"$DISC")
        DISC_AT=$(jq -r '.metadata.annotations["lan-address.jg-base/reselected-at"] // ""' <<<"$DISC")
        case "$DISC_POOL" in
          pool-discovered)          SHARED_POOL_ADDR="$DISC_ADDR" ;;
          pool-discovered-external) EXT_POOL_ADDR="$DISC_ADDR" ;;
        esac
        if [[ "$DISC_ADDR" == "none" ]]; then
          record warn "LAN ${DISC_WHAT} unallocated" "${DISC_POOL} is empty — the probe found no free address for it, so its consumer stays <pending>"
        elif [[ -n "$DISC_PREV" ]]; then
          # A reselection means a LAN-facing service moved address. Anything
          # that cached the old one — a pinned MQTT broker, a HomeKit pairing —
          # has to be repointed, so this is reported rather than logged quietly.
          record warn "LAN ${DISC_WHAT} reselected" "now ${DISC_ADDR}, was ${DISC_PREV} (at ${DISC_AT}); LAN clients holding the old address need repointing"
        else
          record ok "LAN ${DISC_WHAT} stable (${DISC_ADDR})"
        fi
      done

      # 17a. Is the partition holding — is envoy-external kept off the shared
      # address, and the shared group off envoy-external's?
      #
      # That is the property, and it is worth being exact about why it is
      # phrased this way. The first version of this check asserted that each
      # Service's address EQUALS its pool's address. On an appliance those
      # coincide, so it looked right. On a cluster that declares its addresses
      # AND has a pool-discovered lying around, they are two pools with two
      # purposes and equality was never the contract: measured on jcom,
      # envoy-internal holds 10.9.8.4 and k8s-gateway 10.9.8.3 from the static
      # pool while pool-discovered holds an unused 10.9.8.254 — two mismatches,
      # a daily FAIL, and with it the /fail ping for the other twenty checks.
      # An appliance-only invariant behind a guard that is not appliance-only.
      #
      # The obvious repair — skip Services carrying lbipam.cilium.io/ips — is
      # wrong in the way that matters: an appliance declaring lan_shared_addr
      # back-fills ${CLUSTER_GATEWAY_ADDR}, so envoy-internal and k8s-gateway
      # carry that annotation there too (measured on jgt-appliance). It would
      # switch this check off on exactly the cluster it exists to protect, and a
      # check that has quietly stopped applying reads like one that passed.
      #
      # So: assert the partition, not equality. Both halves stay true whether or
      # not addresses are declared, and only one of them can be false at a time
      # for a benign reason.
      #
      # It still runs only where the discovered pool is actually serving this
      # cluster. A pool nothing draws from has no allocation to check, and
      # saying so beats inventing a verdict about it.
      SHARED_HOLDERS=""
      [[ -n "$SHARED_POOL_ADDR" && "$SHARED_POOL_ADDR" != "none" ]] && \
        SHARED_HOLDERS=$(svc_holding "$SHARED_POOL_ADDR")
      EXT_HOLDERS=""
      [[ -n "$EXT_POOL_ADDR" && "$EXT_POOL_ADDR" != "none" ]] && \
        EXT_HOLDERS=$(svc_holding "$EXT_POOL_ADDR")
      EXT_ACTUAL=$(gw_lb_ip envoy-external)

      if [[ -z "$SHARED_HOLDERS" && -z "$EXT_HOLDERS" ]]; then
        record ok "Discovered LAN pool present but unused" "no Service holds ${SHARED_POOL_ADDR}${EXT_POOL_ADDR:+ or ${EXT_POOL_ADDR}}; this cluster gets its LoadBalancer addresses from the static pool, so there is no discovered allocation to check. If this cluster is not an appliance, the pool and its probe are strays worth removing"
      else
        PART_BAD=""; PART_NOTE=""
        # The #9 failure itself: envoy-external on the shared address evicts
        # envoy-internal, k8s-gateway and mqtt together, and LAN DNS goes down
        # completely rather than partially.
        if [[ -n "$EXT_ACTUAL" && "$EXT_ACTUAL" == "$SHARED_POOL_ADDR" ]]; then
          PART_BAD+="envoy-external holds the shared address ${SHARED_POOL_ADDR}; "
        fi
        # The mirror: nothing but envoy-external may draw from its pool.
        if [[ -n "$EXT_HOLDERS" ]]; then
          for HOLDER in $EXT_HOLDERS; do
            case "$HOLDER" in
              network/envoy-external) ;;
              *) PART_BAD+="${HOLDER} holds envoy-external's address ${EXT_POOL_ADDR}; " ;;
            esac
          done
        fi
        # The external pool exists, nothing drew from it, and envoy-external has
        # no address — the shape a serviceSelector that stopped matching leaves.
        if [[ -n "$EXT_POOL_ADDR" && "$EXT_POOL_ADDR" != "none" && -z "$EXT_HOLDERS" && -z "$EXT_ACTUAL" ]]; then
          PART_NOTE="pool-discovered-external holds ${EXT_POOL_ADDR} and no Service drew from it while envoy-external has no address — check that its serviceSelector still matches"
        elif [[ "$EXT_POOL_ABSENT" == 1 ]]; then
          # Only here: the discovered pool IS serving this cluster, so the
          # second one is genuinely owed and its absence leaves envoy-external
          # unscoped — the pre-#9 state.
          PART_NOTE="pool-discovered is in use but pool-discovered-external does not exist, so envoy-external is drawing from an unscoped pool. Either the probe has not completed a pass since ferry133/jg-base#9 landed, or it is not reconciling — check whether Kustomization lan-address-probe is suspended"
        fi

        if [[ -n "$PART_BAD" ]]; then
          record fail "LAN address partition broken" "${PART_BAD}the serviceSelectors on pool-discovered/pool-discovered-external are not keeping these Services apart — see kubernetes/apps/base/network/lan-address/README.md and ferry133/jg-base#9. If envoy-external holds the shared address, the sharing group is one Service recreation away from losing LAN DNS entirely"
        elif [[ -n "$PART_NOTE" ]]; then
          record warn "LAN address partition not observable" "${PART_NOTE} — this is not a pass, it is a missing measurement"
        elif [[ -z "$EXT_POOL_ADDR" || "$EXT_POOL_ADDR" == "none" ]]; then
          # Say what was actually asserted. With no external pool there is only
          # half a partition to check, and calling that "allocation matches its
          # pools" would claim the half that was never looked at.
          record ok "envoy-external is off the discovered shared address (${SHARED_POOL_ADDR})"
        else
          record ok "LAN address partition holds (shared ${SHARED_POOL_ADDR} → ${SHARED_HOLDERS:-nobody}, external ${EXT_POOL_ADDR} → ${EXT_HOLDERS:-nobody})"
        fi
      fi
    fi

    # 18. Can the LAN still resolve internal names?
    #
    # Can a client on this LAN still resolve internal names?
    #
    # That is the whole question. Every internal hostname resolves to an address
    # on the customer's own LAN, and the path that delivers it — the router's
    # DNS pointed at k8s-gateway (D32) — is an external contract this cluster
    # cannot enforce. A router reset, a replacement unit, or an ISP-pushed
    # config takes every internal name down while every component in here stays
    # green.
    #
    # So ask it the way a client asks it: resolve the name through the node's
    # ordinary resolution path, no @server. Which of the three methods in
    # fleet-ops docs/operations/router-dns.md is in force does not matter,
    # because all three are just routes for the same answer and this asks
    # whether the answer arrives.
    #
    # The two earlier versions both asked a narrower question and paid for it.
    # Asking the router directly (dig @gateway) asked whether the ROUTER
    # resolves, which is
    # only a question under conditional forwarding — under the shipping default
    # the router hands out the cluster's resolver address and is never in the
    # resolution path, so it failed every morning on correctly configured
    # appliances (jg-base 260db56 downgraded it to a warning). Declaring the
    # method in cluster.yaml would have fixed that by storing a second copy of a
    # fact that lives in the router; when the two disagree the check does not go
    # quiet, it makes a confident wrong claim.
    #
    # It does not try to say WHY. An alarm is the deliverable; a human reads
    # fleet-ops docs/operations/router-dns.md and finds out which layer broke.
    #
    # `fleet-ops ` is a repo name, not a directory: the runbooks moved out of
    # the public jg-cluster-template on 2026-08-22 because a tracked file there
    # is copied into every customer repo. ferry133/fleet-ops is private, and
    # jg-cluster-template spells its own `fleet-ops docs/...` pointers the same
    # way on purpose (its README.md says so, and says outright that an operator
    # without access cannot follow them) — one convention, not two. Deliberately
    # no count here: a number in a comment is a measurement that expires, and
    # the one that was here said 25 when `git grep -o "fleet-ops docs/"` on
    # jg-cluster-template origin/main returns 20.
    #
    # ⚠️ Re-review the two message strings below when
    # `daily_check_notify_email_to` first names anyone other than ferry133.
    # Those two live in an EMAIL, unlike jg-cluster-template's, which live in
    # files their reader has checked out. A recipient without fleet-ops
    # access cannot follow them. Measured 2026-08-23 (fleet-ops#1): every
    # configured recipient on jcom, jg-janncotcc and jg-jiahd is ferry133
    # himself, and cluster.sample.yaml ships the field commented out. That is
    # the only reason this is acceptable today.
    #
    # NODE_DNS_PATH gates it because the probe is only valid where the node's
    # resolution path IS the LAN's. With nameservers pinned to a public resolver
    # the node cannot see what a client sees, and Cloudflare will not serve the
    # RFC1918 answer at all (D29) — so the probe could never pass, on a cluster
    # whose LAN is perfectly healthy. Derived in jg-cluster-template from
    # node_dns_servers; never declared by an operator.
    #
    # It is a word and not a boolean, and that is load-bearing (#16). Kustomize
    # does not preserve the quotes around a bare `${VAR}` — measured, and
    # `!!str`, single quotes and block scalars are all normalised away too — so
    # whatever Flux substitutes in is re-typed by the YAML parser. `true` came
    # back as a YAML boolean, `stringData` only accepts strings, and the API
    # server rejected the WHOLE Secret: no daily-check at all, no eighteen
    # checks, no dead-man ping. `lan` and `public` cannot be read as anything
    # but strings. Do not "tidy" them back into true/false, and note that
    # yes/no/on/off are YAML 1.1 booleans as well.
    #
    # Unset is a third outcome, not a quiet pass: a cluster that has not been
    # re-rendered since jg-cluster-template started emitting this cannot say
    # whether its nodes resolve like a LAN client, and "cannot say" must look
    # different from "asked and fine".
    case "${NODE_DNS_PATH:-}" in
      lan)
        if [[ -n "${SECRET_DOMAIN:-}" ]] && command -v dig >/dev/null 2>&1; then
          INTERNAL_NAME="internal.${SECRET_DOMAIN}"
          LAN_ANS=$(dig +short +time=3 +tries=1 "$INTERNAL_NAME" A 2>/dev/null | head -1)
          if [[ "$LAN_ANS" =~ ^(10\.|172\.(1[6-9]|2[0-9]|3[01])\.|192\.168\.) ]]; then
            record ok "LAN resolves internal names (${LAN_ANS})"
          elif [[ -z "$LAN_ANS" ]]; then
            # warn and not fail (ferry133, 2026-08-28, ferry133/jg-base#41):
            # "if cannot get internal.<domain>'s IP, just clear alarm this issue
            # which might be related to DNS setting. Do not alarm the cluster
            # failure."
            #
            # This is the third check in this file to reach that conclusion, and
            # the other two both named THIS one as the counterexample: check 16
            # ("a permanently red row, which is the failure mode check 18
            # already documents") and check 21 ("that is exactly #6: check 18
            # FAILs every day under the shipping DNS default"). Only FAIL_COUNT
            # gates the dead-man ping at the end of this script, so `fail` here
            # pings /fail and healthchecks.io shows the whole cluster Down.
            #
            # The old message already said "the cluster itself may be entirely
            # healthy" while recording `fail`, which pinged /fail and said the
            # opposite. The level, not the prose, is what the dashboard reads.
            #
            # There is also a limit on what this probe can support. INTERNAL_NAME
            # is served by k8s-gateway and only reaches a node if the LAN router
            # forwards ${SECRET_DOMAIN} to it — a router-side provisioning step
            # outside this cluster. An empty answer therefore cannot separate
            # "that step was never done" from "it was done and broke": both are
            # NXDOMAIN, byte for byte. `fail` asserted the second on evidence
            # that cannot distinguish it from the first.
            #
            # Why this became urgent rather than staying theoretical:
            # jg-cluster-template#29 changed node_dns_servers to default to
            # node_default_gateway, which is always private, so NODE_DNS_PATH
            # now derives to `lan` where it used to derive to `public`. #6 was
            # survived by not probing at all; that shelter is gone, and the
            # structural fix was never made. This is it.
            record warn "LAN cannot resolve internal names" "${INTERNAL_NAME} did not resolve through this node's ordinary resolution path, so a client on this LAN cannot reach anything by name either. This is a LAN DNS provisioning fact, not a statement about this cluster — the cluster may be entirely healthy, and it is deliberately not counted as a cluster failure. Start at fleet-ops docs/operations/router-dns.md"
          else
            record warn "LAN resolves internal names to an unexpected address" "${INTERNAL_NAME} resolved to ${LAN_ANS}, which is not an address on this LAN"
          fi
        else
          record skip "LAN resolves internal names" "this cluster's nodes do resolve like a LAN client, but the probe could not run: SECRET_DOMAIN is unset or dig is missing from this image"
        fi
        ;;
      public)
        record skip "LAN resolves internal names" "these nodes resolve through a public resolver, so a node cannot stand in for a LAN client here and the probe would fail on a perfectly healthy LAN — see fleet-ops docs/operations/router-dns.md"
        ;;
      *)
        record skip "LAN resolves internal names" "NODE_DNS_PATH is unset, so it is not known whether this node's resolution path is the LAN's. The cluster has not been re-rendered since jg-cluster-template started emitting it — nothing is known about LAN name resolution here, in either direction"
        ;;
    esac

    # 19. Off-site backup freshness.
    #
    # An appliance is one disk. A backup that silently stopped running is
    # indistinguishable from one that never existed until the day it is needed,
    # so staleness is a FAIL — which withholds the dead-man ping and surfaces it
    # even if the mail itself never arrives.
    LAST_BACKUP=$(kubectl -n monitoring get jobs -o json 2>/dev/null | jq -r '
      [.items[]
       | select(.metadata.name | startswith("offsite-backup"))
       | select(.status.succeeded == 1)
       | .status.completionTime] | sort | last // ""')
    if [[ -n "${BACKUP_R2_BUCKET:-}" ]]; then
      if [[ -z "$LAST_BACKUP" ]]; then
        record fail "Off-site backup" "configured but has never completed successfully"
      else
        BACKUP_EPOCH="$(epoch_of "$LAST_BACKUP")"
        if [[ -z "$BACKUP_EPOCH" ]]; then
          # Unknown age, said as unknown. Guessing in either direction is worse:
          # low invents a healthy backup, high invents an outage.
          record warn "Off-site backup" "cannot parse completion time (${LAST_BACKUP})"
        else
          AGE_H=$(( ( $(date -u +%s) - BACKUP_EPOCH ) / 3600 ))
          if (( AGE_H > 48 )); then
            record fail "Off-site backup stale" "last success ${AGE_H}h ago (${LAST_BACKUP})"
          elif (( AGE_H > 26 )); then
            record warn "Off-site backup late" "last success ${AGE_H}h ago"
          else
            record ok "Off-site backup fresh (${AGE_H}h ago)"
          fi
        fi
      fi
    else
      # warn, not ok. "Not configured" was green on the reasoning that it is a
      # statement about this cluster rather than a fault — a prosumer/full
      # cluster may well have its own backups elsewhere. That reasoning holds
      # and still produces the wrong row: a green tick against a backup line
      # reads as "backups are fine", when what is true is that nothing here is
      # copied off-site and nothing here can see a backup taken by other means.
      # An undiscriminating check that renders identically to a passing one is
      # the thing this report exists to not do.
      #
      # warn and not fail, deliberately: only FAIL_COUNT gates the dead-man ping
      # (see the end of this script), so failing here would cost the /fail
      # signal for every other check on every cluster that backs up by other
      # means — a permanently red row, which is the failure mode check 18
      # already documents. Appliance validation requires backup_r2_* precisely
      # so this branch cannot be reached there.
      record warn "Off-site backup not configured" "BACKUP_R2_BUCKET is unset, so nothing in this cluster is copied off-site. Deliberate if this cluster is backed up by other means — but that is not visible from here, so it cannot be reported as healthy"
    fi

    # 20. Off-site backup coverage — which databases, not merely whether it ran.
    #
    # Check 19 answers "did the pipeline land recently". This answers "did every
    # database it knows about make it into the archive", and the two fail
    # independently: an archive can upload on time with a database missing from
    # it, and check 19 cannot tell.
    #
    # The Job's exit code is one bit and the script now covers four databases,
    # so "mariadb failed while postgres succeeded" and "everything failed"
    # arrive here identically. The detail is read from a ConfigMap the backup
    # publishes rather than parsed out of its log — parsing would couple this
    # check to wording that changed twice in the week it was written — and the
    # outcomes are separate keys so "absent" and "failed" cannot reach this
    # check as the same string.
    if [[ -n "${BACKUP_R2_BUCKET:-}" ]]; then
      # stderr to its own file and branch on the exit code, rather than folding
      # 2>&1 into the value: the API server prepends Warning: headers to
      # perfectly successful reads (admission webhooks, deprecations), which
      # would make a healthy GET look unreadable and paste the warning into the
      # email. Swallowing stderr entirely is the other wrong answer — then "not
      # published yet" and "cannot read it" become the same line, which is the
      # conflation this pair of checks exists to remove.
      COV_ERR=$(mktemp)
      if COV=$(kubectl -n monitoring get cm offsite-backup-status -o json 2>"$COV_ERR"); then
        COV_READ=1
      else
        COV_READ=0; COV_MSG=$(tr '\n' ' ' <"$COV_ERR")
      fi
      rm -f "$COV_ERR"
      if [[ "$COV_READ" -eq 0 ]]; then
        if [[ "$COV_MSG" == *NotFound* ]]; then
          # Expected on the first run after this shipped, and worth a warn
          # rather than silence if it persists: the backup is not publishing.
          record warn "Off-site backup coverage" \
            "no status published yet — appears after the next backup run"
        else
          record warn "Off-site backup coverage" "cannot read status: ${COV_MSG}"
        fi
      else
        # `absent` is deliberately published but not read here: keeping it a
        # separate key is what stops it ever being folded into `failed`, and
        # the log already names which databases a cluster does not have.
        COV_TS=$(echo "$COV"   | jq -r '.data.timestamp // ""')
        COV_OK=$(echo "$COV"   | jq -r '.data.dumped // ""')
        COV_BAD=$(echo "$COV"  | jq -r '.data.failed // ""')
        # A database that was dumped on the previous run and is absent now. The
        # backup cannot call that a failure — absence is normal — but it is the
        # one shape of absence that means coverage was lost rather than never
        # configured, and it must not reach a green line.
        COV_GONE=$(echo "$COV" | jq -r '.data.regressed // ""')
        # How many bytes the backup actually staged (ferry133/jg-base#54). The
        # backup published "encrypted: 1626 bytes" to its own log every night on
        # an appliance whose archive contained nothing, and nothing read that
        # log. Carried into the report rather than compared against a constant
        # here: a full cluster stages ~1.5 MiB and an appliance legitimately far
        # less, so the number that matters is this cluster's yesterday, and the
        # reader has that.
        COV_BYTES=$(echo "$COV" | jq -r '.data.staged_bytes // ""')
        # Instances that exist but are scaled to 0 — their PVC content is real
        # and NOT in the archive (ferry133/jg-base#61). Its own key on purpose:
        # `absent` is deliberately unread here, so folding this state in there
        # would make it invisible by the same rule that protects absent from
        # ever being read as failed.
        COV_UNCAP=$(echo "$COV" | jq -r '.data.uncapturable // ""')
        # Whether the staged archive actually left the cluster (#63). Three
        # values: "yes", "no" (published before the upload, never patched —
        # the run died at or before the upload), "skipped" (nothing to send).
        # Missing on a status written by a pre-#63 backup: tolerated below so
        # one transition day does not read as a fleet-wide upload failure.
        COV_UPLOADED=$(echo "$COV" | jq -r '.data.uploaded // ""')
        COV_EPOCH="$(epoch_of "$COV_TS")"
        COV_AGE_H=""
        [[ -n "$COV_EPOCH" ]] && COV_AGE_H=$(( ( $(date -u +%s) - COV_EPOCH ) / 3600 ))
        if [[ -n "$COV_BAD" || -n "$COV_GONE" ]]; then
          # The line this whole issue exists for: name them.
          COV_MSG=""
          [[ -n "$COV_BAD" ]] && COV_MSG="failed to dump: ${COV_BAD}"
          [[ -n "$COV_GONE" ]] && COV_MSG="${COV_MSG:+${COV_MSG}; }was dumped on the previous run, absent now: ${COV_GONE}"
          record fail "Off-site backup coverage" "$COV_MSG"
        elif [[ "$COV_UPLOADED" == "no" ]]; then
          # The run staged content and it never left the cluster (#63): the
          # dump columns are truthful and the answer to "is it backed up" is
          # still no. Before the age checks — a stale status whose last word
          # is "no" is a failure first and old news second (check 19 already
          # says the job itself failed; this row keeps the COVERAGE answer
          # from reading clean). Only the literal "no" fails: "skipped" falls
          # through to the 0-bytes/uncapturable rows that describe it, and ""
          # (pre-#63 status) keeps yesterday's behavior for the transition.
          record fail "Off-site backup coverage" \
            "staged ${COV_BYTES:-?} bytes but the upload never completed — nothing left the cluster"
        elif [[ -z "$COV_AGE_H" ]]; then
          # Unknown age, said as unknown — the same rule check 19 follows twenty
          # lines up. Falling through to ok would assert coverage from a status
          # that might be months old.
          record warn "Off-site backup coverage" "cannot parse status timestamp (${COV_TS})"
        elif (( COV_AGE_H > 26 )); then
          # 26h, matching check 19's "late" threshold rather than its 48h
          # "stale". A different number here produces a report that says the
          # backup is late and, on the next line, that coverage is fine.
          record warn "Off-site backup coverage" \
            "status is ${COV_AGE_H}h old and describes an earlier run"
        elif [[ -n "$COV_UNCAP" ]]; then
          # An instance whose deployment and PVC exist, scaled to 0 — exec has
          # no pod to reach, so whatever it accumulated is NOT in the archive.
          # Never ok: present-but-unprotected reading as green is the row #54
          # was opened about. Not fail either: a deliberate scale-down must not
          # withhold the dead-man ping — same rule as the 0-bytes row below.
          # BEFORE that row on purpose: when the only instance is scaled to 0,
          # this names the cause where "staged 0 bytes" names the symptom.
          # Real failures still win — the fail branch above is checked first.
          record warn "Off-site backup coverage" \
            "present but not captured (scaled to 0): ${COV_UNCAP}${COV_BYTES:+ — ${COV_BYTES} bytes staged}"
        elif [[ "$COV_BYTES" == "0" ]]; then
          # BEFORE the "no databases installed" branch below, and that order is
          # the entire fix for ferry133/jg-base#54. This is what an appliance
          # produces: nothing failed, nothing regressed, no database is
          # installed — every source-side signal green — and the archive holds
          # nothing. Reached the other way round, "no databases installed" wins
          # first and reports ok, which is the row #54 was opened about, rebuilt
          # inside the change meant to remove it. (It was: the test in
          # scripts/check-backup-coverage-row.sh caught exactly that on the
          # first run.)
          #
          # warn and not fail: only FAIL_COUNT gates the dead-man ping, and a
          # cluster that genuinely holds nothing worth backing up must not
          # withhold the ping for every other check. The row still says it.
          record warn "Off-site backup coverage" \
            "ran and staged 0 bytes — nothing on this cluster was backed up"
        elif [[ -z "$COV_OK" ]]; then
          # Nothing dumped, but bytes were staged: a cluster whose artifacts all
          # come from somewhere other than the database list. Distinct from the
          # branch above, which is why they are separate keys and not one.
          record ok "Off-site backup coverage (nothing dumped${COV_BYTES:+, ${COV_BYTES} bytes staged})"
        else
          record ok "Off-site backup coverage (${COV_OK}${COV_BYTES:+, ${COV_BYTES} bytes staged})"
        fi
      fi
    fi

    # 21. Off-site backup destination — is the archive actually THERE.
    #
    # 19 and 20 are both source-side: 19 reads the upload Job's completionTime,
    # 20 reads a ConfigMap the backup publishes about itself. Both answer "did
    # this cluster do its part", so all four of these render as a healthy
    # backup line (ferry133/jg-base#49):
    #
    #   - the object deleted after a successful upload
    #   - bucket or credentials repointed elsewhere while the Job still succeeds
    #   - the destination full, or the object corrupt on write
    #   - a replication chain that never carried it to the second site
    #
    # Additive, not a replacement. 19 asks "did I send it", this asks "is it
    # there", and dropping either leaves a half nobody can see.
    #
    # `s3api list-objects-v2` and not `aws s3 ls`, deliberately: the whole value
    # of this row is that "the call failed" and "the call worked, the prefix is
    # empty" land in DIFFERENT outcomes, and `s3 ls` has been observed to signal
    # both with the same exit status. list-objects-v2 exits non-zero only when
    # the request itself failed, and returns JSON with no `Contents` when the
    # prefix is genuinely empty.
    if [[ -n "${BACKUP_R2_BUCKET:-}" ]]; then
      if ! command -v aws >/dev/null 2>&1; then
        # The apk install above is best-effort and this is a base app. Say so
        # rather than let a missing tool read as a clean destination.
        record skip "Off-site backup destination" "aws CLI is not installed in this image, so the destination was not read"
      elif [[ -z "${BACKUP_R2_ENDPOINT:-}" || -z "${BACKUP_R2_ACCESS_KEY_ID:-}" || -z "${BACKUP_R2_SECRET_ACCESS_KEY:-}" ]]; then
        # A bucket with no endpoint or no credentials cannot be looked at from
        # here. skip, not fail: nothing was learned about the backup either way.
        record skip "Off-site backup destination" "BACKUP_R2_BUCKET is set but endpoint/credentials are not, so the destination cannot be read from this cluster"
      else
        DEST_ERR=$(mktemp)
        if DEST_JSON=$(AWS_ACCESS_KEY_ID="$BACKUP_R2_ACCESS_KEY_ID" \
                       AWS_SECRET_ACCESS_KEY="$BACKUP_R2_SECRET_ACCESS_KEY" \
                       AWS_DEFAULT_REGION=auto \
                       aws s3api list-objects-v2 \
                         --endpoint-url "$BACKUP_R2_ENDPOINT" \
                         --bucket "$BACKUP_R2_BUCKET" \
                         --prefix "${CLUSTER_NAME}/" \
                         --output json 2>"$DEST_ERR"); then
          DEST_LISTED=1
        else
          DEST_LISTED=0
          DEST_MSG=$(tr '\n' ' ' <"$DEST_ERR")
        fi
        rm -f "$DEST_ERR"
        if [[ "$DEST_LISTED" -eq 0 ]]; then
          # The line #49 is most specific about. An unreachable endpoint, a
          # rejected key, and a credential scoped to PutObject only are all
          # "we could not look" — a different fact from "the archive is not
          # there". Folding them into fail turns one network blip into an
          # apparent data loss, and a row that cries wolf is a row that gets
          # switched off. The aws error is carried through verbatim so the
          # reason is legible: AccessDenied reads differently from a timeout.
          record skip "Off-site backup destination" "could not list s3://${BACKUP_R2_BUCKET}/${CLUSTER_NAME}/ — ${DEST_MSG}"
        else
          # ⚠️ SCOPED TO THE SYSTEM FAMILY, and the scope is the whole row.
          # Until 2026-10-01 this took the newest object in the prefix, full
          # stop. ferry133/jg-base#145 puts a SECOND family in that same
          # prefix -- the claudecode state archive, uploading daily on its own
          # schedule -- and the two do not fail together. A dead
          # `offsite-backup` with a healthy claudecode archive therefore read
          # GREEN here, because the newest object was fresh; it just was not
          # the one this row is about.
          #
          # Measured, not derived (2026-10-01, the shipped expression against
          # fixtures): system archive 72h old alone -> the row's own threshold
          # says fail; add one 1h-old claudecode object and the SAME input
          # reads 1h / ok. The masking object is the discriminator, so the
          # reading is about the selector and not about the fixture.
          #
          # ⚠️ The claudecode family is NOT silently dropped -- "we stopped
          # looking at it" and "it is fine" are the same green. Its age is
          # read below and carried into the message, so a reader sees both
          # numbers. A row of its own (ferry133/jg-base#145 condition 7)
          # is the fuller answer and is not in this PR; this change is only
          # the half that had to land no later than the first upload.
          #
          # ANCHORED on CLUSTER_NAME, not a bare `contains("-claudecode-")`.
          # The first version carried a comment claiming a cluster literally
          # named `claudecode` would still be classified correctly. True for
          # the bare name -- and wrong for `jg-claudecode` or `x-claudecode-y`,
          # where the SYSTEM key `<c>/<c>-<stamp>.tar.gz.age` contains
          # `-claudecode-` all by itself. FO-runbook [5fe39a] measured it on a
          # fixture: system 0, claudecode 2, and the row reporting
          # `no system archive` on a cluster whose backup was fine.
          #
          # That direction is fail-closed (a false alarm, not a mask) and no
          # current cluster name contains the string -- so it was a defect in
          # the COMMENT first. Anchoring fixes the code instead of narrowing
          # the claim, because a documented limitation is still a trap for
          # whoever names the next cluster.
          #
          # `--arg`, not interpolation: the cluster name reaches jq as data, so
          # a name with jq-significant characters cannot rewrite the filter.
          #
          # ⚠️ TWO selectors, and which one each line uses is the point.
          # Since jg-cluster-template#202 an EXTRA instance archives into the
          # same prefix as `<c>/<c>-claudecode-<instance>-<stamp>.tar.gz.age`.
          #   CC_SEL     every claudecode key, `im` or extra. Used ONLY to
          #              keep them OUT of the system family -- narrowing it
          #              would hand every extra's archive to the system count,
          #              and a fresh extra would mask a dead offsite-backup.
          #   CC_IM_SEL  the `im` family only: `-claudecode-` immediately
          #              followed by the stamp (8 digits then `T`, checked
          #              with explode rather than test(): no other line in
          #              this script needs jq's regex support, so this one
          #              does not start depending on it). This is what the claudecode
          #              verdict below judges, and it is judged against the
          #              `claudecode-state-backup` CronJob, which is `im`'s.
          #              Using CC_SEL here would let a fresh extra archive keep
          #              a dead `im` archive looking fine.
          # ⚠️ So extras' archives are in NEITHER count and get no verdict
          # here. That is a known gap, said rather than hidden: their CronJobs
          # are named by `claude_instances` and live in the per-user repo, so
          # this row cannot name them; on 2026-10-16 no cluster has one.
          # scripts/check-offsite-family-split.sh holds both directions.
          CC_SEL='(.Key // "") | startswith($cn + "/" + $cn + "-claudecode-")'
          CC_IM_SEL='(.Key // "") | startswith($cn + "/" + $cn + "-claudecode-") and (ltrimstr($cn + "/" + $cn + "-claudecode-") | (.[8:9] == "T") and (.[0:8] | explode | length == 8 and all(. >= 48 and . <= 57)))'
          DEST_LATEST=$(echo "$DEST_JSON" | jq -r --arg cn "$CLUSTER_NAME" "[(.Contents // [])[] | select(${CC_SEL} | not) | .LastModified] | sort | last // \"\"")
          DEST_CC_LATEST=$(echo "$DEST_JSON" | jq -r --arg cn "$CLUSTER_NAME" "[(.Contents // [])[] | select(${CC_IM_SEL}) | .LastModified] | sort | last // \"\"")
          DEST_CC_COUNT=$(echo "$DEST_JSON" | jq -r --arg cn "$CLUSTER_NAME" "[(.Contents // [])[] | select(${CC_IM_SEL})] | length")
          # `+00:00` to `Z` for epoch_of's busybox fallback. GNU date takes
          # either and coreutils is installed above, so this costs nothing
          # today; it stops the sibling image's spelling being a live trap if
          # this block is ever lifted into it.
          DEST_LATEST="${DEST_LATEST/+00:00/Z}"
          DEST_COUNT=$(echo "$DEST_JSON" | jq -r --arg cn "$CLUSTER_NAME" "[(.Contents // [])[] | select(${CC_SEL} | not)] | length")
          # Said in the same breath as the system verdict, so neither family
          # can go quiet without a reader noticing.
          if [[ -n "$DEST_CC_LATEST" ]]; then
            DEST_CC_LATEST="${DEST_CC_LATEST/+00:00/Z}"
            DEST_CC_EPOCH="$(epoch_of "$DEST_CC_LATEST")"
            if [[ -n "$DEST_CC_EPOCH" ]]; then
                DEST_CC_AGE_H=$(( ( $(date -u +%s) - DEST_CC_EPOCH ) / 3600 ))
                DEST_CC_NOTE="; claudecode: ${DEST_CC_AGE_H}h ago, ${DEST_CC_COUNT} objects"
            else
              DEST_CC_NOTE="; claudecode: ${DEST_CC_COUNT} objects, timestamp unparseable"
              DEST_CC_UNPARSEABLE=1
            fi
          else
            DEST_CC_NOTE="; claudecode: none"
          fi
          # ⚠️ Is the claudecode archive SUPPOSED to be uploading? (ferry133/jg-base#152)
          # The bucket alone cannot say. Until this, "never enabled" and "enabled
          # and never once uploaded" were the same `claudecode: none` [ok], and an
          # `im` turned enabled -> disabled kept its last archives ageing in the
          # prefix (the system job's 30-day prune removes them, not the archive
          # job) -- so this row went warn after 26h and fail after 48h on a
          # cluster where nobody did anything wrong. That is the check that fires
          # every run and gets switched off.
          #
          # The discriminator is the archive's own CronJob. It ships from
          # `im/enabled` and `im/disabled` is an EMPTY path, which Flux prunes
          # (`im-ks.yaml`): absent CronJob == feature off. Four outcomes, kept
          # apart because they mean different things:
          #   on        -> both families judged; `none` judged by the CronJob's age
          #                (grace: a freshly enabled cluster has not reached its
          #                first 19:00 UTC run yet)
          #   off       -> claudecode age REPORTED, never judged
          #   suspended -> warn: paused on purpose is still not being backed up
          #   unknown   -> the read failed for a reason other than NotFound; keep
          #                judging what is in the bucket, and an empty family is
          #                warn, because "could not tell" is not a pass
          # ⚠️ Known edge, inferred not measured: turning `im` off with Flux
          # `suspend: true` instead of the empty path (which `im-ks.yaml` warns
          # against) leaves the CronJob in place AND running -- so it keeps
          # uploading and this row stays correct.
          # RBAC: ClusterRole `daily-check` has batch/cronjobs get,list
          # (rbac.yaml); read off the live role on jcom and jg-jiahd 2026-10-15.
          DEST_CC_ARMED=unknown
          DEST_CC_CJ_MSG=""
          DEST_CC_CJ_ERR=$(mktemp)
          # Spelled differently from row 26's `if ! command -v kubectl …` on
          # purpose: scripts/check-kubectl-skew-row.sh slices row 26 by that
          # exact line, and an identical line here was found first.
          if [[ -z "$(command -v kubectl)" ]]; then
            DEST_CC_CJ_MSG="kubectl is not installed"
          elif DEST_CC_CJ_JSON=$(kubectl -n claudecode get cronjob claudecode-state-backup -o json 2>"$DEST_CC_CJ_ERR"); then
            if [[ "$(echo "$DEST_CC_CJ_JSON" | jq -r '.spec.suspend // false')" == "true" ]]; then
              DEST_CC_ARMED=suspended
            else
              DEST_CC_ARMED=on
              DEST_CC_CJ_CREATED=$(echo "$DEST_CC_CJ_JSON" | jq -r '.metadata.creationTimestamp // ""')
            fi
          elif grep -q 'NotFound' "$DEST_CC_CJ_ERR"; then
            DEST_CC_ARMED=off
          else
            DEST_CC_CJ_MSG=$(tr '\n' ' ' <"$DEST_CC_CJ_ERR")
          fi
          rm -f "$DEST_CC_CJ_ERR"
          case "$DEST_CC_ARMED" in
            off)       DEST_CC_NOTE="${DEST_CC_NOTE} (archive off: CronJob absent, not judged)" ;;
            suspended) DEST_CC_NOTE="${DEST_CC_NOTE} (archive CronJob suspended)" ;;
            unknown)   DEST_CC_NOTE="${DEST_CC_NOTE} (archive CronJob unreadable: ${DEST_CC_CJ_MSG:-no message})" ;;
          esac
          if [[ -z "$DEST_LATEST" ]]; then
            # Listed fine, nothing there. On a versioned + object-locked bucket
            # a delete marker produces exactly this, and that is the case this
            # row exists to catch.
            # The message names the claudecode count deliberately: once a
            # second family shares the prefix, "it holds no objects" would be
            # false while the thing this row guards is still absent, and a
            # reader chasing a wrong sentence loses the hour the row bought.
            record fail "Off-site backup destination empty" "listed s3://${BACKUP_R2_BUCKET}/${CLUSTER_NAME}/ and it holds no system archive${DEST_CC_NOTE}"
          else
            DEST_EPOCH="$(epoch_of "$DEST_LATEST")"
            if [[ -z "$DEST_EPOCH" ]]; then
              # Unknown age said as unknown, the same rule 19 and 20 follow.
              record warn "Off-site backup destination" "cannot parse object timestamp (${DEST_LATEST})"
            else
              DEST_AGE_H=$(( ( $(date -u +%s) - DEST_EPOCH ) / 3600 ))
              # 26h/48h, the same two numbers as check 19 — a different
              # threshold here produces a report that says the upload is late
              # on one line and the destination is fine on the next.
              # ⚠️ BOTH families are thresholded, and until 2026-10-03 only the
              # system one was. The 2026-10-01 change that stopped claudecode from
              # MASKING a dead system archive left it with no verdict of its own:
              # its age was computed, formatted into the message, and never
              # compared to anything. A claudecode archive that stopped uploading
              # entirely produced `ok` with `claudecode: 300h ago` sitting in the
              # prose. **Printing a number is not alerting on it** -- and the guard
              # asserted only that the note was PRESENT, so it passed too. Found by
              # checking a peer's claim that this row would go red within 24h if the
              # archive stopped; it would not have.
              #
              # ⚠️ Until 2026-10-15 this was thresholded ONLY when the family had
              # at least one object, and the cost was written here: "never
              # enabled" and "enabled and never once uploaded" read the same.
              # The CronJob discriminator above (ferry133/jg-base#152) now
              # separates them, and also stops an `im` turned off from alarming
              # on its leftover archives.
              DEST_LEVEL=ok
              DEST_LATE=""
              if (( DEST_AGE_H > 48 )); then
                DEST_LEVEL=fail; DEST_LATE="system ${DEST_AGE_H}h"
              elif (( DEST_AGE_H > 26 )); then
                DEST_LEVEL=warn; DEST_LATE="system ${DEST_AGE_H}h"
              fi
              # Judged only when the archive is supposed to run (or we could
              # not tell). `off` reports the age and judges nothing (#152).
              if [[ "$DEST_CC_ARMED" == on || "$DEST_CC_ARMED" == unknown ]]; then
              if [[ -n "${DEST_CC_AGE_H:-}" ]] && (( DEST_CC_COUNT > 0 )); then
                if (( DEST_CC_AGE_H > 48 )); then
                  DEST_LEVEL=fail; DEST_LATE="${DEST_LATE}${DEST_LATE:+, }claudecode ${DEST_CC_AGE_H}h"
                elif (( DEST_CC_AGE_H > 26 )); then
                  [[ "$DEST_LEVEL" == "fail" ]] || DEST_LEVEL=warn
                  DEST_LATE="${DEST_LATE}${DEST_LATE:+, }claudecode ${DEST_CC_AGE_H}h"
                fi
              fi
              # An unreadable timestamp is "could not measure", which must not
              # read better than a family that has one (#152, the system-side
              # twin is `cannot parse object timestamp` -> warn).
              if [[ -n "${DEST_CC_UNPARSEABLE:-}" ]]; then
                [[ "$DEST_LEVEL" == "fail" ]] || DEST_LEVEL=warn
                DEST_LATE="${DEST_LATE}${DEST_LATE:+, }claudecode timestamp unparseable"
              fi
              # Empty family. `on`: judged by how long the CronJob has existed,
              # same 26h/48h -- a cluster enabled an hour ago has simply not
              # reached its first run. `unknown`: warn, never ok.
              if (( DEST_CC_COUNT == 0 )); then
                if [[ "$DEST_CC_ARMED" == unknown ]]; then
                  [[ "$DEST_LEVEL" == "fail" ]] || DEST_LEVEL=warn
                  DEST_LATE="${DEST_LATE}${DEST_LATE:+, }claudecode none and its CronJob unreadable"
                else
                  DEST_CC_CJ_EPOCH="$(epoch_of "${DEST_CC_CJ_CREATED:-}")"
                  if [[ -z "$DEST_CC_CJ_EPOCH" ]]; then
                    [[ "$DEST_LEVEL" == "fail" ]] || DEST_LEVEL=warn
                    DEST_LATE="${DEST_LATE}${DEST_LATE:+, }claudecode none, CronJob age unreadable (${DEST_CC_CJ_CREATED:-empty})"
                  else
                    DEST_CC_CJ_AGE_H=$(( ( $(date -u +%s) - DEST_CC_CJ_EPOCH ) / 3600 ))
                    if (( DEST_CC_CJ_AGE_H > 48 )); then
                      DEST_LEVEL=fail; DEST_LATE="${DEST_LATE}${DEST_LATE:+, }claudecode none, enabled ${DEST_CC_CJ_AGE_H}h ago"
                    elif (( DEST_CC_CJ_AGE_H > 26 )); then
                      [[ "$DEST_LEVEL" == "fail" ]] || DEST_LEVEL=warn
                      DEST_LATE="${DEST_LATE}${DEST_LATE:+, }claudecode none, enabled ${DEST_CC_CJ_AGE_H}h ago"
                    else
                      DEST_CC_NOTE="${DEST_CC_NOTE} (enabled ${DEST_CC_CJ_AGE_H}h ago, first archive pending)"
                    fi
                  fi
                fi
              fi
              elif [[ "$DEST_CC_ARMED" == suspended ]]; then
                [[ "$DEST_LEVEL" == "fail" ]] || DEST_LEVEL=warn
                DEST_LATE="${DEST_LATE}${DEST_LATE:+, }claudecode archive suspended"
              fi
              case "$DEST_LEVEL" in
                fail) record fail "Off-site backup destination stale" "${DEST_LATE} — newest system archive is ${DEST_AGE_H}h old (${DEST_LATEST})${DEST_CC_NOTE}" ;;
                warn) record warn "Off-site backup destination late" "${DEST_LATE} — newest system archive is ${DEST_AGE_H}h old${DEST_CC_NOTE}" ;;
                *)    record ok "Off-site backup destination fresh (${DEST_AGE_H}h ago, ${DEST_COUNT} system objects${DEST_CC_NOTE})" ;;
              esac
            fi
          fi
        fi
      fi
    fi

    # 22. Stalled provisioning tickets (factory-agent 3.8).
    #
    # This check NEVER records `fail`, and that is a property of the design
    # rather than an accident of today's threshold. Only FAIL_COUNT gates the
    # dead-man ping at the end of this script, so a `fail` here would let one
    # slow delivery mark the whole cluster Down on healthchecks.io. That is
    # exactly #6: check 18 FAILs every day under the shipping DNS default, so
    # "the cluster died" and "one check is noisy" became the same state on that
    # dashboard. **A ticket sitting too long is a fact about a delivery, not
    # about whether this cluster is alive.** Anything added here later must keep
    # that separation.
    #
    # Silent unless configured, following ENDPOINTS_TO_PROBE and NAS_SERVER
    # above. No cluster sets these today, so this adds nothing anywhere until
    # someone opts in.
    if [[ -n "${FACTORY_TICKET_REPO:-}" && -n "${FACTORY_TICKET_TOKEN:-}" ]]; then
      STAGE_PREFIX="${FACTORY_STAGE_LABEL_PREFIX:-stage/}"
      # Deliberately generous, and the number is the point of the whole check.
      # No provisioning has been timed end to end yet, so anything tighter would
      # be invented rather than derived — and a check that trips during normal
      # work teaches the reader to skip it, which costs more than the check is
      # worth. Tighten once real stage durations exist: that is a value change,
      # not a code change.
      STALL_H="${FACTORY_STALL_HOURS:-48}"
      GH_AUTH="Authorization: Bearer ${FACTORY_TICKET_TOKEN}"
      GH_ACC="Accept: application/vnd.github+json"
      GH_BASE="https://api.github.com/repos/${FACTORY_TICKET_REPO}"

      TICKETS=$(curl -fsS --max-time 20 -H "$GH_AUTH" -H "$GH_ACC" \
        "${GH_BASE}/issues?state=open&per_page=100" 2>/dev/null || true)

      if [[ -z "$TICKETS" ]]; then
        # The third state, said as itself. "Could not ask" is not "nothing is
        # stalled", and folding it into ok is how an unreachable API, a revoked
        # token or a rate limit becomes a clean report. Warn, not fail: an
        # unreachable github.com says nothing about this cluster's liveness.
        record warn "Stalled provisioning tickets" \
          "could not query ${FACTORY_TICKET_REPO} — network, token or rate limit. NOT measured this run"
      else
        # 3.3's invariant is exactly one stage label per ticket. Tickets holding
        # more than one are reported rather than resolved by picking: silently
        # choosing would conceal the precise inconsistency 3.7 exists to
        # escalate, and would do it while printing a reassuring number.
        mapfile -t TICKET_ROWS < <(printf '%s' "$TICKETS" | jq -r --arg p "$STAGE_PREFIX" '
          .[] | select(has("pull_request") | not) | . as $i
          | [ $i.labels[].name | select(startswith($p)) ] as $s
          | select(($s | length) > 0)
          | "\($i.number)\t\($s | join(","))\t\($s | length)"' 2>/dev/null || true)

        TOTAL_TICKETS=$(printf '%s' "$TICKETS" | jq -r 'length' 2>/dev/null || echo 0)
        STALLED=(); MULTI=(); UNMEASURED=()

        if (( ${#TICKET_ROWS[@]} > 0 )); then
          for row in "${TICKET_ROWS[@]}"; do
            [[ -z "$row" ]] && continue
            num=${row%%$'\t'*}; rest=${row#*$'\t'}
            stage=${rest%%$'\t'*}; cnt=${rest##*$'\t'}
            if (( cnt > 1 )); then MULTI+=("#${num} carries ${cnt}: ${stage}"); continue; fi
            # updated_at is the wrong clock — a comment resets it without the
            # stage moving. Time-in-stage is the age of the `labeled` event for
            # the label the ticket holds now.
            EV=$(curl -fsS --max-time 20 -H "$GH_AUTH" -H "$GH_ACC" \
              "${GH_BASE}/issues/${num}/events?per_page=100" 2>/dev/null || true)
            TS=$(printf '%s' "$EV" | jq -r --arg l "$stage" \
              '[ .[] | select(.event=="labeled" and .label.name==$l) ] | last | .created_at // empty' \
              2>/dev/null || true)
            EP=$(epoch_of "$TS")
            if [[ -z "$EP" ]]; then
              # Same rule as checks 19 and 20: unknown age is reported as
              # unknown. epoch_of prints nothing rather than 0, so this cannot
              # become an age of half a million hours.
              UNMEASURED+=("#${num} (${stage})"); continue
            fi
            AGE_H=$(( ( $(date -u +%s) - EP ) / 3600 ))
            (( AGE_H > STALL_H )) && STALLED+=("#${num} ${stage} ${AGE_H}h")
          done
        fi

        # 100 is the page size and no pagination is followed. Say so when the
        # cap is reached rather than reporting a clean subset as a clean whole.
        (( TOTAL_TICKETS >= 100 )) && UNMEASURED+=("first page only: ${TOTAL_TICKETS} open tickets returned, later pages not fetched")

        MSG=""
        (( ${#STALLED[@]} > 0 ))    && MSG="stalled >${STALL_H}h: $(printf '%s; ' "${STALLED[@]}")"
        (( ${#MULTI[@]} > 0 ))      && MSG="${MSG:+${MSG} }multiple stage labels (3.3 violated): $(printf '%s; ' "${MULTI[@]}")"
        (( ${#UNMEASURED[@]} > 0 )) && MSG="${MSG:+${MSG} }not measured: $(printf '%s; ' "${UNMEASURED[@]}")"

        if [[ -n "$MSG" ]]; then
          record warn "Provisioning tickets" "$MSG"
        else
          record ok "Provisioning tickets (${#TICKET_ROWS[@]} in progress, none over ${STALL_H}h)"
        fi
      fi
    fi

    # 23. base im image pin — is the pinned digest what is actually RUNNING (#66).
    #
    # `latest` on a spegel cluster froze silently: the pod restarted, kubelet
    # said Pulled in 200ms, the Deployment said Running, and it was a
    # months-old image. The pin (#67) removes the freeze; this row guards the
    # two ways the pin itself can rot — the spec quietly going back to a
    # mutable tag, and a pod still running a digest that is not the pinned
    # one. Cluster-local on purpose: comparing the pin against GHCR needs a
    # token and answers the same for every cluster, so that comparison lives
    # in the bump script and k8scc's CI, not in a per-cluster daily report.
    #
    # warn and never fail: a rotted pin is #66's RISK returning, not an
    # outage — the terminal still serves. Only FAIL_COUNT gates the dead-man
    # ping (see check 22's note).
    IM_JSON=$(kubectl -n claudecode get deploy im -o json 2>/dev/null || true)
    if [[ -z "$IM_JSON" ]]; then
      # A real state, said out loud: claudecode suspended, or no im at all.
      # skip and not ok — this row measured nothing, and "could not measure"
      # rendering as a green row is #66's own shape (review catch on PR #68).
      record skip "im image pin" "no im deployment — this row measured nothing"
    else
      # Which Flux Kustomization applied this instance? Two hops, and the
      # first hop is the whole point (#108). kustomize-controller stamps
      # kustomize.toolkit.fluxcd.io/* on the objects IT applies — for `im`
      # that is the HelmRelease, never the Deployment helm-controller renders
      # from it. Measured on all three clusters 2026-09-14, with a positive
      # control that shares the property: claudecode's deploy/postgres DOES
      # carry kustomize.toolkit.fluxcd.io/name=claudecode-db, because
      # kustomize-controller applies that Deployment directly. The label
      # follows who applied the object, not who owns the chain.
      #
      # This row previously compared the Deployment's
      # helm.toolkit.fluxcd.io/name — which carries the HELMRELEASE name,
      # always `im` — against `claude-code-im`, which is a KUSTOMIZATION
      # name and has never been any HelmRelease's name. The test could not
      # come out false, so everything below was unreachable from the day it
      # was written (2026-09-06) until #108. Both handover states also
      # render the HR as `im`, so the HR name never encoded handover state
      # at all: the constant was not the only thing wrong with it.
      #
      # Each way of not-measuring below says something DIFFERENT, on
      # purpose. The bug that hid this row for eight days was a skip line
      # whose stated reason read as correct.
      IM_HR=$(echo "$IM_JSON" | jq -r '.metadata.labels["helm.toolkit.fluxcd.io/name"] // ""')
      IM_HR_NS=$(echo "$IM_JSON" | jq -r '.metadata.labels["helm.toolkit.fluxcd.io/namespace"] // ""')
      if [[ -z "$IM_HR" || -z "$IM_HR_NS" ]]; then
        record skip "im image pin" "deploy/im has no helm.toolkit.fluxcd.io/{name,namespace} — not rendered by helm-controller, so there is no HelmRelease to ask who applied it"
      elif ! IM_KS=$(kubectl -n "$IM_HR_NS" get helmrelease "$IM_HR" -o jsonpath='{.metadata.labels.kustomize\.toolkit\.fluxcd\.io/name}' 2>/dev/null); then
        record skip "im image pin" "helmrelease ${IM_HR_NS}/${IM_HR} could not be read (RBAC, CRD, or it is gone) — owner undetermined, NOT assumed pre-handover"
      elif [[ "$IM_KS" != "claude-code-im" ]]; then
        # A real pre-handover (or foreign) instance. Pinning is the base HR's
        # contract; warning here would flag every not-yet-migrated cluster
        # daily, and a guard that rings on correct input gets switched off —
        # but skip, not ok: nothing was measured, and the row says so. The
        # applier is printed, so "which one" is answerable from the report.
        record skip "im image pin" "im applied by Kustomization '${IM_KS:-<none>}', not claude-code-im — pre-handover or foreign; the pin is the base HR's contract"
      else
        IM_UNPINNED=$(echo "$IM_JSON" | jq -r '((.spec.template.spec.containers // []) + (.spec.template.spec.initContainers // []))[] | .image | select(startswith("ghcr.io/ferry133/claude-code")) | select(contains("@sha256:") | not)')
        IM_PINS=$(echo "$IM_JSON" | jq -r '((.spec.template.spec.containers // []) + (.spec.template.spec.initContainers // []))[] | .image | select(startswith("ghcr.io/ferry133/claude-code")) | select(contains("@sha256:"))' | sed 's/.*@sha256:/sha256:/' | sort -u)
        if [[ -n "$IM_UNPINNED" ]]; then
          record warn "im image pin" "not pinned by digest: $(echo "$IM_UNPINNED" | tr '\n' ' ')— the spegel freeze (#66) is back on the table"
        elif [[ "$(echo "$IM_PINS" | grep -c .)" -ne 1 ]]; then
          record warn "im image pin" "spec pins disagree across containers: $(echo "$IM_PINS" | tr '\n' ' ')"
        else
          IM_SEL=$(echo "$IM_JSON" | jq -r '.spec.selector.matchLabels | to_entries | map("\(.key)=\(.value)") | join(",")')
          IM_RUN=$(kubectl -n claudecode get pods -l "$IM_SEL" -o json 2>/dev/null \
            | jq -r '.items[] | ((.status.containerStatuses // []) + (.status.initContainerStatuses // []))[] | .imageID | select(contains("ferry133/claude-code"))' \
            | sed 's/.*@sha256:/sha256:/' | sort -u)
          if [[ -z "$IM_RUN" ]]; then
            record warn "im image pin" "pinned, but no running container to compare (rollout in flight, or the pod is down)"
          elif [[ "$IM_RUN" == "$IM_PINS" ]]; then
            record ok "im image pin (running == ${IM_PINS:0:19}…)"
          else
            # The #66 shape exactly: spec says one thing, the node runs
            # another, and no other row on this report can see the difference.
            record warn "im image pin" "running $(echo "$IM_RUN" | tr '\n' ' ')!= pinned ${IM_PINS} (stale pod, or a mirror answered a frozen reference)"
          fi
        fi
      fi
    fi

    # 24. Omni service-account key expiry (ferry133/fleet-ops#11).
    #
    # A workload holding an Omni SA key passes every other row on this report
    # after that key expires: the pod stays Running, its probes are a TCP
    # connect, and the failure surfaces only when someone calls a tool — as a
    # talosctl auth error that an agent most likely reads as "not configured
    # here". The expiry is known at issuance, so this row reads the date
    # recorded then: an annotation on each workload that holds a key, rendered
    # from cluster-secrets (`*_SA_KEY_EXPIRES`, from jg-cluster-template).
    #
    # It reads the RECORDED DATE, NOT THE KEY. That is a decision, not a gap
    # found later (fleet-ops#11, agreed with its opener): validating the key
    # itself would mean this ServiceAccount reading Secrets in two namespaces,
    # and it deliberately reads none. So a revoked key, or a malformed one
    # recorded with a future date, reads green here — and the report says so
    # itself (OMNI_CAVEAT), because a limit written only in an issue is gone by
    # the time anyone reads the report.
    #
    # Every row prints the date it compared. The in-cluster date is a second
    # copy of fleet-ops' handover-inventory.md and nothing in a cluster can
    # compare the two; a printed date at least lets the reader see a mismatch.
    #
    # warn under 30 days left, and this row NEVER records `fail`. FAIL_COUNT
    # is the only gate on the healthchecks.io dead-man ping, so a fail here
    # would mark the whole cluster Down over a support tool's credential — and
    # an expired Omni key breaks talos-mcp and factory, not the cluster. That
    # is the rule checks 22 and 23 already state. The first version of this
    # row did fail inside seven days; the opener revised the acceptance on
    # PR #98 ("leaves ok, and the text separates expired / under 7 days /
    # under 30"), and ferry133 may overrule. The urgency lives in the words.
    OMNI_ANN="jg-base.jiahd.cc/omni-sa-key-expires"
    OMNI_CAVEAT="expiry read from the recorded date, not from the key — a revoked or malformed key with a future date still reads green here"
    if ! OMNI_JSON=$(kubectl get deployments,statefulsets -A -o json 2>/dev/null); then
      record warn "Omni SA key expiry" "could not list Deployments/StatefulSets cluster-wide (RBAC or API error) — this row measured nothing"
    elif ! OMNI_HELD=$(echo "$OMNI_JSON" | jq -r --arg a "$OMNI_ANN" '
        .items[]
        | select((.metadata.annotations[$a] // "") != "")
        | "\(.metadata.namespace)/\(.metadata.name)\t\(.metadata.annotations[$a])"' 2>/dev/null); then
      record warn "Omni SA key expiry" "could not parse the workload list — this row measured nothing"
    elif [[ -z "$OMNI_HELD" ]]; then
      # skip, not ok: nothing was compared. On most clusters this is simply
      # "no key issued", but a key held without a recorded date lands here
      # too, and this row cannot tell the two apart.
      record skip "Omni SA key expiry" "no workload on this cluster records an Omni service-account key expiry, so this row measured nothing — a key held without a recorded date is invisible here"
    else
      OMNI_NOW=$(date -u +%s)
      OMNI_N=0
      # The date is the LAST field: IFS tab counts as whitespace, so `read`
      # collapses an empty field and shifts everything after it.
      while IFS=$'\t' read -r O_ID O_DATE; do
        [[ -z "$O_ID" ]] && continue
        OMNI_N=$((OMNI_N + 1))
        O_EPOCH=""
        # Date only, the way the ledger writes it. Anchored because GNU date
        # accepts near-misses and silently misreads them — measured:
        # `2027-07-3` (a truncated 30) parses as July 3rd, 27 days early, and
        # `27-07-30` as 2027. A shape that is not YYYY-MM-DD is refused and
        # reported as unknown rather than trusted as a date.
        if [[ "$O_DATE" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
          O_EPOCH="$(epoch_of "${O_DATE}T00:00:00Z")"
        fi
        if [[ -z "$O_EPOCH" ]]; then
          record warn "Omni SA key ${O_ID}" "cannot parse recorded expiry '${O_DATE}' (want YYYY-MM-DD) — this key's expiry is unknown, not fine"
          continue
        fi
        O_LEFT=$(( O_EPOCH - OMNI_NOW ))
        O_DAYS=$(( O_LEFT / 86400 ))
        if (( O_LEFT <= 0 )); then
          record warn "Omni SA key ${O_ID} expired ${O_DATE}" "the recorded expiry has passed — if that date is right, every Omni call from this workload now fails"
        elif (( O_LEFT < 7 * 86400 )); then
          record warn "Omni SA key ${O_ID} expires ${O_DATE}" "${O_DAYS}d left — reissue now (fleet-ops handover-inventory.md)"
        elif (( O_LEFT < 30 * 86400 )); then
          record warn "Omni SA key ${O_ID} expires ${O_DATE}" "${O_DAYS}d left — schedule the reissue"
        else
          record ok "Omni SA key ${O_ID} expires ${O_DATE} (${O_DAYS}d left)"
        fi
      done <<< "$OMNI_HELD"
      record ok "Omni SA key expiry measured: ${OMNI_N} — ${OMNI_CAVEAT}"
    fi

    # 25. GitHub token expiry (ferry133/jg-base#99).
    #
    # Same shape as row 24 and a separate row on purpose: each credential's
    # weakness is different, and a row that says "credential" instead of
    # naming one cannot state its own. This one's weakness is that a
    # fine-grained PAT HAS NO KEY ID — the three Omni keys can be named and
    # revoked by id, this one can only be matched by name and expiry in the
    # GitHub UI. That sentence belongs in the report, not only here: the
    # report is what gets read (the acceptance FO-openspec [8e8ef1] wrote on
    # #99, condition 1).
    #
    # When it breaks matters more than row 24's: an expired Omni key breaks a
    # diagnostic tool, while this token breaks provisioning halfway through
    # creating a customer's repo, with the ticket already open and the machine
    # possibly already at the customer.
    #
    # warn, never fail, for row 24's reason: FAIL_COUNT gates the dead-man
    # ping, and an expired token is not a dead cluster.
    GHT_ANN="jg-base.jiahd.cc/github-token-expires"
    GHT_CAVEAT="expiry read from the recorded date, not from the token — and a fine-grained PAT has no key id, so it can only be matched by name and expiry in the GitHub UI, and a replaced or revoked token with a future date still reads green here"
    if ! GHT_JSON=$(kubectl get deployments,statefulsets -A -o json 2>/dev/null); then
      record warn "GitHub token expiry" "could not list Deployments/StatefulSets cluster-wide (RBAC or API error) — this row measured nothing"
    elif ! GHT_HELD=$(echo "$GHT_JSON" | jq -r --arg a "$GHT_ANN" '
        .items[]
        | select((.metadata.annotations[$a] // "") != "")
        | "\(.metadata.namespace)/\(.metadata.name)\t\(.metadata.annotations[$a])"' 2>/dev/null); then
      record warn "GitHub token expiry" "could not parse the workload list — this row measured nothing"
    elif [[ -z "$GHT_HELD" ]]; then
      record skip "GitHub token expiry" "no workload on this cluster records a GitHub token expiry, so this row measured nothing — a token held without a recorded date is invisible here"
    else
      GHT_NOW=$(date -u +%s)
      GHT_N=0
      while IFS=$'\t' read -r G_ID G_DATE; do
        [[ -z "$G_ID" ]] && continue
        GHT_N=$((GHT_N + 1))
        G_EPOCH=""
        # Anchored for row 24's measured reason: GNU date reads `2027-07-3` as
        # July 3rd and `27-07-30` as 2027, silently.
        if [[ "$G_DATE" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
          G_EPOCH="$(epoch_of "${G_DATE}T00:00:00Z")"
        fi
        if [[ -z "$G_EPOCH" ]]; then
          record warn "GitHub token ${G_ID}" "cannot parse recorded expiry '${G_DATE}' (want YYYY-MM-DD) — this token's expiry is unknown, not fine"
          continue
        fi
        G_LEFT=$(( G_EPOCH - GHT_NOW ))
        G_DAYS=$(( G_LEFT / 86400 ))
        if (( G_LEFT <= 0 )); then
          record warn "GitHub token ${G_ID} expired ${G_DATE}" "the recorded expiry has passed — if that date is right, the next repo this workload tries to create fails"
        elif (( G_LEFT < 7 * 86400 )); then
          record warn "GitHub token ${G_ID} expires ${G_DATE}" "${G_DAYS}d left — reissue now (fine-grained PAT, no key id: match it by name and expiry)"
        elif (( G_LEFT < 30 * 86400 )); then
          record warn "GitHub token ${G_ID} expires ${G_DATE}" "${G_DAYS}d left — schedule the reissue"
        else
          record ok "GitHub token ${G_ID} expires ${G_DATE} (${G_DAYS}d left)"
        fi
      done <<< "$GHT_HELD"
      record ok "GitHub token expiry measured: ${GHT_N} — ${GHT_CAVEAT}"
    fi

    echo "==> Compiling report"
    # 26. kubectl / API server version skew (ferry133/jg-base#130).
    #
    # Nobody was watching this number. Alpine v3.20's `kubectl` package is
    # 1.30.9 and jg-jiahd's API server was measured at v1.36.0 on 2026-09-22 —
    # six minors against a supported skew of ONE — and two workloads were
    # installing it that way with nothing in this repo, this report, or any
    # guard able to say so (k8scc-36 [1b52cd] found it; the Alpine number was
    # re-measured here from APKINDEX).
    #
    # ⚠️ The fix for those two sites MOVES this number rather than removing it:
    # the pre-baked image pins `ARG KUBECTL_VERSION` instead, which is correct
    # today and watched by nobody tomorrow. "Tomorrow" here is the next cluster
    # minor upgrade — a thing that certainly happens. A pinned version that was
    # right when it was written is the shape this fleet keeps relearning:
    # **a measurement expires, and an expired measurement still carries a
    # citation.**
    #
    # ⚠️ Asks the BINARY, not a manifest and not the image's own
    # ops-toolchain.json. That file is a record written by an execution at
    # build time, not an execution — replace the binary in a later layer and it
    # keeps reporting the old number while still reading exactly like a reading
    # (ferry133/k8scc#14, #17). The question here is "what is this container
    # about to run", and only `kubectl version` answers it.
    #
    # warn, never fail: exceeding the skew is "this will break", not "this is
    # broken", and FAIL_COUNT gates the dead-man — a red that flies every day
    # gets switched off (#6).
    if ! command -v kubectl >/dev/null 2>&1; then
      record skip "kubectl version skew" "kubectl is not on PATH in this image, so neither version could be read"
    elif ! SKEW_JSON=$(kubectl version -o json 2>/dev/null); then
      record skip "kubectl version skew" "kubectl could not reach the API server for its version (RBAC on /version, or the API is down) — the client version alone answers nothing"
    else
      SKEW_C=$(echo "$SKEW_JSON" | jq -r '.clientVersion.gitVersion // ""')
      SKEW_S=$(echo "$SKEW_JSON" | jq -r '.serverVersion.gitVersion // ""')
      # Both sides must parse. A missing serverVersion is what `kubectl version`
      # prints when it could not talk to the API but still exited 0.
      SKEW_CM=$(echo "$SKEW_C" | sed -n 's/^v\{0,1\}\([0-9]\{1,\}\)\.\([0-9]\{1,\}\).*/\1 \2/p')
      SKEW_SM=$(echo "$SKEW_S" | sed -n 's/^v\{0,1\}\([0-9]\{1,\}\)\.\([0-9]\{1,\}\).*/\1 \2/p')
      if [[ -z "$SKEW_CM" || -z "$SKEW_SM" ]]; then
        record skip "kubectl version skew" "could not read a major.minor from both sides (client='${SKEW_C:-<none>}', server='${SKEW_S:-<none>}')"
      else
        # `read` rather than ${x%% *} / ${x##* }: this file carries
        # `substitute: disabled` so Flux leaves it alone, but those forms are
        # unparseable to envsubst, and a row that only works while an
        # annotation happens to be present is a trap for whoever removes it.
        read -r SKEW_C_MAJ SKEW_C_MIN <<< "$SKEW_CM"
        read -r SKEW_S_MAJ SKEW_S_MIN <<< "$SKEW_SM"
        SKEW_DIFF=$(( (SKEW_C_MAJ * 100 + SKEW_C_MIN) - (SKEW_S_MAJ * 100 + SKEW_S_MIN) ))
        [[ $SKEW_DIFF -lt 0 ]] && SKEW_ABS=$(( -SKEW_DIFF )) || SKEW_ABS=$SKEW_DIFF
        if [[ $SKEW_ABS -le 1 ]]; then
          # Prints both numbers even when it passes: "compatible" without the
          # versions cannot be checked by the person reading the report, and
          # this row exists because a number went unwatched.
          record ok "kubectl version skew" "client ${SKEW_C}, server ${SKEW_S}"
        else
          record warn "kubectl version skew" "client ${SKEW_C} against server ${SKEW_S} — ${SKEW_ABS} minors apart, and Kubernetes supports one. Whatever pins this client (an image tag, an apk package, a Dockerfile ARG) was right when it was written and nothing has re-read it since"
        fi
      fi
    fi

    # 27. Cilium service backends vs EndpointSlice, per node (ferry133/jg-base#159).
    #
    # On 2026-10-14 jg-jiahd's `.21` Cilium agent held a THIRD kube-dns backend,
    # `10.244.14.1`, that no EndpointSlice had: a third of DNS from that node went
    # into a black hole for days (ferry133/jg-jiahd#5). Service, EndpointSlice,
    # Node and Pod all read healthy — the stale entry lived only in that agent's
    # BPF service map, so nothing that asks the API could see it. This row asks
    # each agent (`cilium-dbg service list -o json`) and compares every ClusterIP
    # service it holds with the API's ready endpoints.
    #
    # ⚠️ The population comes from the agent's own list, not from service names
    # anyone thought of: the same agent had 28 stale lines that day, not one.
    #
    # ⚠️ What this costs, chosen by ferry133 on #159 (2026-10-16): `pods/exec` in
    # kube-system for this ServiceAccount — `daily-check-cilium-exec` in rbac.yaml.
    # RBAC cannot pin the command; this row is the only caller and runs exactly
    # `cilium-dbg service list -o json`.
    #
    # A difference must hold across two reads ~10 s apart before it is reported:
    # the agent and the API are read at different instants, and a rollout in
    # between would otherwise be reported as drift (#6: a red that flies on a
    # healthy cluster gets switched off).
    #
    # Verdicts: a backend the API does not have → fail (that is the black hole);
    # only missing backends → warn (traffic still lands on a real pod); any node
    # not measured → skip, naming the node and why — unless another node already
    # failed, because red outranks "could not measure".
    cil_compare() {
      # $1 agent's service list, $2 EndpointSlice list, $3 node name
      jq -rn --slurpfile svc "$1" --slurpfile eps "$2" --arg node "$3" '
        ($eps[0].items // [])
          | map(select(.addressType != "FQDN" and ((.metadata.labels // {})["kubernetes.io/service-name"] // "") != "")) as $sl
        | [ $svc[0][] | .spec | select(.flags.type == "ClusterIP")
            | { k: "\(.flags.namespace)/\(.flags.name)",
                local: (.flags.intTrafficPolicy == "Local"),
                b: [ (.["backend-addresses"] // [])[] | select((.state // "active") == "active") | "\(.ip):\(.port)" ] } ]
        | group_by(.k)
        | map({ k: .[0].k, local: any(.[]; .local), have: (map(.b) | add | unique) })
        | map(. as $s
            | ($s.k | split("/")) as [$ns, $n]
            | [ $sl[] | select(.metadata.namespace == $ns and .metadata.labels["kubernetes.io/service-name"] == $n) ] as $mine
            | select($mine | length > 0)
            | [ $mine[] | . as $e | (.endpoints // [])[]
                | select(.conditions.ready != false)
                | select(($s.local | not) or .nodeName == $node)
                | .addresses[] as $a | ($e.ports // [])[] | select(.port != null) | "\($a):\(.port)" ] | unique
            | . as $want
            | { k: $s.k, extra: ($s.have - $want), missing: ($want - $s.have) })
        | (.[] | select((.extra | length) > 0 or (.missing | length) > 0)
               | "DRIFT|\(.k)|\(.extra | join(","))|\(.missing | join(","))"),
          "COMPARED|\(length)"'
    }
    # One node, one read: prints DRIFT lines then COMPARED|n, or a single
    # UNMEASURED|<reason> line. Never empty.
    cil_read() {
      local pod="$1" node="$2" svc eps out
      svc=$(mktemp); eps=$(mktemp)
      if ! kubectl -n kube-system exec "$pod" -c cilium-agent -- cilium-dbg service list -o json > "$svc" 2>/dev/null; then
        echo "UNMEASURED|exec into ${pod} failed (pods/exec RBAC, or cilium-dbg is not in the agent image)"
      elif ! jq -e 'type == "array"' "$svc" >/dev/null 2>&1; then
        echo "UNMEASURED|${pod} returned something that is not a JSON list (cilium-dbg output format changed?)"
      elif ! kubectl get endpointslices -A -o json > "$eps" 2>/dev/null; then
        echo "UNMEASURED|could not list EndpointSlices (RBAC on discovery.k8s.io/endpointslices)"
      elif ! out=$(cil_compare "$svc" "$eps" "$node") || ! grep -q '^COMPARED|' <<< "$out"; then
        echo "UNMEASURED|the comparison itself failed on ${pod}'s output"
      elif grep -q '^COMPARED|0$' <<< "$out"; then
        echo "UNMEASURED|${pod} listed no ClusterIP service that the API also has — nothing was compared"
      else
        echo "$out"
      fi
      rm -f "$svc" "$eps"
    }
    CIL_PODS=$(kubectl -n kube-system get pods -l k8s-app=cilium -o json 2>/dev/null \
      | jq -r '.items[] | select(.status.phase == "Running") | "\(.metadata.name) \(.spec.nodeName)"' 2>/dev/null)
    if [[ -z "$CIL_PODS" ]]; then
      record skip "Cilium backends vs EndpointSlice" "no running Cilium agent pod (k8s-app=cilium in kube-system) could be listed"
    else
      CIL_FAIL=(); CIL_WARN=(); CIL_SKIP=(); CIL_OK=()
      while read -r CIL_POD CIL_NODE; do
        CIL_R1=$(cil_read "$CIL_POD" "$CIL_NODE")
        if grep -q '^UNMEASURED|' <<< "$CIL_R1"; then
          CIL_SKIP+=("${CIL_NODE}: $(grep '^UNMEASURED|' <<< "$CIL_R1" | cut -d'|' -f2-)")
          continue
        fi
        if grep -q '^DRIFT|' <<< "$CIL_R1"; then
          sleep 10
          CIL_R2=$(cil_read "$CIL_POD" "$CIL_NODE")
          if grep -q '^UNMEASURED|' <<< "$CIL_R2"; then
            CIL_SKIP+=("${CIL_NODE}: differed on the first read, then $(grep '^UNMEASURED|' <<< "$CIL_R2" | cut -d'|' -f2-)")
            continue
          fi
          # Keep only services that differed in BOTH reads; report the second.
          CIL_KEYS1=$(grep '^DRIFT|' <<< "$CIL_R1" | cut -d'|' -f2)
          CIL_HELD=$(grep '^DRIFT|' <<< "$CIL_R2" | while IFS='|' read -r _ k x m; do
            grep -qxF "$k" <<< "$CIL_KEYS1" && echo "${k} extra=[${x}] missing=[${m}]"; done)
        else
          CIL_HELD=""
        fi
        CIL_N=$(grep '^COMPARED|' <<< "${CIL_R2:-$CIL_R1}" | cut -d'|' -f2)
        if [[ -z "$CIL_HELD" ]]; then
          CIL_OK+=("${CIL_NODE} ${CIL_N}")
        elif grep -q 'extra=\[[^]]' <<< "$CIL_HELD"; then
          CIL_FAIL+=("${CIL_NODE}: $(tr '\n' ';' <<< "$CIL_HELD")")
        else
          CIL_WARN+=("${CIL_NODE}: $(tr '\n' ';' <<< "$CIL_HELD")")
        fi
        unset CIL_R2
      done <<< "$CIL_PODS"
      # Plain concatenation rather than a nested conditional expansion: envsubst
      # cannot parse the nested form even in a comment (scripts/check-envsubst-parses.sh).
      CIL_ALSO=""
      [[ ${#CIL_WARN[@]} -gt 0 ]] && CIL_ALSO="${CIL_ALSO} | missing backends: ${CIL_WARN[*]}"
      [[ ${#CIL_SKIP[@]} -gt 0 ]] && CIL_ALSO="${CIL_ALSO} | not measured: ${CIL_SKIP[*]}"
      if [[ ${#CIL_FAIL[@]} -gt 0 ]]; then
        record fail "Cilium backends vs EndpointSlice" "a node's Cilium agent routes to backends the API does not have (traffic to them is dropped): ${CIL_FAIL[*]}${CIL_ALSO}"
      elif [[ ${#CIL_SKIP[@]} -gt 0 ]]; then
        record skip "Cilium backends vs EndpointSlice" "could not compare every node${CIL_ALSO}"
      elif [[ ${#CIL_WARN[@]} -gt 0 ]]; then
        record warn "Cilium backends vs EndpointSlice" "an agent lacks ready backends the API has (held across two reads): ${CIL_WARN[*]}"
      else
        record ok "Cilium backends vs EndpointSlice" "${#CIL_OK[@]} node(s) agree with the API — services compared per node: ${CIL_OK[*]}"
      fi
    fi

    # 28. Tenant isolation invariants (ferry133/jg-base#192 follow-on; fleet-ops
    # root `standalone-app-repos` 2.3, sub-change tenant-isolation-baseline §4).
    #
    # A tenant is a namespace labelled `jg.tenant` whose objects Flux applies as
    # ServiceAccount `flux-system/tenant-<name>`, bound to ClusterRole
    # `tenant-admin` there and nowhere else. Admission and RBAC enforce that at
    # write time; this row re-reads the result every day, because the things
    # that would undo it are written by the platform side, not the tenant (a
    # hand-applied binding, a relabelled namespace) and nothing else re-reads
    # them.
    #
    # STRUCTURE, not impersonation (decision D-b): `kubectl auth can-i --as`
    # answers about the caller under Omni's proxy (measured 2026-09), and giving
    # this Job `impersonate` would itself be the escalation it looks for. Four
    # kinds are read: ClusterRoleBindings, RoleBindings, Namespaces, PVCs.
    #
    #   fail  a ClusterRoleBinding names a tenant SA; a RoleBinding naming a
    #         tenant SA points anywhere but tenant-admin; a tenant namespace
    #         binds admin/edit/cluster-admin; a tenant namespace has no PSA
    #         enforce label; or is `privileged` WITHOUT jg.tenant-privileged=
    #         granted (a host_network grant renders both; the tenant cannot write
    #         either, so one without the other is drift).
    #   warn  a tenant namespace holds PVCs: tenant data is outside the off-site
    #         backup by design (D-c) — visible, not red every day.
    #   ok    lists the tenants, and names those privileged BY GRANT, every day,
    #         without raising anything (D-e: a check that fires daily is muted).
    #   skip  no tenant namespaces; or a read this row needs was refused — an
    #         unreadable answer is not an `ok` (no RBAC read permission).
    TEN_NS_JSON=$(kubectl get namespaces -l jg.tenant -o json 2>/dev/null) || TEN_NS_JSON=""
    if [[ -z "$TEN_NS_JSON" ]]; then
      record skip "Tenant isolation" "namespaces could not be listed"
    elif [[ $(echo "$TEN_NS_JSON" | jq '.items | length') -eq 0 ]]; then
      record skip "Tenant isolation" "no tenants declared (no namespace labelled jg.tenant)"
    elif ! TEN_CRB=$(kubectl get clusterrolebindings -o json 2>/dev/null) \
      || ! TEN_RB=$(kubectl get rolebindings -A -o json 2>/dev/null); then
      record skip "Tenant isolation" "no RBAC read permission (clusterrolebindings/rolebindings could not be listed) — not measured, which is not the same as clean"
    elif ! TEN_PVC=$(kubectl get persistentvolumeclaims -A -o json 2>/dev/null); then
      record skip "Tenant isolation" "persistentvolumeclaims could not be listed"
    else
      # Space-joined with no trailing space; the membership tests below wrap it
      # in spaces and bind the object's namespace FIRST (`as $n`): inside
      # `$ns | contains(...)` the dot is already $ns, and the first version
      # compared the list with itself, so no tenant namespace ever matched.
      # No ${x% } trimming: this file is `substitute: disabled`, but
      # a row that only parses while that annotation is present is a trap (26).
      TEN_NAMES=$(echo "$TEN_NS_JSON" | jq -r '[.items[].metadata.name] | sort | join(" ")')
      TEN_FAIL=()
      # Subjects that are tenant ServiceAccounts: flux-system/tenant-*.
      TEN_IS_SA='(.subjects // []) | map(select(.kind == "ServiceAccount" and .namespace == "flux-system" and (.name | startswith("tenant-")))) | length > 0'
      while IFS= read -r l; do [[ -n "$l" ]] && TEN_FAIL+=("$l"); done < <(
        echo "$TEN_CRB" | jq -r ".items[] | select($TEN_IS_SA) | \"ClusterRoleBinding \(.metadata.name) names a tenant ServiceAccount\"")
      while IFS= read -r l; do [[ -n "$l" ]] && TEN_FAIL+=("$l"); done < <(
        echo "$TEN_RB" | jq -r ".items[] | select($TEN_IS_SA) | select(.roleRef.kind != \"ClusterRole\" or .roleRef.name != \"tenant-admin\") | \"RoleBinding \(.metadata.namespace)/\(.metadata.name) binds a tenant ServiceAccount to \(.roleRef.kind) \(.roleRef.name), not tenant-admin\"")
      while IFS= read -r l; do [[ -n "$l" ]] && TEN_FAIL+=("$l"); done < <(
        echo "$TEN_RB" | jq -r --arg ns " $TEN_NAMES " '.items[] | .metadata.namespace as $n | select($ns | contains(" " + $n + " ")) | select(.roleRef.kind == "ClusterRole" and (.roleRef.name == "admin" or .roleRef.name == "edit" or .roleRef.name == "cluster-admin")) | "RoleBinding \(.metadata.namespace)/\(.metadata.name) binds ClusterRole \(.roleRef.name) in a tenant namespace"')
      while IFS= read -r l; do [[ -n "$l" ]] && TEN_FAIL+=("$l"); done < <(
        echo "$TEN_NS_JSON" | jq -r '.items[] | .metadata as $m | ($m.labels["pod-security.kubernetes.io/enforce"] // "") as $lvl |
          if $lvl == "" then "namespace \($m.name) has no pod-security enforce label"
          elif $lvl == "privileged" and ($m.labels["jg.tenant-privileged"] // "") != "granted" then "namespace \($m.name) is privileged without jg.tenant-privileged=granted"
          else empty end')
      TEN_GRANTED=$(echo "$TEN_NS_JSON" | jq -r '[.items[] | select(.metadata.labels["pod-security.kubernetes.io/enforce"] == "privileged" and .metadata.labels["jg.tenant-privileged"] == "granted") | .metadata.name] | join(", ")')
      TEN_PVCS=$(echo "$TEN_PVC" | jq -r --arg ns " $TEN_NAMES " '[.items[] | .metadata.namespace as $n | select($ns | contains(" " + $n + " ")) | "\(.metadata.namespace)/\(.metadata.name)"] | join(", ")')
      TEN_COUNT=$(echo "$TEN_NS_JSON" | jq '.items | length')
      TEN_PRIV=""
      [[ -n "$TEN_GRANTED" ]] && TEN_PRIV="; privileged by grant: ${TEN_GRANTED}"
      if [[ ${#TEN_FAIL[@]} -gt 0 ]]; then
        record fail "Tenant isolation" "$(printf '%s; ' "${TEN_FAIL[@]}")${TEN_COUNT} tenant namespace(s): ${TEN_NAMES}"
      elif [[ -n "$TEN_PVCS" ]]; then
        record warn "Tenant isolation" "tenant PVCs are not in the off-site backup: ${TEN_PVCS}${TEN_PRIV}"
      else
        record ok "Tenant isolation" "${TEN_COUNT} tenant namespace(s): ${TEN_NAMES}; bindings only to tenant-admin, PSA labelled${TEN_PRIV}"
      fi
    fi

    # 29. Envoy proxies connected to xDS (ferry133/jg-base#199, from #193).
    #
    # A proxy that loses its xDS stream keeps serving the last configuration it
    # had — so it reads healthy until a backend pod changes, and then that route
    # sends traffic to an address nobody holds. On jg-jiahd every proxy older
    # than a 2026-10-15 control-plane restart stopped getting a fresh projected
    # token (Talos v1.13.2, siderolabs/talos#13352), failed xDS auth from
    # 2026-10-17 09:46Z, and nothing said so for ~27 h — until a linebot rollout
    # broke `linebot.jiahd.cc` (#193).
    #
    # The reading is Envoy's own gauge, `envoy_control_plane_connected_state`,
    # from each proxy's Prometheus port (the container port named `metrics`;
    # 19001 on Envoy Gateway today), over the pod IP. The admin port (19000)
    # listens on loopback only, and the envoy image has no curl/wget to exec.
    # Measured on 2026-10-19 against jg-jiahd: 0 on the four stuck proxies, 1 on
    # the rest — the same values the admin /stats reported.
    #
    # The population is every pod labelled
    # app.kubernetes.io/managed-by=envoy-gateway in any namespace (jg-jiahd has
    # them in `network` and `mqtt`, jcom also in `omni`), not a list of gateway
    # names: #193 found the two mqtt proxies stuck that the issue never named.
    #
    # A 0 must hold across two reads ~10 s apart: a proxy reconnecting at the
    # moment of the read is not an outage. Verdicts: any proxy held at 0 → fail;
    # any proxy unreadable → skip naming it, unless another already failed (red
    # outranks "could not measure"); no proxies → skip.
    evx_read() {  # $1 pod IP, $2 metrics port → 0 | 1 | UNMEASURED|<reason>
      local body val
      if ! body=$(curl -s -m 5 "http://$1:$2/stats/prometheus" 2>/dev/null) || [[ -z "$body" ]]; then
        echo "UNMEASURED|metrics port $2 did not answer"
        return
      fi
      val=$(awk '$1 == "envoy_control_plane_connected_state" || $1 == "envoy_control_plane_connected_state{}" { print $2; exit }' <<< "$body")
      case "$val" in
        0|1) echo "$val" ;;
        "")  echo "UNMEASURED|no envoy_control_plane_connected_state in /stats/prometheus" ;;
        *)   echo "UNMEASURED|envoy_control_plane_connected_state is '${val}', neither 0 nor 1" ;;
      esac
    }
    if ! EVX_JSON=$(kubectl get pods -A -l app.kubernetes.io/managed-by=envoy-gateway -o json 2>/dev/null); then
      record skip "Envoy xDS connection" "pods labelled app.kubernetes.io/managed-by=envoy-gateway could not be listed"
    else
      # ns/name ip port — port is "-" when the pod declares no `metrics` port.
      EVX_PODS=$(jq -r '.items[] | select(.status.phase == "Running" and (.status.podIP // "") != "")
        | "\(.metadata.namespace)/\(.metadata.name) \(.status.podIP) \(([.spec.containers[].ports // [] | .[] | select(.name == "metrics") | .containerPort] | first) // "-")"' <<< "$EVX_JSON")
      if [[ -z "$EVX_PODS" ]]; then
        record skip "Envoy xDS connection" "no running Envoy Gateway proxy pods"
      else
        EVX_DOWN=(); EVX_SKIP=(); EVX_UP=0; EVX_RECHECK=""
        while read -r EVX_POD EVX_IP EVX_PORT; do
          if [[ "$EVX_PORT" == "-" ]]; then
            EVX_SKIP+=("${EVX_POD}: declares no container port named metrics")
            continue
          fi
          EVX_V=$(evx_read "$EVX_IP" "$EVX_PORT")
          case "$EVX_V" in
            1) ((EVX_UP++)) ;;
            0) EVX_RECHECK="${EVX_RECHECK}${EVX_POD} ${EVX_IP} ${EVX_PORT}"$'\n' ;;
            *) EVX_SKIP+=("${EVX_POD}: ${EVX_V#UNMEASURED|}") ;;
          esac
        done <<< "$EVX_PODS"
        if [[ -n "$EVX_RECHECK" ]]; then
          sleep 10
          while read -r EVX_POD EVX_IP EVX_PORT; do
            [[ -n "$EVX_POD" ]] || continue
            EVX_V=$(evx_read "$EVX_IP" "$EVX_PORT")
            case "$EVX_V" in
              1) ((EVX_UP++)) ;;
              0) EVX_DOWN+=("$EVX_POD") ;;
              *) EVX_SKIP+=("${EVX_POD}: read 0, then ${EVX_V#UNMEASURED|}") ;;
            esac
          done <<< "$EVX_RECHECK"
        fi
        EVX_ALSO=""
        [[ ${#EVX_SKIP[@]} -gt 0 ]] && EVX_ALSO=" | not measured: $(printf '%s; ' "${EVX_SKIP[@]}")"
        if [[ ${#EVX_DOWN[@]} -gt 0 ]]; then
          record fail "Envoy xDS connection" "proxies disconnected from Envoy Gateway (serving frozen config; restart them, then find why — #193): ${EVX_DOWN[*]}${EVX_ALSO}"
        elif [[ ${#EVX_SKIP[@]} -gt 0 ]]; then
          record skip "Envoy xDS connection" "${EVX_UP} connected, could not read the rest${EVX_ALSO}"
        else
          record ok "Envoy xDS connection" "${EVX_UP} proxy pod(s) connected"
        fi
      fi
    fi

    # 30. Tenant route admission, by behaviour (ferry133/jg-base#205).
    #
    # Row 28 reads the tenant bounds as structure; it cannot see whether the
    # hostname policy (#191, tenant-admission/hostname-policy.yaml) still ADMITS.
    # On jg-jcc2 (2026-10-21, fleet-ops-96) kube-apiserver's param informer for
    # the ConfigMap paramKind stopped resolving: every tenant HTTPRoute was
    # refused, compliant ones included, with "failed to configure binding: no
    # params found", while the param ConfigMap was there all along. That is
    # fail-closed for every tenant route, and only a write shows it.
    #
    # So this row writes, server-side dry-run only, as one tenant namespace
    # (the first by name):
    #   compliant  probe.<tenant>.<domain>   must be ACCEPTED
    #   outside    probe.<domain>            must be REFUSED by this policy
    # The second is the control: an accepted compliant probe also reads the same
    # when the policy is absent or not evaluating, and that is a fail too.
    # The create grant is bounded to dry-run by the daily-check-dry-run-only
    # policy (tenant-admission/), since RBAC cannot express "dry-run only".
    #
    #   fail  the compliant probe was refused by the policy ("no params found":
    #         restart kube-apiserver on EVERY control-plane node — recreating
    #         the policy, binding or ConfigMap was measured not to help); or the
    #         outside probe was admitted (the bound is not enforced).
    #   skip  no tenants; SECRET_DOMAIN unset; the create was refused by RBAC or
    #         failed for another reason (an error is not an `ok`).
    #   ok    both probes answered as expected; names the tenant probed.
    TRA_NAME="Tenant route admission"
    TRA_NS_JSON=$(kubectl get namespaces -l jg.tenant -o json 2>/dev/null) || TRA_NS_JSON=""
    if [[ -z "$TRA_NS_JSON" ]]; then
      record skip "$TRA_NAME" "namespaces could not be listed"
    elif [[ $(echo "$TRA_NS_JSON" | jq '.items | length') -eq 0 ]]; then
      record skip "$TRA_NAME" "no tenants declared (no namespace labelled jg.tenant)"
    elif [[ -z "${SECRET_DOMAIN:-}" ]]; then
      record skip "$TRA_NAME" "SECRET_DOMAIN is unset, so no compliant hostname can be built"
    else
      # Two jq reads, not one string split by a trimming expansion: row 28 says why this
      # file avoids trimming expansions (scripts/check-envsubst-parses.sh).
      TRA_FIRST='[.items[]] | sort_by(.metadata.name) | .[0]'
      TRA_NS=$(echo "$TRA_NS_JSON" | jq -r "$TRA_FIRST | .metadata.name")
      TRA_TENANT=$(echo "$TRA_NS_JSON" | jq -r "$TRA_FIRST | .metadata.labels[\"jg.tenant\"]")
      # $1 hostname. Prints kubectl's combined output; returns its exit code.
      tra_probe() {
        printf '{"apiVersion":"gateway.networking.k8s.io/v1","kind":"HTTPRoute","metadata":{"generateName":"daily-check-probe-","namespace":"%s"},"spec":{"hostnames":["%s"]}}' "$TRA_NS" "$1" \
          | kubectl create --dry-run=server -o name -f - 2>&1
      }
      TRA_GOOD_HOST="probe.${TRA_TENANT}.${SECRET_DOMAIN}"
      TRA_BAD_HOST="probe.${SECRET_DOMAIN}"
      TRA_GOOD=$(tra_probe "$TRA_GOOD_HOST"); TRA_GOOD_RC=$?
      TRA_BAD=$(tra_probe "$TRA_BAD_HOST"); TRA_BAD_RC=$?
      TRA_GOOD_LINE=$(echo "$TRA_GOOD" | head -1)
      TRA_BAD_LINE=$(echo "$TRA_BAD" | head -1)
      if [[ $TRA_GOOD_RC -ne 0 ]] && grep -q "no params found" <<<"$TRA_GOOD"; then
        record fail "$TRA_NAME" "a compliant route ($TRA_GOOD_HOST in $TRA_NS) was refused: the hostname policy cannot resolve its parameter, so EVERY tenant route is refused. Recovery: restart kube-apiserver on every control-plane node; do not recreate the policy (#205). Server said: $TRA_GOOD_LINE"
      elif [[ $TRA_GOOD_RC -ne 0 ]] && grep -q "tenant-httproute-hostnames" <<<"$TRA_GOOD"; then
        record fail "$TRA_NAME" "a compliant route ($TRA_GOOD_HOST in $TRA_NS) was refused by the hostname policy: $TRA_GOOD_LINE"
      elif [[ $TRA_GOOD_RC -ne 0 ]] && grep -q "cannot create resource" <<<"$TRA_GOOD"; then
        record skip "$TRA_NAME" "no RBAC permission to dry-run create httproutes in $TRA_NS — not measured, which is not the same as clean"
      elif [[ $TRA_GOOD_RC -ne 0 ]]; then
        record skip "$TRA_NAME" "the compliant probe failed for a reason that is not the policy: $TRA_GOOD_LINE"
      elif [[ $TRA_BAD_RC -eq 0 ]]; then
        record fail "$TRA_NAME" "a route outside the tenant's suffix ($TRA_BAD_HOST in $TRA_NS) was admitted: the hostname policy is not enforcing"
      elif ! grep -q "tenant-httproute-hostnames" <<<"$TRA_BAD"; then
        record skip "$TRA_NAME" "compliant probe accepted, but the outside probe failed for a reason that is not the policy, so enforcement was not shown: $TRA_BAD_LINE"
      else
        record ok "$TRA_NAME" "in $TRA_NS: $TRA_GOOD_HOST accepted, $TRA_BAD_HOST refused by the hostname policy (server dry-run)"
      fi
    fi

    # 31. netdev-mcp sidecar (ferry133/jg-base#222; fleet-ops root
    # `im-unifi-management` D4, D6).
    #
    # The sidecar exists only where im runs the im/netdev overlay (a UniFi
    # console is recorded). It prints its readings ONCE, at start, to stderr, each
    # line prefixed `netdev-mcp: `; stdout is only the audit stream, one JSON line
    # per write phase. `kubectl logs` interleaves both. Strings are k8scc's, read
    # from netdev_mcp_server.py `_startup_readings` / `_audit` at k8scc f5861a2.
    #
    # So everything here except the audit counts is as of the container's START,
    # and the row says when that was. The 24 h audit window is only as long as
    # the current container has lived: an earlier container's lines are gone, and
    # the row says so rather than reporting zero.
    #
    # Controller version change: the sidecar reads it once per start, so a change
    # can only show after a restart. The last version seen is kept in ConfigMap
    # monitoring/daily-check-state (the row's only write; see rbac.yaml). A change
    # is warned ONCE, on the run that first sees it, and becomes the new baseline.
    #
    #   fail  sidecar declared but not running; reader credential missing; the
    #         controller version unreadable (the reader cannot reach it, D4);
    #         any `revert-failed` audit line in the window (D6).
    #   warn  controller version changed or not reported; baseline unreadable or
    #         unwritable (then the change was not judged); an operator credential
    #         mounted but `empty`/`invalid` — writes were intended and are
    #         silently absent, which must not read like reader-only.
    #   skip  no im; no netdev-mcp container (no console here); logs unreadable;
    #         startup readings no longer in the log.
    #   ok    names the version, the operator state (an absent operator is
    #         reader-only, which is a legitimate state), whether write tools are
    #         registered, the window's phase counts, and how many tokens went
    #         ahead with fac_witness unmeasured.
    ND_NAME="netdev-mcp sidecar"
    ND_DEPLOY=$(kubectl -n claudecode get deploy im -o json 2>/dev/null) || ND_DEPLOY=""
    if [[ -z "$ND_DEPLOY" ]]; then
      record skip "$ND_NAME" "no im deployment — nothing measured"
    elif ! echo "$ND_DEPLOY" | jq -e '.spec.template.spec.containers[] | select(.name == "netdev-mcp")' >/dev/null 2>&1; then
      record skip "$ND_NAME" "im has no netdev-mcp container (no UniFi console recorded for this cluster)"
    else
      ND_SEL=$(echo "$ND_DEPLOY" | jq -r '.spec.selector.matchLabels | to_entries | map("\(.key)=\(.value)") | join(",")')
      ND_PODS=$(kubectl -n claudecode get pods -l "$ND_SEL" -o json 2>/dev/null) || ND_PODS=""
      # The newest pod whose netdev-mcp container is running.
      ND_RUN='[.items[] | {pod: .metadata.name, c: ((.status.containerStatuses // [])[] | select(.name == "netdev-mcp" and .state.running != null))}] | sort_by(.c.state.running.startedAt) | last'
      ND_POD=$(echo "$ND_PODS" | jq -r "($ND_RUN) // {} | .pod // empty" 2>/dev/null)
      ND_STARTED=$(echo "$ND_PODS" | jq -r "($ND_RUN) // {} | .c.state.running.startedAt // empty" 2>/dev/null)
      if [[ -z "$ND_PODS" ]]; then
        record skip "$ND_NAME" "im pods could not be listed"
      elif [[ -z "$ND_POD" ]]; then
        record fail "$ND_NAME" "im declares a netdev-mcp container but none is running — the UniFi reader is down"
      elif ! ND_LOG=$(kubectl -n claudecode logs "$ND_POD" -c netdev-mcp 2>&1); then
        if grep -qi "forbidden" <<<"$ND_LOG"; then
          record skip "$ND_NAME" "no RBAC permission to read pods/log in claudecode — not measured, which is not the same as clean"
        else
          record skip "$ND_NAME" "logs of ${ND_POD}/netdev-mcp unreadable: $(echo "$ND_LOG" | head -1)"
        fi
      elif ! grep -q '^netdev-mcp: reader credential: ' <<<"$ND_LOG"; then
        record skip "$ND_NAME" "${ND_POD}/netdev-mcp started ${ND_STARTED}, and its startup readings are no longer in the log (rotated) — not measured"
      else
        nd_reading() { sed -n "s/^netdev-mcp: $1: //p" <<<"$ND_LOG" | tail -1; }
        ND_READER=$(nd_reading "reader credential")
        ND_VERSION=$(nd_reading "controller version")
        ND_OPERATOR=$(nd_reading "operator credential")
        ND_WRITES=$(nd_reading "write tools")
        ND_NOW=$(date -u +%s)
        # `-d @epoch` is the spelling busybox and GNU share. If it fails the
        # cutoff is empty, every line compares >= "", and the window is the
        # whole log: said below, never passed off as 24 h.
        ND_CUTOFF=$(date -u -d "@$(( ND_NOW - 86400 ))" +%Y-%m-%dT%H:%M:%S+00:00 2>/dev/null) || ND_CUTOFF=""
        ND_AUDIT=$(grep '^{' <<<"$ND_LOG" | jq -c --arg c "$ND_CUTOFF" 'select(type == "object" and (.phase | type) == "string" and (.ts | type) == "string" and .ts >= $c)' 2>/dev/null)
        ND_PHASES=$(echo "$ND_AUDIT" | jq -rs 'group_by(.phase) | map("\(.[0].phase) \(length)") | join(", ")')
        ND_REVERT_FAILED=$(echo "$ND_AUDIT" | jq -s '[.[] | select(.phase == "revert-failed")] | length')
        ND_TOKENS=$(echo "$ND_AUDIT" | jq -s '[.[] | select(.phase == "token")] | length')
        ND_UNWITNESSED=$(echo "$ND_AUDIT" | jq -s '[.[] | select(.phase == "token" and .fac_witness == "unmeasured")] | length')
        ND_START_EPOCH=$(epoch_of "$ND_STARTED")
        ND_WINDOW="last 24 h"
        if [[ -z "$ND_CUTOFF" ]]; then
          ND_WINDOW="whole current log (date could not compute the 24 h cutoff)"
        elif [[ -n "$ND_START_EPOCH" ]] && (( ND_START_EPOCH > ND_NOW - 86400 )); then
          ND_WINDOW="since ${ND_STARTED} only (earlier containers' lines are gone)"
        fi
        ND_AUDIT_TEXT="audit ${ND_WINDOW}: ${ND_PHASES:-no write phases}; fac_witness unmeasured on ${ND_UNWITNESSED}/${ND_TOKENS} token(s)"
        ND_AT="read at sidecar start ${ND_STARTED}"
        # Baseline: unreadable is not the same as absent, so they are read apart.
        ND_STATE=$(kubectl -n monitoring get configmap daily-check-state -o json 2>/dev/null) || ND_STATE=""
        ND_BASE=$(echo "$ND_STATE" | jq -r '.data["netdev-controller-version"] // empty' 2>/dev/null)
        # The two ok exits go through here: `absent` is reader-only and fine,
        # `empty (…)` / `invalid (…)` is a credential someone mounted that does
        # not work (k8scc-c7 on #238). The baseline still moves on that run.
        nd_ok() {
          if grep -qE '^(empty|invalid)' <<<"$ND_OPERATOR"; then
            record warn "$ND_NAME" "operator credential ${ND_OPERATOR} — mounted but unusable, so the write tools are not registered; $1"
          else
            record ok "$ND_NAME" "$1"
          fi
        }
        if [[ "$ND_READER" != "ok" ]]; then
          record fail "$ND_NAME" "reader credential ${ND_READER} (${ND_AT}) — populate the UniFi values (fleet-ops skill unifi-im-credential) and restart im"
        elif [[ -z "$ND_VERSION" ]]; then
          record fail "$ND_NAME" "no controller version reading (${ND_AT}) — the reader never reached the controller"
        elif [[ "$ND_VERSION" == unreadable* ]]; then
          record fail "$ND_NAME" "controller version ${ND_VERSION} (${ND_AT}) — the reader cannot reach the controller"
        elif (( ND_REVERT_FAILED > 0 )); then
          record fail "$ND_NAME" "${ND_REVERT_FAILED} revert-failed write(s) — a LAN change was not undone; read the ticket and kubectl logs -c netdev-mcp. ${ND_AUDIT_TEXT}"
        elif [[ "$ND_VERSION" == "not reported" ]]; then
          record warn "$ND_NAME" "the controller answered without a version (${ND_AT}); change not judged. ${ND_AUDIT_TEXT}"
        elif [[ -z "$ND_STATE" ]]; then
          record warn "$ND_NAME" "controller ${ND_VERSION}, but baseline ConfigMap monitoring/daily-check-state is unreadable — version change not judged. ${ND_AUDIT_TEXT}"
        elif [[ -n "$ND_BASE" && "$ND_BASE" == "$ND_VERSION" ]]; then
          nd_ok "controller ${ND_VERSION} (unchanged; ${ND_AT}); operator ${ND_OPERATOR:-<no reading>}; write tools ${ND_WRITES:-<no reading>}; ${ND_AUDIT_TEXT}"
        elif ! kubectl -n monitoring patch configmap daily-check-state --type=merge --field-manager=daily-check \
              -p "$(jq -nc --arg v "$ND_VERSION" '{data: {"netdev-controller-version": $v}}')" >/dev/null 2>&1; then
          record warn "$ND_NAME" "controller ${ND_VERSION} (baseline ${ND_BASE:-none}), and the baseline could not be written — this change will be judged again tomorrow. ${ND_AUDIT_TEXT}"
        elif [[ -n "$ND_BASE" ]]; then
          record warn "$ND_NAME" "controller version changed: ${ND_BASE} → ${ND_VERSION} (${ND_AT}); now the baseline, so this warns once. ${ND_AUDIT_TEXT}"
        else
          nd_ok "controller ${ND_VERSION} (first reading, recorded as baseline; ${ND_AT}); operator ${ND_OPERATOR:-<no reading>}; write tools ${ND_WRITES:-<no reading>}; ${ND_AUDIT_TEXT}"
        fi
      fi
    fi

    if [[ $FAIL_COUNT -gt 0 ]]; then
      STATUS_TAG="❌ ${FAIL_COUNT} FAIL"
      [[ $WARN_COUNT -gt 0 ]] && STATUS_TAG="${STATUS_TAG}, ${WARN_COUNT} WARN"
    elif [[ $WARN_COUNT -gt 0 ]]; then
      STATUS_TAG="⚠️ ${WARN_COUNT} WARN"
    else
      STATUS_TAG="✅ OK"
    fi
    SUBJECT="[${CLUSTER_NAME}] Daily Health Check — ${DATE_LOCAL%% *} ${STATUS_TAG}"

    BODY_FILE=$(mktemp)
    {
      echo "From: ${SMTP_FROM}"
      echo "To: ${NOTIFY_EMAIL_TO}"
      echo "Subject: ${SUBJECT}"
      echo "Content-Type: text/plain; charset=UTF-8"
      echo "MIME-Version: 1.0"
      echo ""
      echo "Cluster:  ${CLUSTER_NAME}"
      echo "Time:     ${DATE_LOCAL}"
      echo "Result:   ${STATUS_TAG}"
      echo "Counts:   ${FAIL_COUNT} FAIL, ${WARN_COUNT} WARN, ${SKIP_COUNT} NOT MEASURED, $((${#SUMMARY[@]} - FAIL_COUNT - WARN_COUNT - SKIP_COUNT)) OK"
      echo
      echo "=== Summary ==="
      for line in "${SUMMARY[@]}"; do
        echo "  $line"
      done
      if [[ ${#DETAILS[@]} -gt 0 ]]; then
        echo
        echo "=== Issue Details ==="
        for line in "${DETAILS[@]}"; do
          echo "  $line"
        done
      fi
      echo
      echo "-- "
      echo "daily-check from cluster ${CLUSTER_NAME}"
    } > "$BODY_FILE"

    echo "==> Summary"
    for line in "${SUMMARY[@]}"; do
      echo "  $line"
    done
    if [[ ${#DETAILS[@]} -gt 0 ]]; then
      echo "==> Details"
      for line in "${DETAILS[@]}"; do
        echo "  $line"
      done
    fi

    echo "==> Sending email to ${NOTIFY_EMAIL_TO}"
    IFS=',' read -ra RECIPIENTS <<< "$NOTIFY_EMAIL_TO"
    MAIL_ERR_FILE=$(mktemp)
    if msmtp --file=/tmp/msmtp/msmtprc "${RECIPIENTS[@]/#/ }" < "$BODY_FILE" 2>"$MAIL_ERR_FILE"; then
      MAIL_DELIVERED=1
      echo "Email sent successfully."
    else
      # Until 2026-09-19 this was the whole handling: one line on stderr, then
      # the run carried on to send a SUCCESS dead-man ping and exit 0. On the
      # day the mail broke, every outside channel said the cluster was fine
      # (#114). The mailer's own words are kept because "msmtp returned
      # non-zero" alone cannot separate an expired app password from a blocked
      # egress, and the report that would have explained it is the thing that
      # did not arrive.
      # Set here and not only at the top with the counters: the send block is
      # then self-sufficient, so neither a future reorder nor a deleted
      # initialiser can leave this unbound under `set -u` — which would abort
      # the run before the /fail ping, i.e. lose the channel this fix exists to
      # add, and do it by crashing rather than by saying anything.
      MAIL_DELIVERED=0
      MAIL_ERR_MSG=$(tr '\n' ' ' <"$MAIL_ERR_FILE" | cut -c1-300)
      echo "ERROR: msmtp returned non-zero, the report was NOT delivered: ${MAIL_ERR_MSG:-no stderr}" >&2
    fi
    rm -f "$MAIL_ERR_FILE"

    echo "==> Pinging healthchecks.io"
    # An undelivered report pings /fail even when every row passed. The ping is
    # the only channel left once the mail is gone, so it must not say "fine"
    # about a run whose verdict nobody received (#114). This does NOT touch
    # FAIL_COUNT: the two reasons stay separable in the log, and a mailer
    # outage never inflates the cluster's own failure count.
    if [[ -n "$HEALTHCHECKS_PING_URL" ]]; then
      if [[ $MAIL_DELIVERED -eq 0 ]]; then
        curl -fsS -m 10 --retry 3 "${HEALTHCHECKS_PING_URL}/fail" -o /dev/null \
          && echo "Pinged /fail (report undelivered)" || echo "Ping to /fail failed" >&2
      elif [[ $FAIL_COUNT -gt 0 ]]; then
        curl -fsS -m 10 --retry 3 "${HEALTHCHECKS_PING_URL}/fail" -o /dev/null && echo "Pinged /fail" || echo "Ping to /fail failed" >&2
      else
        curl -fsS -m 10 --retry 3 "${HEALTHCHECKS_PING_URL}" -o /dev/null && echo "Ping OK" || echo "Ping failed" >&2
      fi
    else
      # ⚠️ The combination FO-handler [f92b04] named on #114: SMTP configured,
      # ping URL not. The five daily_check_* fields are set together by
      # convention, never by the template — `default('')` does not bind them —
      # so this state is reachable, and in it the dead-man cannot speak. The
      # exit status below is what covers it, and that is why the two mechanisms
      # must not share a premise: this one needs a ping URL, that one needs
      # nothing.
      echo "HEALTHCHECKS_PING_URL not set, skipping ping"
    fi

    echo "==> Done. Exit FAIL_COUNT=${FAIL_COUNT} MAIL_DELIVERED=${MAIL_DELIVERED}"
    # The exit status answers one question and not the cluster's health: did
    # this run get its result to somewhere a person can see?
    #
    #   78  EX_CONFIG    never configured, so no channel exists at all (#112)
    #   75  EX_TEMPFAIL  configured, ran, but the report was not delivered (#114)
    #    0               delivered — including when rows FAILED, because the
    #                    report carries that verdict and the dead-man pings
    #                    /fail for it. Job status is not a second copy of the
    #                    cluster's health, or a red would fly every day over
    #                    clusters that are merely unhappy and get switched off
    #                    (#6).
    #
    # 75 rather than a bare 1 so an undelivered report stays distinguishable
    # from a crash and from #112 without reading the log; the Job is Failed
    # either way, but `ttlSecondsAfterFinished: 86400` collects it after a day,
    # which is why the /fail ping above carries the same fact to somewhere that
    # keeps history.
    if [[ $MAIL_DELIVERED -eq 0 ]]; then
      exit 75
    fi
    exit 0
