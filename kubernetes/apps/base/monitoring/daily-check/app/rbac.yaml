---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: daily-check
  namespace: monitoring
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: daily-check
rules:
  # delete is needed to purge ghost pods (terminal-phase pods of replica controllers)
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["delete"]
  - apiGroups: [""]
    resources:
      - nodes
      - pods
      - persistentvolumeclaims
      - persistentvolumes
      - events
      - services
      - namespaces
    verbs: ["get", "list"]
  # Row 28 reads tenant bindings by structure (no impersonation, decision D-b).
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["clusterrolebindings", "rolebindings"]
    verbs: ["list"]
  # Row 30 dry-runs one compliant and one outside HTTPRoute in a tenant
  # namespace (#205): only a write shows whether the hostname policy admits.
  # RBAC cannot say "dry-run only", so ValidatingAdmissionPolicy
  # daily-check-dry-run-only (tenant-admission/) refuses this account any
  # httproutes write that is not a dry-run. create only: no get/update/delete.
  - apiGroups: ["gateway.networking.k8s.io"]
    resources: ["httproutes"]
    verbs: ["create"]
  # Row 27 compares each Cilium agent's backends with the API's ready endpoints.
  - apiGroups: ["discovery.k8s.io"]
    resources: ["endpointslices"]
    verbs: ["list"]
  # The discovered LAN address and its reselection history live on the pool.
  - apiGroups: ["cilium.io"]
    resources: ["ciliumloadbalancerippools"]
    verbs: ["get", "list"]
  - apiGroups: ["apps"]
    resources:
      - deployments
      - statefulsets
      - daemonsets
      - replicasets
    verbs: ["get", "list"]
  - apiGroups: ["batch"]
    resources:
      - cronjobs
      - jobs
    verbs: ["get", "list"]
  - apiGroups: ["kustomize.toolkit.fluxcd.io"]
    resources:
      - kustomizations
    verbs: ["get", "list"]
  - apiGroups: ["helm.toolkit.fluxcd.io"]
    resources:
      - helmreleases
    verbs: ["get", "list"]
  - apiGroups: ["source.toolkit.fluxcd.io"]
    resources:
      - gitrepositories
      - ocirepositories
      - helmrepositories
    verbs: ["get", "list"]
  - apiGroups: ["cert-manager.io"]
    resources:
      - certificates
    verbs: ["get", "list"]
  - apiGroups: ["metrics.k8s.io"]
    resources:
      - nodes
      - pods
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: daily-check
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: daily-check
subjects:
  - kind: ServiceAccount
    name: daily-check
    namespace: monitoring
---
# Reading the backup's per-database result (offsite-backup-status). One named
# ConfigMap in one namespace, not `configmaps` on the ClusterRole above: this
# check needs a single object, and cluster-wide ConfigMap read is a much larger
# grant than the job it does — ConfigMaps routinely hold more than their authors
# intended.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: daily-check-backup-status
  namespace: monitoring
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: ["offsite-backup-status"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: daily-check-backup-status
  namespace: monitoring
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: daily-check-backup-status
subjects:
  - kind: ServiceAccount
    name: daily-check
    namespace: monitoring
