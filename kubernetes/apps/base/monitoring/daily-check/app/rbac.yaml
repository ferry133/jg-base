---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: daily-check
  namespace: monitoring
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: daily-check
rules:
  # delete is needed to purge ghost pods (terminal-phase pods of replica controllers)
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["delete"]
  - apiGroups: [""]
    resources:
      - nodes
      - pods
      - persistentvolumeclaims
      - persistentvolumes
      - events
      - services
      - namespaces
    verbs: ["get", "list"]
  # Row 27 compares each Cilium agent's backends with the API's ready endpoints.
  - apiGroups: ["discovery.k8s.io"]
    resources: ["endpointslices"]
    verbs: ["list"]
  # The discovered LAN address and its reselection history live on the pool.
  - apiGroups: ["cilium.io"]
    resources: ["ciliumloadbalancerippools"]
    verbs: ["get", "list"]
  - apiGroups: ["apps"]
    resources:
      - deployments
      - statefulsets
      - daemonsets
      - replicasets
    verbs: ["get", "list"]
  - apiGroups: ["batch"]
    resources:
      - cronjobs
      - jobs
    verbs: ["get", "list"]
  - apiGroups: ["kustomize.toolkit.fluxcd.io"]
    resources:
      - kustomizations
    verbs: ["get", "list"]
  - apiGroups: ["helm.toolkit.fluxcd.io"]
    resources:
      - helmreleases
    verbs: ["get", "list"]
  - apiGroups: ["source.toolkit.fluxcd.io"]
    resources:
      - gitrepositories
      - ocirepositories
      - helmrepositories
    verbs: ["get", "list"]
  - apiGroups: ["cert-manager.io"]
    resources:
      - certificates
    verbs: ["get", "list"]
  - apiGroups: ["metrics.k8s.io"]
    resources:
      - nodes
      - pods
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: daily-check
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: daily-check
subjects:
  - kind: ServiceAccount
    name: daily-check
    namespace: monitoring
---
# Reading the backup's per-database result (offsite-backup-status). One named
# ConfigMap in one namespace, not `configmaps` on the ClusterRole above: this
# check needs a single object, and cluster-wide ConfigMap read is a much larger
# grant than the job it does — ConfigMaps routinely hold more than their authors
# intended.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: daily-check-backup-status
  namespace: monitoring
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: ["offsite-backup-status"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: daily-check-backup-status
  namespace: monitoring
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: daily-check-backup-status
subjects:
  - kind: ServiceAccount
    name: daily-check
    namespace: monitoring
---
# Row 27 (ferry133/jg-base#159): exec into the Cilium agents to read their BPF
# service map, the only place a stale backend shows — the API cannot see it.
# ferry133 chose this grant on #159 (2026-10-16) knowing its size: the agents
# run as root on every node, and RBAC cannot pin the command, so this Role lets
# the daily-check ServiceAccount exec into ANY pod in kube-system. Kept in a
# Role in kube-system rather than on the ClusterRole above so it does not reach
# any other namespace. The only caller is row 27, which runs exactly
# `cilium-dbg service list -o json`.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: daily-check-cilium-exec
  namespace: kube-system
rules:
  # Listing the agent pods is already on the ClusterRole above.
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: daily-check-cilium-exec
  namespace: kube-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: daily-check-cilium-exec
subjects:
  - kind: ServiceAccount
    name: daily-check
    namespace: monitoring
