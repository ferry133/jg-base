---
apiVersion: v1
kind: Secret
metadata:
  name: daily-check-config
  namespace: monitoring
stringData:
  CLUSTER_NAME: "${CLUSTER_NAME}"
  SMTP_HOST: "${DAILY_CHECK_SMTP_HOST}"
  SMTP_PORT: "587"
  SMTP_USERNAME: "${DAILY_CHECK_SMTP_USERNAME}"
  SMTP_PASSWORD: "${DAILY_CHECK_SMTP_PASSWORD}"
  SMTP_FROM: "${DAILY_CHECK_SMTP_FROM}"
  NOTIFY_EMAIL_TO: "${DAILY_CHECK_NOTIFY_EMAIL_TO}"
  HEALTHCHECKS_PING_URL: "${DAILY_CHECK_HEALTHCHECKS_PING_URL}"
  NAS_SERVER: "${NAS_SERVER}"
  # Presence decides whether a missing backup is a fault or simply not this
  # cluster's job. Empty on a cluster that keeps its own backups.
  BACKUP_R2_BUCKET: "${BACKUP_R2_BUCKET:=}"
  # Endpoint and credentials for reading the destination back (check 21).
  # Already in cluster-secrets — `base/monitoring/backup` writes with the same
  # four values — so this adds no cluster.yaml field and no jg-cluster-template
  # change. Empty wherever the bucket is empty, and check 21 skips rather than
  # fails when they are: not being able to look is a different fact from the
  # archive not being there (ferry133/jg-base#49).
  BACKUP_R2_ENDPOINT: "${BACKUP_R2_ENDPOINT:=}"
  BACKUP_R2_ACCESS_KEY_ID: "${BACKUP_R2_ACCESS_KEY_ID:=}"
  BACKUP_R2_SECRET_ACCESS_KEY: "${BACKUP_R2_SECRET_ACCESS_KEY:=}"
  # Whether this cluster's nodes resolve the way a LAN client does, which is
  # what makes check 18's probe mean anything here. Derived in
  # jg-cluster-template from node_dns_servers — never declared by an operator.
  #
  # `lan` | `public` | empty, and it is words rather than a boolean on purpose
  # (#16). The quotes below do not survive: kustomize emits minimal quoting, so
  # what Flux substitutes into is a bare scalar and the YAML parser re-types it.
  # The predecessor NODE_DNS_IS_LAN came back as a YAML boolean the first time a
  # cluster derived `true`, stringData only accepts strings, and the API server
  # rejected this entire Secret — daily-check did not deploy at all, so all
  # eighteen checks and the dead-man ping went with it. `!!str`, single quotes
  # and block scalars are all normalised away too (measured); only the value
  # domain can fix it, and yes/no/on/off are YAML 1.1 booleans as well.
  #
  # Empty is not the same as `public`: check 18 reports "not measured" for it
  # rather than staying silent, because a check that emits no row reads exactly
  # like one that passed. The rename from NODE_DNS_IS_LAN is what makes that
  # safe to ship alone — a cluster-secrets that still carries the old key just
  # goes unread, instead of feeding `true` back into the same failure.
  NODE_DNS_PATH: "${NODE_DNS_PATH:=}"
  SECRET_DOMAIN: "${SECRET_DOMAIN}"
  ENDPOINTS_TO_PROBE: "${DAILY_CHECK_ENDPOINTS}"
  # factory-agent 3.8 — stalled provisioning ticket reporting. All four are
  # optional and default empty: check 22 is silent unless the repo AND the token
  # are both set, so this reaches every cluster and does nothing on all of them
  # until someone opts in. Only the cluster running factory has any reason to.
  #
  # ⚠️ These are new cluster-secrets variables and jg-cluster-template does not
  # define them yet (schema + cluster-secrets template + cluster.sample.yaml).
  # Until it does, the `:=` defaults are what makes this safe rather than a
  # daily failure — routed on ferry133/jg-cluster-template#8.
  FACTORY_TICKET_REPO: "${FACTORY_TICKET_REPO:=}"
  FACTORY_TICKET_TOKEN: "${FACTORY_TICKET_TOKEN:=}"
  # The ordered stage vocabulary is factory-agent 3.1 and is NOT yet defined, so
  # the prefix is an input rather than a constant here. Inventing label names
  # would have been the same defect 2.4 avoided by waiting for k8scc to publish
  # a real image tag.
  FACTORY_STAGE_LABEL_PREFIX: "${FACTORY_STAGE_LABEL_PREFIX:=}"
  # Empty, NOT ":=48". Kustomize emits minimal quoting, so once Flux substitutes
  # a bare number the value round-trips as a YAML integer and typed apply
  # rejects the whole Secret — `expected string, got 48`. SMTP_PORT above only
  # survives because it is hardcoded rather than substituted. The default lives
  # in run-check.sh's `${FACTORY_STALL_HOURS:-48}` instead, which also keeps it
  # in one place rather than two that can disagree.
  FACTORY_STALL_HOURS: "${FACTORY_STALL_HOURS:=}"
