---
apiVersion: v1
kind: Secret
metadata:
  name: daily-check-config
  namespace: monitoring
stringData:
  CLUSTER_NAME: "${CLUSTER_NAME}"
  SMTP_HOST: "${DAILY_CHECK_SMTP_HOST}"
  SMTP_PORT: "587"
  SMTP_USERNAME: "${DAILY_CHECK_SMTP_USERNAME}"
  SMTP_PASSWORD: "${DAILY_CHECK_SMTP_PASSWORD}"
  SMTP_FROM: "${DAILY_CHECK_SMTP_FROM}"
  NOTIFY_EMAIL_TO: "${DAILY_CHECK_NOTIFY_EMAIL_TO}"
  HEALTHCHECKS_PING_URL: "${DAILY_CHECK_HEALTHCHECKS_PING_URL}"
  NAS_SERVER: "${NAS_SERVER}"
  # Presence decides whether a missing backup is a fault or simply not this
  # cluster's job. Empty on a cluster that keeps its own backups.
  BACKUP_R2_BUCKET: "${BACKUP_R2_BUCKET:=}"
  # The router, for the DNS rebinding check.
  NODE_DEFAULT_GATEWAY: "${NODE_DEFAULT_GATEWAY:=}"
  SECRET_DOMAIN: "${SECRET_DOMAIN}"
  ENDPOINTS_TO_PROBE: "${DAILY_CHECK_ENDPOINTS}"
