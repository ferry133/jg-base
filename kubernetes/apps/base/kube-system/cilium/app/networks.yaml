---
# Exactly the addresses this cluster assigns, rendered by the per-user repo from
# cluster.yaml as one single-address range each.
#
# It was two pools until 2026-08-12 — a wide one covering the node CIDR, kept
# enabled by default, plus a narrow one that took over once a cluster could
# enumerate its addresses. That cannot work: the narrow pool is by definition a
# subset of the wide one, and Cilium rejects any overlap between pools with
# `PoolConflict=cidr_overlap` regardless of `disabled`. The narrow pool never
# allocated a single address; the Services kept working only because Cilium does
# not revoke an address once assigned, so the breakage was invisible until a
# Service was recreated.
#
# So there is one pool, and every cluster must supply its blocks. The empty
# default is not a safe fallback — an empty pool hands out nothing — it exists
# only so the manifest stays valid; a cluster reaching it has not been rendered
# by a current template.
#
# A cluster that has not narrowed supplies its whole node CIDR here, which is
# today's behaviour written out explicitly rather than hardcoded.
#
# Tenant Services never draw from it (ferry133/jg-base#192; fleet-ops root
# `standalone-app-repos` D9 (B)): a Service labelled `jg.tenant` is excluded
# here and selected only by its tenant's own pool. Cilium's serviceSelector
# matches Service labels (measured on jg-jcc2, root 3b.1), and the label is
# made trustworthy by tenant-admission's LoadBalancer policy. No Service the
# platform runs carries the label, so every one of them still matches.
apiVersion: cilium.io/v2
kind: CiliumLoadBalancerIPPool
metadata:
  name: pool
spec:
  allowFirstLastIPs: "No"
  blocks: ${LB_POOL_BLOCKS:=[]}
  serviceSelector:
    matchExpressions:
      - key: jg.tenant
        operator: DoesNotExist
---
# Still v2alpha1: only CiliumLoadBalancerIPPool graduated to v2. The clusters
# serve no v2 for this kind, and applying one fails the whole dry-run.
apiVersion: cilium.io/v2alpha1
kind: CiliumL2AnnouncementPolicy
metadata:
  name: l2-policy
spec:
  loadBalancerIPs: true
  # NOTE: interfaces might need to be set if you have more than one active NIC on your hosts
  # interfaces:
  #   - ^eno[0-9]+
  #   - ^eth[0-9]+
  nodeSelector:
    matchLabels:
      kubernetes.io/os: linux
