---
# The whole node CIDR, and therefore every address on the customer's LAN.
#
# Nothing has gone wrong yet only because every LoadBalancer Service this repo
# ships pins its address with `lbipam.cilium.io/ips` (or spec.loadBalancerIP),
# so automatic allocation has never once run. The first Service that forgets to
# pin gets x.x.x.1 — the default gateway on every cluster here — and l2-policy
# below announces it, because it has no serviceSelector. That is safety by
# coincidence, so `pool-narrow` replaces this one wherever the per-user repo can
# enumerate the addresses actually in use.
#
# Left enabled by default: a cluster whose cluster-secrets predates
# LB_POOL_WIDE_DISABLED keeps exactly today's behaviour rather than silently
# losing every LoadBalancer address.
apiVersion: cilium.io/v2
kind: CiliumLoadBalancerIPPool
metadata:
  name: pool
spec:
  disabled: ${LB_POOL_WIDE_DISABLED:=false}
  allowFirstLastIPs: "No"
  blocks:
    - cidr: "${NODE_CIDR}"
---
# Exactly the addresses this cluster actually assigns, one single-address range
# each, rendered by the per-user repo from cluster.yaml.
#
# Empty when the per-user repo has not been migrated — an empty pool simply has
# nothing to hand out, and `pool` above is still enabled in that case. Cilium
# prefers the oldest matching pool, so this one only ever wins because `pool` is
# disabled, never by being narrower.
apiVersion: cilium.io/v2
kind: CiliumLoadBalancerIPPool
metadata:
  name: pool-narrow
spec:
  blocks: ${LB_POOL_BLOCKS:=[]}
---
# Still v2alpha1: only CiliumLoadBalancerIPPool graduated to v2. The clusters
# serve no v2 for this kind, and applying one fails the whole dry-run.
apiVersion: cilium.io/v2alpha1
kind: CiliumL2AnnouncementPolicy
metadata:
  name: l2-policy
spec:
  loadBalancerIPs: true
  # NOTE: interfaces might need to be set if you have more than one active NIC on your hosts
  # interfaces:
  #   - ^eno[0-9]+
  #   - ^eth[0-9]+
  nodeSelector:
    matchLabels:
      kubernetes.io/os: linux
