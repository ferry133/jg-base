---
# Explicit memory's PostgreSQL, promoted from extras into jg-base
# (ferry133 directive 2026-09-06, #73): every cluster ships the database the
# MCP memory server writes to, with ZERO cluster.yaml configuration. The
# password arrives at runtime via postBuild from cluster-secrets
# (CLAUDECODE_POSTGRES_PASSWORD, derived at render time — jgct#85); no
# template-time structure remains, which is what allows it to live here.
#
# `suspend: true` is the same migration ratchet as im-ks.yaml one directory
# up, and the NAME is new — `claudecode-db`, not the extras copy's
# `claudecode-postgres` — for the same reason im's Kustomization got a new
# name: the extras object is owned by the user repo's applier, and a base
# manifest under the SAME name would have cluster-apps and the extras applier
# force-applying the same object in turns (suspended+base-path vs
# active+extras-path, flipping hourly; on the re-render day the prune
# finalizer takes the PVC and Deployment with it — review catch on PR #74).
# The child objects (Deployment/postgres, PVC/postgres-data, …) keep their
# names. jcom — the only cluster that ran the extra — handed over on
# 2026-09-06 with zero churn, and the sequence is worth keeping: patch the
# OLD child Kustomization to prune:false first, then push the user-repo
# commit that drops the extra (extras-postgres gets pruned but leaves its
# children), and claudecode-db adopts everything by name — pod untouched,
# zero Released PVs, measured. The extras copy was removed after that
# handover; a cluster repo that still references
# kubernetes/apps/extras/claudecode/postgres is pointing at history.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: claudecode-db
  namespace: flux-system
spec:
  suspend: true
  interval: 1h
  path: ./kubernetes/apps/base/claudecode/postgres/app
  postBuild:
    substituteFrom:
      - name: cluster-secrets
        kind: Secret
  prune: true
  sourceRef:
    kind: GitRepository
    name: jg-base
    namespace: flux-system
  targetNamespace: claudecode
  wait: false
