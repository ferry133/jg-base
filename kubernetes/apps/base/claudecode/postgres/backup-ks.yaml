---
# The NAS backup half, split from the database so a cluster without a NAS
# gets nothing here instead of taking the database down with it (#17 — the
# extras copy of this file carries the full incident writeup).
#
# NOT `path: …/backup/${NAS_BACKUP:=nfs}` like the extras copy: base paths
# cannot carry substitution variables — flux-local collects every
# Kustomization under kubernetes/apps/base and substitutes nothing, so a
# `${VAR}` in a path aborts the whole suite at collection (measured, #28;
# im-ks.yaml carries the pointer). The selector moves to the same
# jg-cluster-template patch that unsuspends this object: at render time the
# template knows nas_server and sets `path: …/backup/nfs` or leaves the
# `none` default below.
#
# ## `suspend: false` + the empty path, and NOT `suspend: true` (#82, step 1)
#
# ferry133 ruled (B) on #82 on 2026-09-09: retire this NFS copy, keep the
# off-site bucket, which dumps the same `claudecode/postgres` nightly
# (base/monitoring/backup, `dump_db postgres claudecode`).
#
# Retiring it is three steps in two repos, and the order is the whole point:
#
#   1. (HERE) ship `suspend: false` + the empty `none` path, so that when the
#      render patch goes away this object PRUNES what it created.
#   2. jg-cluster-template drops the `claudecode-db-backup` entry from
#      ks.yaml.j2's `_enabled`; each cluster's next re-render removes the
#      patch, this default takes over, and Flux prunes the CronJob, PV and PVC.
#   3. only then may the files under ./backup/ and this Kustomization be
#      deleted — while any cluster still patches `path: …/backup/nfs`, deleting
#      that directory turns the patch into a build error instead of a removal.
#
# Step 1 must not be `suspend: true`. Suspend stops reconciliation WITHOUT
# removing what the object already created (measured on jcom's
# lan-address-probe, 2026-08-19; im-ks.yaml carries the same warning). A
# suspended Kustomization would strand jcom's working CronJob, PV and PVC with
# nothing left reconciling them — the object would look retired and the
# workload would still be there.
#
# This change is a no-op on every cluster today. Where the render patch is
# present it overrides both fields; where it is absent this object has been
# suspended since birth and therefore owns nothing to prune.
#
# NAS data is not at risk in any step: the PV is `Retain`, and the backup files
# live on the NAS export, which Kubernetes never deletes.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: claudecode-db-backup
  namespace: flux-system
spec:
  suspend: false
  interval: 1h
  path: ./kubernetes/apps/base/claudecode/postgres/backup/none
  postBuild:
    substituteFrom:
      - name: cluster-secrets
        kind: Secret
  prune: true
  sourceRef:
    kind: GitRepository
    name: jg-base
    namespace: flux-system
  targetNamespace: claudecode
  wait: false
  dependsOn:
    - name: claudecode-db
