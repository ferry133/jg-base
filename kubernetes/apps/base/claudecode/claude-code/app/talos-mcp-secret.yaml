---
# Dedicated secret for the talos-mcp sidecar's Talos credentials -- the
# os:reader one (always) and the os:operator one (optional, `operatorConfig`
# below) -- kept separate from claude-code-secret so their blast radius/RBAC
# is visibly distinct from ttyd/OAuth/DB secrets. Only the talos-mcp container
# mounts this; the app container never does.
apiVersion: v1
kind: Secret
metadata:
  name: talos-mcp-secret
  namespace: claudecode
data:
  # Already base64 (TALOS_MCP_CONFIG_B64 is itself a b64-wrapped multi-line
  # talosconfig -- see cluster-secrets.sops.yaml.j2). `data:` fields are
  # expected pre-base64-encoded by Kubernetes, so this decodes correctly
  # into a real talosconfig file when mounted as a volume.
  talosconfig: "${TALOS_MCP_CONFIG_B64:-}"
  # The OPTIONAL second credential (im-onsite-operator-tools): an Omni
  # break-glass talosconfig, role ceiling os:operator, that reaches the nodes
  # DIRECTLY on the LAN -- so the sidecar can still read a node whose
  # SideroLink is down, and can graceful-reboot a node of this cluster after
  # the person at the terminal confirms. Unlike `talosconfig` above this one
  # carries its own client cert AND key. Same b64 wrapping, same `data:`
  # decode-on-mount, same consumer rule: only the talos-mcp container.
  #
  # Empty on every cluster whose cluster.yaml has no talos_operator_config,
  # and empty MUST read as absent on the server side, because a subPath mount
  # of an empty key is a 0-BYTE FILE, not a missing one. Measured on jcom
  # 2026-10-13 with the key above: all three keys length 0 in the live
  # Secret, and /etc/talos-mcp/talosconfig in the talos-mcp container is
  # `-rw-r--r-- 0 bytes`. The server registers no mutating tool and no
  # direct-LAN fallback until this decodes to a real talosconfig (k8scc
  # sub-change im-onsite-operator-tools, 1.1: 0 bytes == absent).
  operatorConfig: "${TALOS_OPERATOR_CONFIG_B64:-}"
stringData:
  # The talosconfig alone has no key material (no local-PGP-key fallback in
  # a fresh container) -- this is the SA's actual bearer credential, read by
  # talosctl directly from env. Endpoint must bypass Cloudflare Tunnel (see
  # talosconfig comment above); consumed as plain env vars, not files.
  saKey: "${TALOS_MCP_SA_KEY:-}"
  omniEndpoint: "${TALOS_MCP_OMNI_ENDPOINT:-}"
