---
# The claudecode state archive's SHARED half: credentials, identity, script.
#
# ⚠️ Lives in `app/` (applied on every cluster), NOT beside the CronJob in
# `im/enabled/` where it was first written -- moved for
# ferry133/jg-cluster-template#202. The archive has two kinds of caller:
#   - the base `im` CronJob (im/enabled/state-archive.yaml), and
#   - one CronJob per EXTRA instance, rendered into the per-user repo by
#     jg-cluster-template from `claude_instances`
#     (templates/config/kubernetes/apps/base/claudecode/claude-code/instances/).
# The cluster that most needs the second kind is a `claudecode_auth0: false`
# one: it runs `im/disabled`, so its ONLY terminal is an extra. Under the `im`
# gate these three objects would not exist there, and every extra's archive
# would mount a Secret and a ConfigMap that are not there -- a pod stuck in
# ContainerCreating, on the one cluster where it matters, reading as "nothing
# ran". The rule "the archive must not exist where the claims do not" binds the
# CronJobs, which mount claims; these three mount nothing and are harmless on a
# cluster with no instance at all.
#
# ⚠️ What this costs: an `im/disabled` cluster now also holds
# `claudecode-archive-config` (the BACKUP_* credentials) in `claudecode`. That
# namespace's terminals are cluster-admin, so it is not new reach; it is one
# more place the same values sit.
# Credentials for the claudecode state archive.
#
# ⚠️ A SECOND copy of the same names, and that is deliberate, not leftover.
# `monitoring/backup` has its own `offsite-backup-config` with these same
# `BACKUP_*` values. A Secret cannot be read across namespaces and this Job
# must live in `claudecode` (a PVC can only be mounted by a pod in its own
# namespace), so the values cannot be borrowed -- they are substituted a second
# time from the same `cluster-secrets` by this directory's Kustomization.
#
# That means scripts/check-substitution-vocabulary.sh now sees these names used
# in two places. That is correct. If you are reading this because you found two
# Secrets with the same keys and assumed one was dead: neither is.
apiVersion: v1
kind: Secret
metadata:
  name: claudecode-archive-config
  namespace: claudecode
type: Opaque
stringData:
  CLUSTER_NAME: "${CLUSTER_NAME}"
  BACKUP_AGE_RECIPIENT: "${BACKUP_AGE_RECIPIENT:=}"
  BACKUP_R2_BUCKET: "${BACKUP_R2_BUCKET:=}"
  BACKUP_R2_ENDPOINT: "${BACKUP_R2_ENDPOINT:=}"
  BACKUP_R2_ACCESS_KEY_ID: "${BACKUP_R2_ACCESS_KEY_ID:=}"
  BACKUP_R2_SECRET_ACCESS_KEY: "${BACKUP_R2_SECRET_ACCESS_KEY:=}"
---
# Its own ServiceAccount, with NO RoleBinding and no mounted token.
#
# The Job reads PVCs it declares and writes to object storage. It calls no
# Kubernetes API at all, so the right amount of access is none -- stated as a
# manifest rather than left to the default ServiceAccount, which would carry a
# token this Job has no use for (ferry133/jg-base#145 condition 2).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: claudecode-archive
  namespace: claudecode
automountServiceAccountToken: false
