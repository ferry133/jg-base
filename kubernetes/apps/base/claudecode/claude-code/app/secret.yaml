---
apiVersion: v1
kind: Secret
metadata:
  name: claude-code-secret
  namespace: claudecode
stringData:
  # ttyd basic auth. Empty on every cluster that keeps the default Auth0 gate
  # -- the HelmRelease only wires this key into the container on
  # `claudecode_auth0: false`.
  TTYD_CREDENTIAL: "${TTYD_CREDENTIAL:-}"
  # Auth0 OIDC, the default gate -- consumed by the oauth2-proxy sidecar.
  # Rendered from auth0.json in the cluster directory; empty only when the
  # cluster opted out.
  OAUTH2_PROXY_CLIENT_ID: "${CLAUDECODE_AUTH0_CLIENT_ID:-}"
  OAUTH2_PROXY_CLIENT_SECRET: "${CLAUDECODE_AUTH0_CLIENT_SECRET:-}"
  OAUTH2_PROXY_COOKIE_SECRET: "${CLAUDECODE_OAUTH2_COOKIE_SECRET:-}"
  # (email allowlist is a chart-rendered ConfigMap, not a Flux var --
  #  postBuild substitution collapses newlines in multi-line values)
  # Phase 2: MCP Memory Server — set to enable DB-backed long-term memory
  # Leave empty to disable (entrypoint.sh checks if non-empty before injecting MCP config)
  DATABASE_URL: "${CLAUDE_CODE_DATABASE_URL:-}"
