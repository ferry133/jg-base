---
# Suspended unless cluster.yaml asks for replicated storage. It is heavier than
# the other provisioners and, unlike them, does not work at all until the nodes
# carry the required Talos extensions.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: longhorn
  namespace: flux-system
spec:
  interval: 1h
  path: ./kubernetes/apps/base/storage/longhorn/app
  # Added with the backup target (#7). Flux performs no substitution at all
  # unless postBuild is present, so before this the `${...}` in helmrelease.yaml
  # would have reached Helm verbatim.
  postBuild:
    substituteFrom:
      - name: cluster-secrets
        kind: Secret
  prune: true
  sourceRef:
    kind: GitRepository
    name: jg-base
    namespace: flux-system
  wait: false
