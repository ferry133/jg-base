---
# The RecurringJob half of Longhorn. Three states, and the third one is the
# reason this file looks the way it does (ferry133/jg-base#7, #29).
#
#   never asked for  jg-base's default below: `suspend: true`, so nothing is
#                    applied and the object never reconciles, therefore has no
#                    status. That last part matters — daily-check's check 2
#                    lists any Kustomization whose Ready is not True, and an
#                    object that never reconciled has no conditions at all, so
#                    every cluster can receive this without turning that check
#                    red. Guarded, not lucky.
#
#   on               jg-cluster-template patches `suspend: false` and
#                    `path: .../backup/enabled`, wherever `longhorn_backup_target`
#                    is set.
#
#   off after being  jg-cluster-template patches `suspend: false` and
#   on               `path: .../backup/disabled` — an empty directory. NOT a
#                    return to `suspend: true`.
#
# ## Why off is an empty path and not a suspend
#
# Because **suspend stops reconciliation, it does not delete what
# reconciliation already created**, and this repo has measured that on a
# different app: 2026-08-19, jcom had `lan-address-probe` suspended=true with
# its Deployment still running 7 days later, plus a stray `pool-discovered` that
# no Service used (daily-check configmap.yaml, check 17).
#
# Suspending here would leave `daily-backup` in longhorn-system and silence the
# only Flux object that would have reported it, in the same instant. #28 spent a
# paragraph refusing `dependsOn: [longhorn]` because an alarm that is always on
# is an alarm nobody reads; a close path built on suspend produces the opposite
# defect — an alarm that can never go off — and that one is worse, because the
# first is at least visible.
#
# What the orphan then does is UNMEASURED and both answers are bad. Clearing
# `LONGHORN_BACKUP_TARGET` makes the chart omit `backup-target` from the
# `longhorn-default-resource` ConfigMap, and omitting a key is not the same as
# setting it empty: Longhorn applies default-resource values to settings the
# user has not overridden, so the previously-set target may simply persist. So
# the orphan either fails nightly against an unset target, or keeps writing
# backups for a cluster that believes it turned them off. Nobody has run the
# close path on a cluster to find out which.
#
# An empty directory sidesteps the question: the Kustomization keeps
# reconciling, its inventory goes empty, and Flux prunes the RecurringJob.
#
# ## Why the gate is not `${...}` in this path
#
# The obvious shape — `path: .../backup/${LONGHORN_BACKUP:=disabled}`, which is
# what `extras/*/postgres` does — kills CI. `cluster-apps` walks
# `./kubernetes/apps/base`, so flux-local collects every Kustomization under it
# and substitutes nothing:
#
#     ERROR: Kustomization 'flux-system/longhorn-backup' path field
#     '...backup/${LONGHORN_BACKUP:=none}' is not a directory
#
# Measured on #28. The extras precedent survives only because extras are
# unreachable from apps/base and CI has never walked one — untested, not proven.
# Keeping a literal path here is also what lets flux-local build and validate
# the RecurringJob on every PR.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: longhorn-backup
  namespace: flux-system
spec:
  suspend: true
  interval: 1h
  # Well under `interval` so the one race that can really happen — a cluster
  # opting in at the moment Longhorn first installs, before the RecurringJob
  # CRD exists — heals in minutes rather than at the next hourly tick.
  #
  # There is deliberately no `dependsOn: [longhorn]`. It would not close that
  # race (`longhorn` runs `wait: false` and does not wait on its HelmRelease
  # either, so it is Ready long before the CRD exists) and it would cost a
  # permanent not-Ready row on every cluster where `longhorn` is suspended,
  # because a Flux Kustomization depending on a suspended one waits forever.
  # An alarm that is always on is an alarm nobody reads.
  retryInterval: 5m
  path: ./kubernetes/apps/base/storage/longhorn/backup/enabled
  prune: true
  sourceRef:
    kind: GitRepository
    name: jg-base
    namespace: flux-system
  wait: false
